<title>Waystone Game Journal</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Courier+Prime:ital,wght@0,400;0,700;1,400&family=IM+Fell+English+SC&family=UnifrakturMaguntia&display=swap">
<style>
/* Layout: the game page is the sheet from game-detail.dc.html, with the journal under each Played
   row and in the session panel. Journal pages follow the calendar page: breadcrumb, title, then
   two panes split by an ink rule. History is revision list + diff.
   Tokens are STYLE_GUIDE.md's. Session numbers are Courier: the display face's old-style
   numerals make "31" read as "3I". */
:root {
    --bg: #F2EAD8; --folio: #E6DBC2; --ink: #2B241C; --muted: #6B5E4B;
    --line: rgba(43, 36, 28, 0.4);
    --rubric: #8E2A1E; --verdigris: #355E52; --ochre: #7A5A12;
    --text: 'Courier Prime', 'Courier New', monospace;
    --display: 'IM Fell English SC', Georgia, serif;
    --black: 'UnifrakturMaguntia', 'IM Fell English SC', serif;
}
@media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
        --bg: #16120E; --folio: #2A231B; --ink: #E8DCC4; --muted: #A8997F;
        --line: rgba(232, 220, 196, 0.3);
        --rubric: #D9735C; --verdigris: #7FB09E; --ochre: #D4A94A;
        color-scheme: dark;
    }
}
:root[data-theme="dark"] {
    --bg: #16120E; --folio: #2A231B; --ink: #E8DCC4; --muted: #A8997F;
    --line: rgba(232, 220, 196, 0.3);
    --rubric: #D9735C; --verdigris: #7FB09E; --ochre: #D4A94A;
    color-scheme: dark;
}
* { box-sizing: border-box; }
body {
    background: var(--bg); color: var(--ink);
    font-family: var(--text); font-size: 1rem; line-height: 1.6;
    padding-left: max(16px, env(safe-area-inset-left, 0px));
    padding-right: max(16px, env(safe-area-inset-right, 0px));
    padding-block: 0 8rem;
}
a { color: var(--rubric); text-underline-offset: 4px; }
:focus-visible { outline: 2px solid var(--rubric); outline-offset: 2px; }
h1:focus { outline: none; }
.wrap { max-width: 72.5rem; margin: 0 auto; }

/* Header (as in the app) */
.header {
    display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 1rem;
    padding: 1.75rem 0 1.125rem; border-bottom: 3px double var(--ink);
}
.logo { font-family: var(--black); font-size: 2.125rem; color: var(--ink); text-decoration: none; line-height: 1; }
.nav { display: flex; gap: 1.75rem; flex-wrap: wrap; }
.nav a {
    padding: .5rem 0; color: var(--muted); text-decoration: none; font-size: .875rem;
    letter-spacing: 2px; text-transform: uppercase; border-bottom: 2px solid transparent;
}
.nav a.active { color: var(--ink); border-bottom-color: var(--rubric); }
.header-right { display: flex; align-items: center; gap: 1rem; font-size: .875rem; }

/* Buttons */
.btn {
    display: inline-flex; align-items: center; justify-content: center; text-decoration: none;
    font-family: var(--text); font-size: .8125rem; letter-spacing: 2px; text-transform: uppercase;
    min-height: 2.5rem; padding: 0 1rem; border: 1px solid var(--line); background: none; color: var(--ink);
    cursor: pointer; transition: background .15s, color .15s, border-color .15s;
}
.btn:hover { background: var(--ink); color: var(--bg); border-color: var(--ink); }
.btn--primary { background: var(--ink); color: var(--bg); border-color: var(--ink); min-height: 2.75rem; }
.btn--primary:hover { opacity: .85; }
.btn--danger { color: var(--rubric); border-color: var(--rubric); }
.btn--danger:hover { background: var(--rubric); border-color: var(--rubric); color: var(--bg); }
.link-btn {
    font: inherit; color: var(--rubric); background: none; border: 0; padding: 0; cursor: pointer;
    text-decoration: underline; text-underline-offset: 4px;
}

/* Title block */
.crumb { display: inline-block; margin-top: 2rem; font-size: .8125rem; letter-spacing: 2px; text-transform: uppercase; }
.title-block {
    display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 1rem 2rem; align-items: end;
    padding: 1.25rem 0 1.75rem; border-bottom: 1px solid var(--ink);
}
.kicker { display: flex; flex-wrap: wrap; align-items: center; gap: .75rem; }
.type-mark { display: inline-flex; align-items: center; gap: .5rem; font-size: .75rem; letter-spacing: 3px; text-transform: uppercase; }
.type-mark svg { width: 1.75rem; height: 1.75rem; fill: none; stroke: currentColor; stroke-width: 1.5; }
.system { font-style: italic; color: var(--muted); font-size: .875rem; }
.badge { font-size: .6875rem; letter-spacing: 2px; text-transform: uppercase; padding: 3px 8px; border: 1px solid currentColor; }
.badge--ongoing { color: var(--verdigris); }
h1 {
    font-family: var(--display); font-weight: 400; font-size: 2.75rem; line-height: 1.1;
    margin: .75rem 0 .5rem; text-wrap: balance; overflow-wrap: anywhere;
}
.drop-cap { font-family: var(--black); color: var(--rubric); font-size: 3.5rem; }
.t-no { font-family: var(--text); font-size: .8em; }
.lede { margin: 0; max-width: 60ch; color: var(--muted); font-size: 1.0625rem; }
.byline { margin: 0; color: var(--muted); font-size: .9375rem; }
.actions { display: flex; flex-wrap: wrap; gap: .625rem; justify-content: flex-end; }
.eyebrow { font-size: .75rem; letter-spacing: 3px; text-transform: uppercase; color: var(--muted); }

h2 {
    font-family: var(--display); font-weight: 400; font-size: 1.5rem; color: var(--rubric);
    margin: 0 0 1rem; display: flex; align-items: baseline; gap: .75rem; flex-wrap: wrap;
}
h2 .count { font-family: var(--text); font-size: .75rem; letter-spacing: 3px; text-transform: uppercase; color: var(--muted); }

/* Rendered Markdown: .game-text in styles.css */
.md { max-width: 65ch; overflow-wrap: anywhere; }
.md p, .md ul, .md ol, .md blockquote { margin: 0 0 1rem; }
.md ul, .md ol { padding-left: 1.5rem; }
.md blockquote { padding-left: 1rem; border-left: 1px solid var(--ink); color: var(--muted); font-style: italic; }
.md h3, .md h4 { margin: 1.5rem 0 .5rem; font-family: var(--display); font-weight: 400; color: var(--rubric); }
.md h3 { font-size: 1.25rem; }
.md h4 { font-size: 1.0625rem; }
.md > :first-child { margin-top: 0; }

/* People */
.people { list-style: none; margin: 0; padding: 0; display: grid; gap: .875rem; }
.person { display: grid; grid-template-columns: auto minmax(0, 1fr); gap: .875rem; align-items: center; }
.person-name { display: block; overflow-wrap: anywhere; }
.person-role { display: block; font-size: .75rem; letter-spacing: 2px; text-transform: uppercase; color: var(--muted); }
.person--dm .person-name { color: var(--rubric); font-weight: 700; }
.person--lead { padding-bottom: .875rem; border-bottom: 1px solid var(--line); }
.you { color: var(--muted); font-weight: 400; }
.avatar {
    width: 2.5rem; height: 2.5rem; border: 1px solid var(--line); background: var(--folio);
    display: grid; place-items: center; font-family: var(--display); font-size: 1.25rem; color: var(--rubric); flex: none;
}
.avatar--sm { width: 1.875rem; height: 1.875rem; font-size: 1rem; }
.panel-foot { padding-top: .875rem; border-top: 1px solid var(--line); font-size: .875rem; color: var(--muted); }

/* The game page: the sheet, ledger and panel from styles.css */
.wrap--game { max-width: 83rem; }
.wrap--game .header { max-width: 80rem; margin-inline: auto; }
.game-sheet { margin-top: 2rem; background: var(--bg); border: 1px solid var(--ink); outline: 1px solid var(--ink); outline-offset: .3125rem; }
.game-sheet h2 { margin: 0; }
.game-sheet h1 { margin: .875rem 0 .625rem; }
.game-sheet-head { display: flex; flex-wrap: wrap; justify-content: space-between; align-items: flex-start; gap: 1rem; padding: 1.25rem 1.5rem; border-bottom: 3px double var(--ink); }
.game-title-block { flex: 1 1 30rem; min-width: 0; }
.game-head-actions { display: flex; align-items: center; gap: 1rem; }
.game-layout { display: flex; gap: 1.75rem; padding: 1.5rem; }
.game-main { display: flex; flex: 1 1 0; flex-direction: column; gap: 2rem; min-width: 0; }
.game-tale { display: flex; flex-direction: column; gap: .75rem; min-width: 0; }
.game-panel { flex: 0 0 23.75rem; min-width: 0; padding-left: 1.75rem; border-left: 1px solid var(--ink); }
.game-panel-inner { position: sticky; top: 1.5rem; display: flex; flex-direction: column; gap: 1rem; }
.game-panel-states, .game-panel-state { display: flex; flex-direction: column; gap: 1rem; }
.game-seats { margin: 0; padding-top: .875rem; border-top: 1px solid var(--line); font-size: .875rem; color: var(--muted); }
.game-foot { display: grid; grid-template-columns: repeat(auto-fit, minmax(6.5rem, 1fr)); gap: .5rem; padding-top: 1rem; border-top: 1px solid var(--ink); }
.game-foot .btn { padding-inline: .5rem; }
.game-chronicle { min-width: 0; padding-top: 2rem; border-top: 1px solid var(--ink); }
.game-ledger-nav { display: flex; flex-wrap: wrap; align-items: baseline; gap: .5rem 1rem; margin-bottom: .75rem; }
.game-ledger-label { padding: .5rem; border-bottom: 1px solid var(--ink); text-align: center; color: var(--muted); font-size: .75rem; letter-spacing: 2px; text-transform: uppercase; }
.game-count { font-size: .75rem; letter-spacing: 3px; text-transform: uppercase; color: var(--muted); }
.calendar-legend { display: flex; flex-wrap: wrap; gap: .875rem; margin-left: auto; color: var(--muted); font-size: .75rem; }
.legend-item::before { content: ''; display: inline-block; width: .625rem; height: .625rem; margin-right: .375rem; vertical-align: -1px; border: 1px solid var(--ink); }
.legend-confirmed::before { border-color: var(--verdigris); background: var(--verdigris); }
.legend-suggested::before { border-style: dashed; }
.calendar-reply-key { color: var(--muted); display: flex; flex-wrap: wrap; gap: .25rem 1rem; margin-top: .625rem; font-size: .75rem; }
.reply-glyph { display: inline-block; width: 1em; height: 1em; vertical-align: -.125em; fill: none; stroke: currentColor; stroke-width: 2.25; stroke-linecap: square; }
.reply-accepted { color: var(--verdigris); }
.reply-tentative { color: var(--ochre); }
.reply-declined, .reply-awaiting { color: var(--rubric); }
.game-ahead-grid { display: grid; grid-template-columns: repeat(7, minmax(0, 1fr)); border-left: 1px solid var(--line); }
.game-cell { position: relative; display: block; aspect-ratio: 1; min-width: 0; padding: 0; container-type: inline-size; overflow: hidden; background: var(--bg); border: 0; border-right: 1px solid var(--line); border-bottom: 1px solid var(--line); color: var(--ink); font: inherit; text-align: left; }
button.game-cell { cursor: pointer; transition: background-color .15s; }
button.game-cell:hover { background: var(--folio); }
.game-cell:focus-visible { outline-offset: -2px; }
.game-cell.is-selected, .game-cell.is-selected:hover { background: var(--folio); outline: 2px solid var(--rubric); outline-offset: -2px; }
.day-frame { position: absolute; inset: 2cqw; display: flex; flex-direction: column; gap: 2cqw; padding: 3.5cqw 4cqw; border: 1px dashed var(--ink); }
.frame-Confirmed { border: 1px solid var(--verdigris); background: color-mix(in srgb, var(--verdigris) 10%, var(--bg)); }
.day-number { display: block; font-size: clamp(.6875rem, 11.5cqw, .875rem); line-height: 1.2; color: var(--ink); }
.day-time { color: var(--muted); font-size: clamp(.6875rem, 10cqw, .78rem); line-height: 1.2; white-space: nowrap; }
.day-tally { display: grid; grid-template-columns: repeat(4, 1fr); margin-top: auto; padding-top: 2cqw; border-top: 1px solid var(--line); text-align: center; }
.frame-Confirmed .day-tally { border-top-color: var(--verdigris); }
.day-tally > * { display: flex; flex-direction: row; align-items: center; justify-content: center; gap: 2px; font-size: clamp(.6875rem, 11cqw, .875rem); line-height: 1.15; }
.day-tally > * + * { border-left: 1px solid var(--line); }
.day-tally b { font-size: inherit; font-weight: 700; }
.day-tally .tally-zero { color: var(--muted); }
.day-tally .tally-zero b { font-weight: 400; }
.game-played-nav { display: grid; grid-template-columns: 1fr auto 1fr; align-items: center; gap: 0 .75rem; margin-top: 2rem; border-bottom: 1px solid var(--ink); }
.game-played-nav .game-ledger-label { grid-column: 2; border-bottom: 0; }
.game-record { grid-column: 3; justify-self: end; min-height: 2.5rem; font-size: .875rem; }

/* Played rows: the button selects the session; the journal line sits under it as a real link */
.game-entries { margin: 0; padding: 0; list-style: none; }
.game-row { border-bottom: 1px solid var(--line); transition: background-color .15s; }
.game-row:has(.game-entry:hover) { background: var(--folio); }
.game-row.is-selected { background: var(--folio); outline: 2px solid var(--rubric); outline-offset: -2px; }
.game-entry { display: grid; grid-template-columns: 3.25rem minmax(0, 1fr) auto; gap: .5rem .75rem; width: 100%; padding: .875rem .75rem .375rem .5rem; background: none; border: 0; color: var(--ink); font: inherit; text-align: left; cursor: pointer; }
.game-entry:focus-visible { outline-offset: -2px; }
.game-entry-no { font-size: 1.375rem; line-height: 1.1; color: var(--rubric); font-variant-numeric: tabular-nums; }
.game-entry-date { display: block; }
.game-entry-meta { display: block; color: var(--muted); font-size: .875rem; font-variant-numeric: tabular-nums; }
.game-attendees { display: flex; flex-wrap: wrap; gap: .25rem; justify-content: flex-end; align-self: center; }
.game-attendees .avatar { border: 2px solid var(--verdigris); }
.game-attendees .attendee--dm { position: relative; display: inline-flex; }
.game-attendees .attendee--dm .avatar { border-color: var(--rubric); }
.attendee--dm::after { content: "♛"; position: absolute; right: -.25rem; bottom: -.375rem; color: var(--rubric); background: var(--bg); font-size: .75rem; line-height: 1; pointer-events: none; }
.game-row.is-selected .attendee--dm::after, .game-row:has(.game-entry:hover) .attendee--dm::after { background: var(--folio); }
.entry-line { display: grid; gap: .125rem; padding: 0 .75rem .875rem 4.5rem; min-width: 0; }
.entry-link { font-family: var(--display); font-size: 1.3125rem; line-height: 1.25; overflow-wrap: anywhere; justify-self: start; }
.entry-none { font-style: italic; color: var(--muted); }
.session-by { font-size: .875rem; color: var(--muted); }
.session-by a { color: var(--rubric); }
.more { margin-top: 1rem; }

/* The panel */
.panel-heading { margin: 0; font-family: var(--display); font-size: 1.5rem; font-weight: 400; line-height: 1.2; text-wrap: balance; }
.panel-heading .drop-cap { font-size: 2.125rem; }
.panel-session { padding: 1rem; border: 1px solid var(--line); }
.panel-session-head { display: flex; flex-wrap: wrap; justify-content: space-between; align-items: center; gap: .5rem; }
.panel-session-time { font-weight: 700; }
.panel-status-tag { padding: .125rem .375rem; border: 1px solid; font-size: .6875rem; letter-spacing: 2px; text-transform: uppercase; }
.chip-Confirmed { color: var(--verdigris); }
.chip-Suggested { border-style: dashed; }
.chip-Played { color: var(--muted); }
.panel-session-meta { color: var(--muted); font-size: .8125rem; margin: .25rem 0 .75rem; }
.panel-empty { color: var(--muted); font-size: .875rem; margin: 0; }
.roster { display: flex; flex-direction: column; }
.roster-row { display: flex; flex-wrap: wrap; align-items: center; gap: .25rem .5rem; padding: .375rem 0; border-bottom: 1px solid var(--line); }
.roster-row:last-child { border-bottom: none; }
.roster-row .avatar { border-width: 2px; }
.roster-name { flex: 1 1 5rem; min-width: 0; font-size: .9375rem; line-height: 1.25; overflow-wrap: break-word; }
.roster-name.is-dm { color: var(--rubric); font-weight: 700; }
.roster-said { flex: none; width: 5.75rem; font-size: .8125rem; font-weight: 700; line-height: 1.2; }
.roster-said.game-detail { width: auto; color: var(--muted); font-weight: 400; }
.avatars-accepted .avatar { border-color: var(--verdigris); }
.avatars-declined .avatar { border-color: var(--rubric); opacity: .6; }
.btn-close { width: 100%; }

/* The journal block in the panel */
.panel-journal { display: grid; gap: .5rem; border-color: var(--ink); }
.journal-title { font-family: var(--display); font-size: 1.3125rem; line-height: 1.25; overflow-wrap: anywhere; }
.journal-excerpt { margin: 0; font-size: .9375rem; }
.panel-journal .session-by { margin: 0; }
.journal-actions { display: flex; flex-wrap: wrap; gap: .5rem; margin-top: .25rem; }
.journal-actions .btn { flex: 1 1 auto; padding-inline: .625rem; }

/* Journal pages: the calendar page's two panes, split by an ink rule */
.split { display: grid; grid-template-columns: minmax(0, 1fr) 23.75rem; gap: 1.75rem; padding-top: 2rem; align-items: start; }
.split > * { min-width: 0; }
.split-side { display: grid; gap: 1rem; padding-left: 1.75rem; border-left: 1px solid var(--ink); }
.split-side .panel-foot { margin: 0; }

@media (max-width: 1024px) {
    .game-layout { flex-direction: column; }
    .game-panel, .game-panel-inner { display: contents; }
    .game-foot { order: -2; padding: 0 0 1.5rem; border-top: 0; border-bottom: 1px solid var(--ink); }
    .game-panel-states { order: 1; padding-top: 1.5rem; border-top: 1px solid var(--ink); }
    .game-ahead-grid { grid-template-columns: repeat(5, minmax(0, 1fr)); }
    .game-cell--filler:nth-child(n+6) { display: none; }
    .split { grid-template-columns: minmax(0, 1fr); }
    .split-side { padding: 1.5rem 0 0; border-left: 0; border-top: 1px solid var(--ink); }
}
@media (max-width: 560px) {
    .game-sheet-head, .game-layout { padding: 1rem; }
    .game-ahead-grid { grid-template-columns: repeat(3, minmax(0, 1fr)); }
    .game-cell--filler:nth-child(n+4) { display: none; }
    .calendar-legend { margin-left: 0; }
    .game-played-nav { grid-template-columns: 1fr; }
    .game-played-nav .game-ledger-label, .game-record { grid-column: 1; }
    .game-record { justify-self: center; }
    .game-entry { grid-template-columns: 2.5rem minmax(0, 1fr); }
    .game-attendees { grid-column: 2; justify-content: flex-start; }
    .entry-line { padding-left: 3.75rem; }
}

/* Entry */
.entry-nav {
    display: flex; flex-wrap: wrap; justify-content: space-between; gap: .75rem 2rem;
    margin-top: 2.5rem; padding-top: 1rem; border-top: 1px solid var(--ink); max-width: 65ch;
}
.entry-nav a:only-child.is-next { margin-left: auto; }
.entry-nav .is-next { text-align: right; }

/* Editor */
.field { display: grid; gap: .25rem; }
.label { font-size: .75rem; letter-spacing: 2px; text-transform: uppercase; color: var(--muted); }
.hint { font-size: .8125rem; color: var(--muted); margin: 0; overflow-wrap: anywhere; }
input[type="text"], textarea {
    font-family: inherit; font-size: 1rem; color: var(--ink); background: transparent; width: 100%; min-width: 0;
}
input[type="text"] { border: none; border-bottom: 1px solid var(--ink); padding: .625rem 2px; border-radius: 0; }
input[type="text"]:focus { outline: none; border-bottom: 2px solid var(--rubric); padding-bottom: calc(.625rem - 1px); }
input::placeholder, textarea::placeholder { color: var(--muted); }
.edit-form { display: grid; gap: 1.5rem; padding-top: 1.5rem; }
.title-row { display: flex; flex-wrap: wrap; align-items: baseline; gap: .25rem .75rem; }
.title-fixed { font-family: var(--display); font-size: 1.75rem; line-height: 1.2; white-space: nowrap; }
.title-row input { flex: 1 1 14rem; font-family: var(--display); font-size: 1.75rem; line-height: 1.2; }
.editor { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 1.5rem; align-items: stretch; }
.pane { display: grid; grid-template-rows: auto minmax(0, 1fr); gap: .375rem; min-width: 0; }
textarea { border: 1px solid var(--line); border-radius: 0; padding: .875rem 1rem; min-height: 28rem; resize: vertical; line-height: 1.55; }
textarea:focus { outline: none; border-color: var(--rubric); box-shadow: inset 0 0 0 1px var(--rubric); }
.preview { border: 1px dashed var(--line); padding: .875rem 1rem; overflow-wrap: anywhere; min-width: 0; }
.preview-title { font-family: var(--display); font-size: 1.5rem; line-height: 1.2; margin: 0 0 .875rem; padding-bottom: .625rem; border-bottom: 1px solid var(--line); }
.tabs { display: none; gap: 0; }
.tab {
    font-family: var(--text); font-size: .8125rem; letter-spacing: 2px; text-transform: uppercase; color: var(--muted);
    background: none; border: 0; border-bottom: 2px solid transparent; min-height: 2.5rem; padding: 0 1rem 0 0; margin-right: .75rem; cursor: pointer;
}
.tab[aria-selected="true"], .tab[aria-pressed="true"] { color: var(--ink); border-bottom-color: var(--rubric); }
.form-foot { display: flex; flex-wrap: wrap; gap: .625rem; align-items: center; }
.notice { border: 1px solid var(--rubric); padding: 1rem 1.25rem; display: grid; gap: .75rem; }
.notice p { margin: 0; }
.notice-title { color: var(--rubric); font-weight: 700; }

/* History */
.history { display: grid; grid-template-columns: 22rem minmax(0, 1fr); gap: 2rem 1.75rem; padding-top: 2rem; align-items: start; }
.revs { list-style: none; margin: 0; padding: 0; border-top: 1px solid var(--ink); }
.rev-item { border-bottom: 1px solid var(--line); }
.rev {
    display: grid; grid-template-columns: auto minmax(0, 1fr); gap: .125rem .75rem; width: 100%; text-align: left;
    font: inherit; color: inherit; background: none; border: 0; padding: .875rem .625rem; cursor: pointer; transition: background .15s;
}
.rev:hover { background: var(--folio); }
.rev[aria-current="true"] { background: var(--folio); outline: 2px solid var(--rubric); outline-offset: -2px; }
.rev .avatar { grid-row: span 3; }

function escapeHtml(s) {
    return String(s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;').replace(/'/g, '&#39;');
}
function renderMarkdown(text) {
    const src = escapeHtml(String(text || '').replace(/\0/g, '').replace(/\r\n?/g, '\n'));
    const inline = (line) => {
        const links = [];
        let out = line.replace(/\[([^\[\]\n]{1,300})\]\(((?:[^()\s]|\([^()\s]*\)){1,2000})\)/g, (m, label, url) => {
            if (!/^(https?:\/\/|mailto:)\S+$/i.test(url)) return m;
            links.push(`<a href="${url}" target="_blank" rel="noopener noreferrer nofollow">${label}</a>`);
            return `\0${links.length - 1}\0`;
        });
        out = out
            .replace(/\*\*(?=[^\s*])([^\n]{1,1000}?)\*\*/g, '<strong>$1</strong>')
            .replace(/(^|[^*\w])\*([^*\s][^*\n]*?)\*(?![*\w])/g, '$1<em>$2</em>')
            .replace(/(^|[^\w])_([^_\s][^_\n]*?)_(?!\w)/g, '$1<em>$2</em>');
        return out.replace(/\0(\d+)\0/g, (m, i) => links[Number(i)]);
    };
    const kindOf = (l) => /^[-*]\s+/.test(l) ? 'ul' : /^\d+\.\s+/.test(l) ? 'ol' : /^&gt;\s?/.test(l) ? 'quote' : 'text';
    const strip = { ul: /^[-*]\s+/, ol: /^\d+\.\s+/, quote: /^&gt;\s?/ };
    const renderRun = (kind, lines) => {
        if (kind === 'text') return `<p>${lines.map(inline).join('<br>')}</p>`;
        const items = lines.map((l) => inline(l.replace(strip[kind], '')));
        if (kind === 'quote') return '<blockquote>' + items.join('<br>') + '</blockquote>';
        return `<${kind}>` + items.map((i) => `<li>${i}</li>`).join('') + `</${kind}>`;
    };
    const blocks = src.split(/\n[ \t]*\n/).map((b) => b.trim()).filter(Boolean);
    return blocks.map((block) => {
        let lines = block.split('\n');
        let out = '';
        const head = lines[0].match(/^(#{1,3})\s+(.*)$/);
        if (head) {
            const tag = head[1].length === 3 ? 'h4' : 'h3';
            out += `<${tag}>${inline(head[2])}</${tag}>`;
            lines = lines.slice(1);
        }
        let run = [], kind = '';
        for (const line of lines) {
            const k = kindOf(line);
            if (run.length && k !== kind) {
                out += renderRun(kind, run);
                run = [];
            }
            kind = k;
            run.push(line);
        }
        return out + (run.length ? renderRun(kind, run) : '');
    }).join('');
}

    const toMine = lcsPairs(base, mine), toTheirs = lcsPairs(base, theirs);

    anchors.push(base.length); // end of text
    for (const anchor of anchors) {

        const ms = mine.slice(m, anchor < base.length ? toMine.get(anchor) : mine.length);
        const ts = theirs.slice(t, anchor < base.length ? toTheirs.get(anchor) : theirs.length);

        } else {

            addOk(mineChanged ? ms : ts);
        }
        if (anchor < base.length) {

    const parts = m.parts, at = parts.indexOf(c);
    const trim = (t) => t.length > 110 ? t.slice(0, 110).trimEnd() + '…' : t;
    const before = !c.isName && at > 0 && !parts[at - 1].conflict ? parts[at - 1].paras.at(-1) : '';
    const after = !c.isName && at >= 0 && at < parts.length - 1 && !parts[at + 1].conflict ? parts[at + 1].paras[0] : '';
    const version = (paras) => {
        if (c.isName) return `<div class="version-name">${esc(paras || 'No name')}</div>`;
        if (!paras.length) return '<p class="same">Removed this paragraph.</p>';
        return `<div class="diff">${diffHtml(diffWords(c.base.join('\n\n'), paras.join('\n\n')).segs)}</div>`;
    };
    const pick = (value, text) => `<button type="button" class="btn" data-act="pick" data-id="${c.id}" data-pick="${value}" aria-pressed="${c.choice === value}">${c.choice === value ? '✓ ' : ''}${esc(text)}</button>`;
    const picked = (value) => c.choice === value || c.choice === 'both' && (value === 'mine' || value === 'theirs') ? ' version--picked' : '';
    const editor = c.choice !== 'edit' ? '' : c.isName
        ? `<div class="field"><label class="label" for="c-${c.id}">Your wording</label><input type="text" id="c-${c.id}" data-conflict="${c.id}" maxlength="80" value="${esc(c.text)}"></div>`
        : `<div class="field"><label class="label" for="c-${c.id}">Your wording</label><textarea id="c-${c.id}" class="conflict-text" data-conflict="${c.id}">${esc(c.text)}</textarea></div>`;
    return `<article class="conflict${isResolved(c) ? ' conflict--done' : ''}" id="card-${c.id}" aria-labelledby="h-${c.id}">
        <h3 class="conflict-head" id="h-${c.id}">${isResolved(c) ? '✓' : '✦'} Conflict ${i + 1} of ${total} · ${label}</h3>
        ${before ? `<p class="context">${esc(trim(before))}</p>` : ''}
        <div class="versions">
            <div class="version${picked('mine')}"><span class="label">Yours</span>${version(c.mine)}</div>
            <div class="version${picked('theirs')}"><span class="label">${esc(who)}'s</span>${version(c.theirs)}</div>
        </div>
        ${after ? `<p class="context">${esc(trim(after))}</p>` : ''}
        <div class="picks" role="group" aria-label="Which version to keep">
            ${pick('mine', 'Keep yours')}${pick('theirs', `Keep ${who}'s`)}${!c.isName && !c.base.length ? pick('both', 'Keep both') : ''}${pick('edit', c.isName ? 'Write it myself' : 'Combine by hand')}
        </div>
        ${editor}
    </article>`;
}
function mergePreviewHtml() {
    const d = state.edit, m = d.merge;
    const nc = m.nameConflict;
    const title = nc && !isResolved(nc)
        ? `${GAME} <span class="t-no">${d.no}</span>: <span class="unresolved">name to be decided</span>`
        : titleHtml(d.no, mergedName(m));
    const list = conflictsOf(m);
    const body = m.parts.map((p) => {
        if (!p.conflict) return renderMarkdown(p.paras.join('\n\n'));
        if (isResolved(p)) return renderMarkdown(resolvedParas(p).join('\n\n'));
        return `<p class="unresolved">✦ Conflict ${list.indexOf(p) + 1} goes here once you decide</p>`;
    }).join('');
    return `<p class="preview-title">${title}</p><div class="md">${body}</div>`;
}
function refreshMergeStatus() {
    const list = conflictsOf(state.edit.merge);
    document.getElementById('mergeSummary').innerHTML = mergeSummaryHtml();
    document.getElementById('mergePv').innerHTML = mergePreviewHtml();
    document.getElementById('mergeSave').disabled = !list.every(isResolved);
}

function viewHistory(no) {
    const revs = entries[no], cur = revs.at(-1);
    if (!state.hist || state.hist.no !== no || !revs.some((r) => r.n === state.hist.sel)) {
        state.hist = { no, sel: cur.n, mode: 'changes' };
    }
    const h = state.hist;
    const list = [...revs].reverse().map((r) => {
        const prev = revs.find((x) => x.n === r.n - 1);
        const d = prev ? diffWords(prev.body, r.body) : null;
        const delta = d
            ? `<span class="rev-delta" aria-label="${d.added} words added, ${d.removed} removed"><span class="plus">+${d.added}</span> <span class="minus">−${d.removed}</span></span>`
            : '<span class="rev-delta">New entry</span>';
        return `<li class="rev-item"><button type="button" class="rev" data-act="select-rev" data-rev="${r.n}" aria-current="${r.n === h.sel}">
            ${avatar(r.by)}
            <span class="rev-head"><span class="rev-no">Revision ${r.n}</span>${r.n === cur.n ? '<span class="tag">✓ Current</span>' : ''}</span>
            <span class="rev-meta">${esc(nameOf(r.by))}${isYou(r.by) ? ' (you)' : ''} · ${esc(r.at)}</span>
            <span class="rev-note">${esc(revNote(r) || 'No note')} ${delta}</span>
        </button></li>`;
    }).join('');
    return `
    ${crumbs(['Games', '#game'], [GAME, '#game'], [`Session ${no}`, '#entry-' + no], ['History'])}
    <section class="title-block" style="grid-template-columns:minmax(0,1fr)">
        <div>
            <span class="eyebrow">History · ${revs.length} revision${revs.length === 1 ? '' : 's'}</span>
            <h1 tabindex="-1">${titleHtml(no, cur.name, true)}</h1>
            <p class="byline">${esc(bylineText(revs))}</p>
        </div>
    </section>
    <div class="history">
        <ol class="revs" reversed aria-label="Revisions, newest first">${list}</ol>
        <section class="detail" id="revDetail" aria-live="polite">${detailHtml(no)}</section>
    </div>`;
}
function detailHtml(no) {
    const revs = entries[no], h = state.hist, cur = revs.at(-1);
    const r = revs.find((x) => x.n === h.sel);
    const prev = revs.find((x) => x.n === r.n - 1);
    let action;
    if (r.n === cur.n) action = '<span class="legend">This is the current version.</span>';
    else if (canWrite()) action = `<button type="button" class="btn btn--primary" data-act="restore-open">Restore this version</button>`;
    else action = '<span class="legend">Only the DM and players can restore.</span>';

    let bodyHtml;
    if (h.mode === 'full') {
        bodyHtml = `<p class="preview-title" style="margin:0">${titleHtml(no, r.name)}</p><div class="md">${renderMarkdown(r.body)}</div>`;
    } else if (!prev) {
        bodyHtml = `<p class="same">This is the first version of the entry, so there is nothing to compare it with.</p><div class="md">${renderMarkdown(r.body)}</div>`;
    } else {
        const d = diffWords(prev.body, r.body);
        const nameChange = prev.name !== r.name
            ? `<p class="name-change"><span class="label">Session name</span><br><del>${esc(prev.name || 'none')}</del> → <ins>${esc(r.name || 'none')}</ins></p>` : '';
        const text = d.added || d.removed
            ? `<div class="diff">${diffHtml(d.segs)}</div>`
            : `<p class="same">The text did not change in this revision.</p>`;
        bodyHtml = nameChange + text;
    }
    return `
    <div class="detail-head">
        <div>
            <h2 class="detail-title" style="margin:0">§ Revision <span class="t-no">${r.n}</span></h2>
            <p class="detail-sub">${esc(nameOf(r.by))} · ${esc(r.at)}${revNote(r) ? ' · ' + esc(revNote(r)) : ''}</p>
        </div>
        ${action}
    </div>
    <div class="toolbar">
        <div role="group" aria-label="Show">
            <button type="button" class="tab" data-act="hist-mode" data-mode="changes" aria-pressed="${h.mode === 'changes'}">Changes</button>
            <button type="button" class="tab" data-act="hist-mode" data-mode="full" aria-pressed="${h.mode === 'full'}">Full text</button>
        </div>
        ${h.mode === 'changes' && prev ? `<span class="legend">Against revision ${prev.n}: <ins>added</ins> · <del>removed</del></span>` : ''}
    </div>
    ${bodyHtml}`;
}

/* ---------- Routing ---------- */
function parseRoute() {
    const m = location.hash.match(/^#(entry|edit|history)-(\d+)$/);
    if (!m || !session(Number(m[2]))) return { view: 'game' };
    return { view: m[1], no: Number(m[2]) };
}
function render(moveFocus) {
    let r = parseRoute();
    if (r.view === 'edit' && !canWrite()) r = { view: 'entry', no: r.no };
    if (r.view === 'history' && !entries[r.no]) r = { view: 'entry', no: r.no };
    state.route = r;
    document.querySelector('.wrap').classList.toggle('wrap--game', r.view === 'game');
    main.innerHTML =
        r.view === 'entry' ? viewEntry(r.no) :
        r.view === 'edit' ? viewEdit(r.no) :
        r.view === 'history' ? viewHistory(r.no) : viewGame();
    document.getElementById('whoami').textContent = state.viewer === 'visitor' ? 'Visitor' : nameOf(state.viewer);
    document.querySelectorAll('[data-act="viewer"]').forEach((b) => b.setAttribute('aria-pressed', b.dataset.viewer === state.viewer));
    const canSim = r.view === 'edit' && !!entries[r.no], merging = !!state.edit?.merge;
    document.getElementById('simOther').hidden = !canSim;
    document.getElementById('simOther').textContent = merging ? 'Tobin saves again' : 'Tobin saves: other paragraph';
    document.getElementById('simSame').hidden = !canSim || merging;
    if (moveFocus) {
        window.scrollTo(0, 0);
        main.querySelector('h1')?.focus({ preventScroll: true });
    }
}
function go(hash) {
    if (location.hash === hash) render(true); else location.hash = hash;
}
window.addEventListener('hashchange', () => render(true));

/* ---------- Saving ---------- */
function saveEntry() {
    const d = state.edit;
    let name = d.name.trim(), body = d.body.trim();
    d.error = '';
    if (!body) {
        d.error = 'Write some text before saving the entry.';
        document.getElementById('notice').innerHTML = noticeHtml();
        return;
    }
    const cur = latest(d.no);
    if (cur && cur.n !== d.base) {
        const base = entries[d.no].find((r) => r.n === d.base);
        const merge = merge3(base.body, body, cur.body);
        const nameResult = mergeName(base.name, name, cur.name);
        const m = { ...merge, by: cur.by, theirsN: cur.n, name: nameResult.name || '', nameConflict: nameResult.conflict || null };
        if (conflictsOf(m).length) {
            d.merge = m;
            render(true);
            return;
        }
        body = mergedText(m);
        name = m.name;
        d.mergedFrom = { by: cur.by, n: cur.n };
        d.base = cur.n;
    }
    if (cur && cur.name === name && toParas(cur.body).join('\n\n') === toParas(body).join('\n\n')) {
        showMessage(d.mergedFrom ? `Your changes were already in ${nameOf(d.mergedFrom.by)}'s revision, so no revision was saved.` : 'Nothing changed, so no revision was saved.', 'info');
        state.edit = null;
        go('#entry-' + d.no);
        return;
    }
    const n = cur ? cur.n + 1 : 1;
    (entries[d.no] = entries[d.no] || []).push({
        n, by: state.viewer, at: 'just now', note: d.note.trim() || (cur ? '' : 'First draft'), name, body, mergedFrom: d.mergedFrom,
    });
    const merged = d.mergedFrom;
    state.edit = null;
    showMessage(merged ? `Merged with ${nameOf(merged.by)}'s changes and saved as revision ${n}` : cur ? `Saved as revision ${n}` : 'Entry saved', 'success');
    go('#entry-' + d.no);
}

/* ---------- Events ---------- */
main.addEventListener('input', (ev) => {
    const d = state.edit;
    if (!d) return;
    if (ev.target.id === 'fName') {
        d.name = ev.target.value;
        document.getElementById('pvTitle').innerHTML = titleHtml(d.no, d.name.trim());
    } else if (ev.target.id === 'fBody') {
        d.body = ev.target.value;
        document.getElementById('pvBody').innerHTML = renderMarkdown(d.body);
    } else if (ev.target.id === 'fNote') {
        d.note = ev.target.value;
    } else if (ev.target.dataset.conflict && d.merge) {
        conflictsOf(d.merge).find((c) => c.id === ev.target.dataset.conflict).text = ev.target.value;
        refreshMergeStatus();
    }
});
main.addEventListener('submit', (ev) => {
    ev.preventDefault();
    saveEntry();
});
// Mock-up only: stages an edit by Tobin and a matching change in your draft.
function simulate(kind) {
    const d = state.edit, cur = latest(d.no);
    const add = (paras, i, text) => { if (i >= 0 && i < paras.length) paras[i] += ' ' + text; };
    const theirs = toParas(cur.body);
    const lastI = theirs.length - 1;
    if (d.merge) {
        add(theirs, lastI, 'Bishop walked into camp at dawn.');
        entries[d.no].push({ n: cur.n + 1, by: 'tobin', at: 'just now', note: 'One more detail', name: cur.name, body: theirs.join('\n\n') });
        showMessage('Tobin saved again. Your choices will be merged with it when you save.', 'info');
        return;
    }
    const mine = toParas(d.body);
    let name = cur.name;
    add(mine, 0, 'Sable said it was too early.');
    if (kind === 'same') {
        add(theirs, 0, 'Bishop bit Tobin before we reached the gate.');
        const plain = theirs.findIndex((p, i) => i >= 2 && i < lastI && !/^([-*#>]|\d+\.)/.test(p));
        add(theirs, plain, 'Hesk never told us why.');
        if (lastI > 1) add(mine, lastI, 'Wren kept watch anyway.');
        if (cur.name) {
            name = 'The Cold Summit';
            d.name = 'The Cracked Stone';
        }
    } else {
        add(theirs, lastI, 'Bishop walked into camp at dawn.');
    }
    d.body = mine.join('\n\n');
    entries[d.no].push({ n: cur.n + 1, by: 'tobin', at: 'just now', note: 'Added a detail', name, body: theirs.join('\n\n') });
    render(false);
    showMessage('Tobin saved, and your draft was edited too. Now press Save changes.', 'info');
}
document.addEventListener('click', (ev) => {
    const el = ev.target.closest('[data-act]');
    if (!el) return;
    const act = el.dataset.act;
    if (act === 'noop') {
        showMessage('Not part of this mock-up.', 'info');
    } else if (act === 'theme') {
        const root = document.documentElement;
        const dark = root.dataset.theme ? root.dataset.theme === 'dark' : matchMedia('(prefers-color-scheme: dark)').matches;
        root.dataset.theme = dark ? 'light' : 'dark';
    } else if (act === 'viewer') {
        state.viewer = el.dataset.viewer;
        render(false);
    } else if (act === 'tab') {
        state.edit.tab = el.dataset.tab;
        document.getElementById('editor').dataset.tab = el.dataset.tab;
        document.querySelectorAll('[data-act="tab"]').forEach((b) => b.setAttribute('aria-pressed', b.dataset.tab === state.edit.tab));
    } else if (act === 'cancel-edit') {
        const no = state.edit.no;
        state.edit = null;
        go(entries[no] ? '#entry-' + no : '#game');
    } else if (act === 'simulate') {
        simulate(el.dataset.kind);
    } else if (act === 'pick') {
        const m = state.edit.merge, c = conflictsOf(m).find((x) => x.id === el.dataset.id);
        c.choice = el.dataset.pick;
        if (c.choice === 'edit' && !c.isName && !c.text) c.text = [...c.mine, ...c.theirs].join('\n\n');
        render(false);
        main.querySelector(`[data-id="${c.id}"][data-pick="${c.choice}"]`)?.focus({ preventScroll: true });
    } else if (act === 'merge-back') {
        // Keeps the draft and its starting revision, so saving merges again.
        const d = state.edit;
        d.merge = null;
        render(true);
    } else if (act === 'merge-save') {
        const d = state.edit, m = d.merge;
        d.body = mergedText(m);
        d.name = mergedName(m);
        d.mergedFrom = { by: m.by, n: m.theirsN };
        d.base = m.theirsN;
        d.merge = null;
        saveEntry();
    } else if (act === 'select-session' || act === 'show-company') {
        const back = act === 'show-company' ? state.selected : el.dataset.no;
        state.selected = act === 'show-company' ? null : el.dataset.no;
        render(false);
        main.querySelector(`[data-act="select-session"][data-no="${back}"]`)?.focus({ preventScroll: true });
        if (act === 'select-session' && matchMedia('(max-width: 1024px)').matches) document.getElementById('gamePanelStates').scrollIntoView();
    } else if (act === 'select-rev') {
        state.hist.sel = Number(el.dataset.rev);
        const no = state.hist.no;
        render(false);
        main.querySelector(`[data-rev="${state.hist.sel}"]`)?.focus({ preventScroll: true });
        if (matchMedia('(max-width: 768px)').matches) document.getElementById('revDetail').scrollIntoView();
    } else if (act === 'hist-mode') {
        state.hist.mode = el.dataset.mode;
        document.getElementById('revDetail').innerHTML = detailHtml(state.hist.no);
        main.querySelector(`[data-mode="${state.hist.mode}"]`)?.focus();
    } else if (act === 'restore-open') {
        const h = state.hist, revs = entries[h.no], r = revs.find((x) => x.n === h.sel);
        document.getElementById('dlgTitle').innerHTML = `Restore revision <span class="t-no">${r.n}</span>?`;
        document.getElementById('dlgText').textContent =
            `The entry goes back to ${nameOf(r.by)}'s version from ${shortDate(r.at)}. This saves as revision ${revs.at(-1).n + 1}. The current version stays in the history, so you can undo this.`;
        document.getElementById('restoreDlg').showModal();
    } else if (act === 'delete-open') {
        const no = state.route.no, revs = entries[no];
        document.getElementById('delTitle').innerHTML = `Delete the entry for session <span class="t-no">${no}</span>?`;
        document.getElementById('delText').textContent =
            `This deletes "${titleText(no, latest(no).name)}" and all ${revs.length} of its revisions, including text written by other people. It cannot be undone. The session itself stays, and someone can write a new entry for it.`;
        document.getElementById('deleteDlg').showModal();
    } else if (act === 'delete-cancel') {
        document.getElementById('deleteDlg').close();
    } else if (act === 'delete-confirm') {
        const no = state.route.no;
        delete entries[no];
        state.hist = null;
        if (state.edit && state.edit.no === no) state.edit = null;
        document.getElementById('deleteDlg').close();
        showMessage(`Entry for session ${no} deleted`, 'success');
        go('#game');
    } else if (act === 'restore-cancel') {
        document.getElementById('restoreDlg').close();
    } else if (act === 'restore-confirm') {
        const h = state.hist, revs = entries[h.no], r = revs.find((x) => x.n === h.sel);
        const n = revs.at(-1).n + 1;
        revs.push({ n, by: state.viewer, at: 'just now', note: '', restoredFrom: r.n, name: r.name, body: r.body });
        h.sel = n;
        document.getElementById('restoreDlg').close();
        render(false);
        showMessage(`Restored revision ${r.n} as revision ${n}`, 'success');
        main.querySelector(`[data-rev="${n}"]`)?.focus({ preventScroll: true });
    }
});

render(false);
</script>
