<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Access rights - Waystone</title>
    <link rel="icon" href="/static/img/favicon.svg" type="image/svg+xml">
    <script src="/static/theme.js?v=8"></script>
    <link rel="stylesheet" href="/static/styles.css?v=84">
    <link rel="stylesheet" href="/static/notifications.css?v=12">
    <link rel="stylesheet" href="/static/admin.css?v=1">
    <script defer src="/static/vendor/alpinejs.min.js"></script>
    <style>
        .access-user { white-space: nowrap; }
        @media (max-width: 480px) { .access-user { white-space: normal; } }
        .access-note { color: var(--muted); font-size: 0.8125rem; }
        .access-check { text-align: center; width: 5rem; }
        .access-check input { margin: 0; width: 1.125rem; height: 1.125rem; accent-color: var(--ink); }
        .access-grid td select { width: 8rem; min-height: 2.5rem; padding: 0.25rem 0.5rem; border: 1px dashed var(--muted); color: var(--muted); cursor: pointer; }
        .access-grid td select[data-level="see"] { border: 1px solid var(--ochre); color: var(--ochre); background: color-mix(in srgb, var(--ochre) 10%, var(--bg)); font-weight: 500; }
        .access-grid td select[data-level="edit"] { border: 1px solid var(--verdigris); color: var(--bg); background: var(--verdigris); font-weight: 600; }
        /* No See Codices: the level is kept but has no effect */
        .access-grid tr.is-off td select[data-level] { border-color: var(--muted); color: var(--muted); background: none; }
        .access-grid td select:focus { outline: 2px solid var(--rubric); outline-offset: 2px; }
        .access-grid select option { font-weight: 400; }
    </style>
</head>
<body x-data="adminAccessPage()">
    <div class="header">
        <div class="header-left">
            <a href="/" class="logo">Waystone</a>
        </div>
        <nav class="nav-bar" aria-label="Main">
            <a href="/" class="nav-item" data-page="dashboard">Home</a>
            <a href="/campaigns" class="nav-item" data-page="campaigns">Games</a>
            <a href="/characters" class="nav-item" data-page="characters">Characters</a>
            <a href="/codices" class="nav-item" data-page="codex" data-codex hidden>Codices</a>
            <a href="/admin/users" class="nav-item active" aria-current="page" data-page="admin-users" x-show="isAdmin">Admin</a>
        </nav>
        <div class="header-right">
            <details class="user-menu">
                <summary><span class="user-menu-avatar" aria-hidden="true" x-text="(displayName || '?').charAt(0).toUpperCase()"></span><span class="user-menu-name" x-text="displayName"></span><span class="user-menu-caret" aria-hidden="true">&#9662;</span></summary>
                <div class="user-menu-panel">
                    <a href="/profile">Profile</a>
                    <button type="button" @click="logout()">Log out</button>
                </div>
            </details>
        </div>
    </div>

    <main class="container">
        <nav class="admin-tabs" aria-label="Admin sections">
            <a href="/admin/users">Users</a>
            <a href="/admin/access" aria-current="page">Access rights</a>
            <a href="/admin/systems">Systems</a>
            <a href="/admin/integrations">Integrations</a>
            <a href="/admin/discord">Discord</a>
        </nav>
        <h1 class="page-title"><span class="drop-cap">A</span>ccess rights</h1>
        <p class="form-hint" style="margin-bottom: 1rem;">Admins always have every right and aren't listed.</p>

        <div x-show="messageVisible" x-text="messageText" role="status"
            :class="messageType === 'error' ? 'message error' : 'message success'"
            style="display: none;"></div>

        <section class="card" style="margin-bottom: 1rem; overflow-x: auto;">
            <h2 class="section-header">Codices module</h2>
            <table>
                <thead>
                    <tr>
                        <th>User</th>
                        <th class="access-check">See Codices</th>
                        <th class="access-check">Edit Codices</th>
                    </tr>
                </thead>
                <tbody>
                    <template x-for="u in users" :key="u.id">
                        <tr>
                            <td class="access-user">
                                <span x-text="u.display_name"></span>
                                <span class="access-note" x-text="u.username"></span>
                                <span class="access-note" x-show="u.blocked">Blocked</span>
                            </td>
                            <td class="access-check"><input type="checkbox" :checked="hasRight(u, 'codices.see')" :aria-label="'See Codices: ' + u.display_name" @change="setRight(u, 'codices.see', $event)"></td>
                            <td class="access-check"><input type="checkbox" :checked="hasRight(u, 'codices.edit')" :aria-label="'Edit Codices: ' + u.display_name" @change="setRight(u, 'codices.edit', $event)"></td>
                        </tr>
                    </template>
                    <tr x-show="loaded && users.length === 0">
                        <td colspan="3" class="admin-empty">no users besides admins</td>
                    </tr>
                </tbody>
            </table>
        </section>

        <section class="card" style="overflow-x: auto;">
            <h2 class="section-header">Codices</h2>
            <table class="access-grid">
                <thead>
                    <tr>
                        <th>User</th>
                        <template x-for="c in codices" :key="c.id">
                            <th x-text="c.name"></th>
                        </template>
                    </tr>
                </thead>
                <tbody>
                    <template x-for="u in users" :key="u.id">
                        <tr :class="{ 'is-off': !hasRight(u, 'codices.see') }">
                            <td class="access-user">
                                <span x-text="u.display_name"></span>
                                <span class="access-note" x-text="u.username"></span>
                                <span class="access-note" x-show="u.blocked">Blocked</span>
                                <div class="access-note" x-show="!hasRight(u, 'codices.see')">No access until See Codices is on</div>
                            </td>
                            <template x-for="c in codices" :key="c.id">
                                <td>
                                    <select :value="level(c.id, u.id)" :data-level="level(c.id, u.id)" :aria-label="c.name + ': ' + u.display_name" @change="setLevel(c, u, $event)">
                                        <option value="none">No access</option>
                                        <option value="see">See</option>
                                        <option value="edit">Edit</option>
                                    </select>
                                </td>
                            </template>
                        </tr>
                    </template>
                    <tr x-show="loaded && (users.length === 0 || codices.length === 0)">
                        <td :colspan="codices.length + 1" class="admin-empty">nothing to set yet</td>
                    </tr>
                </tbody>
            </table>
        </section>
    </main>

    <script src="/static/notifications.js?v=15"></script>
    <script src="/admin-access.js?v=1"></script>
</body>
</html>
