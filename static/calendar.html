<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Waystone - Calendar</title>
    <link rel="icon" href="/static/img/favicon.svg" type="image/svg+xml">
    <script src="/static/theme.js?v=8"></script>
    <link rel="stylesheet" href="/static/styles.css?v=87">
    <link rel="stylesheet" href="/static/notifications.css?v=13">
    <script defer src="/static/vendor/alpinejs.min.js"></script>
</head>
<body x-data="calendarPage()">
    <div class="header">
        <div class="header-left">
            <a href="/" class="logo">Waystone</a>
        </div>
        <nav class="nav-bar" aria-label="Main">
            <a href="/" class="nav-item" data-page="dashboard">Home</a>
            <a href="/campaigns" class="nav-item active" aria-current="page" data-page="campaigns">Games</a>
            <a href="/characters" class="nav-item" data-page="characters">Characters</a>
            <a href="/codices" class="nav-item" data-page="codex" data-codex hidden>Codices</a>
            <a href="/admin/users" class="nav-item" data-page="admin-users" x-show="isAdmin">Admin</a>
        </nav>
        <div class="header-right">
            <details class="user-menu">
                <summary><span class="user-menu-avatar" aria-hidden="true" x-text="(displayName || '?').charAt(0).toUpperCase()"></span><span class="user-menu-name" x-text="displayName"></span><span class="user-menu-caret" aria-hidden="true">&#9662;</span></summary>
                <div class="user-menu-panel">
                    <a href="/profile">Profile</a>
                    <button type="button" @click="handleLogout()">Log out</button>
                </div>
            </details>
        </div>
    </div>

    <div class="container">
        <main id="calendarPage" @keydown.escape.window="showPollDialog ? backToCalendar() : (picking && !pollSubmitting && cancelPicking())">
            <nav class="game-crumb" aria-label="Breadcrumb">
                <a :href="campaign ? '/campaigns#campaign-' + encodeURIComponent(campaign.id) : '/campaigns'">Games</a>
                <template x-if="campaign">
                    <span><span aria-hidden="true"> › </span><a :href="'/games/' + encodeURIComponent(campaign.id)" x-text="campaign.title"></a></span>
                </template>
                <span aria-hidden="true"> › </span><span aria-current="page">Calendar</span>
            </nav>

            <p x-show="loading">Loading calendar...</p>
            <div class="game-error" role="alert" x-show="loadError">
                <p x-text="loadError"></p>
                <button type="button" class="campaign-action-btn" @click="load()">Try again</button>
            </div>
            <template x-if="notFound">
                <p>This game could not be found. It may have been deleted.</p>
            </template>
            <template x-if="forbidden">
                <p>Only the game's DM and players can see its calendar. <a :href="'/games/' + encodeURIComponent(campaign.id)" x-text="'Back to ' + campaign.title"></a></p>
            </template>

            <template x-if="campaign && !forbidden">
                <div>
                    <section class="calendar-head">
                        <div>
                            <p class="modal-eyebrow">Calendar of sessions</p>
                            <h1 class="page-title" x-text="campaign.title"></h1>
                        </div>
                        <a href="/profile#calendar-sync" class="calendar-sync-link">Add to my calendar app</a>
                    </section>
                    <div class="calendar-layout">
                        <div class="calendar-main" x-ref="calendarMain">
                            <!-- Month Navigation -->
                            <div class="calendar-nav">
                                <button type="button" class="nav-btn" @click="previousMonth()" aria-label="Previous month">&lsaquo;</button>
                                <span class="current-month"><span class="month-name" x-text="formatMonthName()"></span> <span class="month-year" x-text="formatYear()"></span></span>
                                <button type="button" class="nav-btn" @click="nextMonth()" aria-label="Next month">&rsaquo;</button>
                                <div class="calendar-legend">
                                    <span class="legend-item legend-confirmed">confirmed</span>
                                    <span class="legend-item legend-suggested">suggested</span>
                                    <span class="legend-item legend-cancelled">cancelled</span>
                                    <span class="legend-item legend-poll"><span class="legend-poll-tag" aria-hidden="true">A</span> poll</span>
                                </div>
                                <div class="calendar-message message" :class="messageType" x-show="messageVisible" role="status" x-text="messageText"></div>
                            </div>

                            <!-- Calendar Grid -->
                            <div class="calendar-grid">
                                <!-- Day headers -->
                                <div class="calendar-day-header">Mon</div>
                                <div class="calendar-day-header">Tue</div>
                                <div class="calendar-day-header">Wed</div>
                                <div class="calendar-day-header">Thu</div>
                                <div class="calendar-day-header">Fri</div>
                                <div class="calendar-day-header">Sat</div>
                                <div class="calendar-day-header">Sun</div>

                                <!-- Calendar days -->
                                <template x-for="(day, idx) in calendarDays" :key="idx">
                                    <div class="calendar-day"
                                         :class="{
                                             'other-month': !isCurrentMonth(day),
                                             'has-session': hasSession(day),
                                             'is-selected': isSelectedDay(day),
                                             'is-today': isToday(day),
                                             'is-pick-target': picking && isCurrentMonth(day) && !pickSelection[formatDateLocal(day)] && !getPickBlockReason(day),
                                             'is-pick-blocked': picking && isCurrentMonth(day) && !pickSelection[formatDateLocal(day)] && getPickBlockReason(day),
                                             'is-pick-selected': picking && isCurrentMonth(day) && pickSelection[formatDateLocal(day)],
                                             'is-poll-sibling': isPollSibling(day),
                                             'day-suggested': getDayStatusClass(day) === 'day-suggested',
                                             'day-confirmed': getDayStatusClass(day) === 'day-confirmed',
                                             'day-cancelled': getDayStatusClass(day) === 'day-cancelled'
                                         }"
                                         :title="getDayTitle(day)"
                                         :aria-label="getDayAriaLabel(day)"
                                         role="button"
                                         tabindex="0"
                                         @mouseenter="hoverPollId = pollIdOfDay(day); hoverDay = formatDateLocal(day)"
                                         @mouseleave="hoverPollId = ''; hoverDay = ''"
                                         @click="handleDayActivate(day)"
                                         @keydown.enter.prevent="handleDayActivate(day)"
                                         @keydown.space.prevent="handleDayActivate(day)">
                                        <div class="day-number" x-show="!hasSession(day)" x-text="day.getDate()"></div>
                                        <template x-for="s in getCellSessions(day)" :key="s.id">
                                            <div class="day-frame" :class="`frame-${s.status}${isStrongCandidate(s) ? ' is-candidate' : ''}`">
                                                <svg class="day-march" aria-hidden="true" x-show="isStrongCandidate(s)"><rect/></svg>
                                                <span class="day-candidate-mark" aria-hidden="true" x-show="isStrongCandidate(s)">✦</span>
                                                <div class="day-frame-head">
                                                    <span class="day-number" x-text="day.getDate()"></span>
                                                    <template x-if="getPollTag(day)">
                                                        <span class="day-poll-tag"><span x-text="getPollTag(day).letter"></span><span class="day-poll-of" x-text="' ' + getPollTag(day).n + '/' + getPollTag(day).of"></span></span>
                                                    </template>
                                                    <span class="day-overflow" x-show="getCellOverflow(day) > 0">+<span x-text="getCellOverflow(day)"></span><span class="day-overflow-word"> more</span></span>
                                                </div>
                                                <div class="day-time" x-text="s.time"></div>
                                                <div class="day-cancelled-word" x-show="s.status === 'Cancelled'">cancelled</div>
                                                <div class="day-tally" x-show="s.status !== 'Cancelled'">
                                                    <template x-for="c in getTally(s)" :key="c.kind">
                                                        <div :class="`reply-${c.kind}${c.n ? '' : ' tally-zero'}`">
                                                            <span x-html="replyGlyph(c.kind)"></span><b x-text="c.n"></b>
                                                        </div>
                                                    </template>
                                                </div>
                                            </div>
                                        </template>
                                    </div>
                                </template>
                            </div>
                            <div class="calendar-reply-key" x-show="!picking">
                                <span class="reply-accepted" x-html="replyGlyph('accepted') + ' yes'"></span>
                                <span class="reply-tentative">? maybe</span>
                                <span class="reply-declined" x-html="replyGlyph('declined') + ' no'"></span>
                                <span class="reply-awaiting">… no reply yet</span>
                                <span><span class="legend-star" aria-hidden="true">✦</span> strong candidate</span>
                            </div>
                        </div>

                        <!-- Day / agenda panel -->
                        <aside class="calendar-panel" x-ref="dayPanel">
                            <div class="calendar-paste-bar" x-show="picking">
                                <span class="pick-label" x-text="getPickLabel()"></span>
                                <p class="paste-note" :class="pickNote.type" role="status" x-text="getPickNote()"></p>
                                <ul class="pick-list" x-show="pickCount > 0">
                                    <template x-for="d in pickedDates" :key="d">
                                        <li><span x-text="formatShortDate(d)"></span><span x-text="picking?.preset?.time || ''"></span></li>
                                    </template>
                                </ul>
                                <div class="paste-actions">
                                    <button type="button" class="btn-action" x-ref="pickCancel" :disabled="pollSubmitting" @click="cancelPicking()">Cancel<span class="paste-esc-hint">(Esc)</span></button>
                                    <button type="button" class="btn-create" x-ref="pickNext" :disabled="!pickCount || pollSubmitting" @click="openPollDialog()" x-text="pickCount ? 'Next: set times (' + pickCount + ')' : 'Next'"></button>
                                </div>
                            </div>
                            <template x-if="selectedDay">
                                <div>
                                    <p class="modal-eyebrow">Selected day</p>
                                    <h3 class="panel-heading" x-text="formatDayHeading(selectedDay)"></h3>
                                    <p class="panel-empty" x-show="getSelectedDaySessions().length === 0">No sessions on this day.</p>
                                    <template x-for="g in getPanelGroups()" :key="g.key">
                                        <div class="poll-card" :class="{ 'is-poll': g.poll?.multi, 'awaits-reply': pollGroupAwaitsMe(g) }">
                                            <p class="poll-card-head" x-show="g.poll?.multi" x-text="g.poll ? pollHeading(g.poll) : ''"></p>
                                            <template x-for="s in g.sessions" :key="s.id">
                                                <div class="panel-session" :data-session="s.id" :class="{ 'awaits-reply': !g.poll?.multi && awaitsMe(s), 'is-current': !!g.poll?.multi && s.id === g.selectedId }">
                                                    <div class="panel-session-head">
                                                        <span class="panel-session-time"><span x-show="g.poll?.multi" x-text="formatAgendaDate(s) + ' · '"></span><span x-text="getSessionTimeRangeZone(s)"></span></span>
                                                        <span class="panel-status-tag" :class="`chip-${s.status}`" x-text="s.status"></span>
                                                    </div>
                                                    <div class="panel-session-meta" x-text="getSessionMeta(s)"></div>

                                                    <p class="panel-candidate" x-show="isStrongCandidate(s)"><span class="panel-candidate-mark" aria-hidden="true">✦</span> <span x-text="getCandidateNote(s)"></span></p>
                                                    <p class="panel-empty" x-show="isPastSuggestion(s)">This date has passed.</p>
                                                    <div class="roster" x-show="getRoster(s).length > 0">
                                                        <template x-for="row in getRoster(s)" :key="row.key">
                                                            <div class="roster-row" :class="`avatars-${row.cls}`">
                                                                <span class="roster-avatar" x-html="avatarHtml(row.user)"></span>
                                                                <span class="roster-name" x-text="row.user.display_name || row.user.name || 'Unknown'"></span>
                                                                <span class="roster-said" :class="[`reply-${row.kind}`, row.you ? 'is-you' : '']"><span x-html="replyGlyph(row.kind)"></span> <span x-text="row.label"></span></span>
                                                            </div>
                                                        </template>
                                                    </div>

                                                    <div class="player-responses" x-show="!isCurrentUserDM && s.status !== 'Cancelled' && !isPastSuggestion(s)">
                                                        <div class="session-actions session-replies" role="group" aria-label="Your reply">
                                                            <button type="button" class="btn-response btn-response--accepted"
                                                                    :class="{ 'selected': s.current_user_participation === 'Accepted' }"
                                                                    @click="submitResponse('Accepted', s)">Yes</button>
                                                            <button type="button" class="btn-response btn-response--tentative"
                                                                    :class="{ 'selected': s.current_user_participation === 'Tentative' }"
                                                                    @click="submitResponse('Tentative', s)">Maybe</button>
                                                            <button type="button" class="btn-response btn-response--declined"
                                                                    :class="{ 'selected': s.current_user_participation === 'Declined' }"
                                                                    @click="submitResponse('Declined', s)">No</button>
                                                        </div>
                                                    </div>

                                                    <div class="panel-dm-actions" x-show="isCurrentUserDM && s.status !== 'Cancelled'">
                                                        <div class="session-actions">
                                                            <button type="button" class="btn-action btn-action-confirm"
                                                                    x-show="s.status === 'Suggested' && !isPastSuggestion(s)"
                                                                    @click="requestSessionStatusChange('Confirmed', s)">Confirm</button>
                                                            <button type="button" class="btn-action btn-action-cancel"
                                                                    x-text="s.status === 'Suggested' ? 'Withdraw' : 'Cancel'"
                                                                    @click="requestSessionStatusChange('Cancelled', s)"></button>
                                                            <button type="button" class="btn-action" @click="copySession(s)">Copy</button>
                                                        </div>
                                                        <p class="session-status-warning" x-show="selectedSession && selectedSession.id === s.id && pendingSessionAction" x-text="selectedSession && selectedSession.id === s.id ? getSessionStatusWarning() : ''"></p>
                                                    </div>
                                                </div>
                                            </template>
                                            <div class="poll-card-foot panel-dm-actions" x-show="isCurrentUserDM && g.poll">
                                                <div class="session-actions">
                                                    <button type="button" class="btn-action" @click="addPollDate(g.poll)">+ Add a date</button>
                                                    <button type="button" class="btn-action" @click="openRepeat(currentCampaignId, g.poll.id, g.poll.dates)">Repeat…</button>
                                                    <button type="button" class="btn-action btn-action-cancel" x-show="g.poll?.multi" @click="requestPollWithdraw(g.poll)">Withdraw poll</button>
                                                </div>
                                                <p class="session-status-warning" x-show="g.poll && pendingPollWithdraw === g.poll.id" x-text="g.poll ? getPollWithdrawWarning(g.poll) : ''"></p>
                                            </div>
                                        </div>
                                    </template>
                                    <button type="button" class="btn-action panel-suggest" x-show="isCurrentUserDM && !picking && !getPickBlockReason(selectedDay)" @click="openCreateSession(selectedDay)">+ Suggest session</button>
                                    <button type="button" class="btn-close" @click="clearSelectedDay()">Show month agenda</button>
                                </div>
                            </template>
                            <template x-if="!selectedDay">
                                <div>
                                    <p class="modal-eyebrow">Month agenda</p>
                                    <h3 class="panel-heading" x-text="`Sessions in ${formatMonthYear()}`"></h3>
                                    <p class="panel-empty" x-show="sessions.length === 0">No sessions this month.</p>
                                    <template x-for="row in agendaRows" :key="row.key">
                                        <button type="button" class="agenda-row" :class="row.cls" @click="selectDay(parseDateLocal(row.date))">
                                            <span class="agenda-date" x-text="formatShortDate(row.date)"></span>
                                            <span class="agenda-time" x-text="row.text"></span>
                                            <span class="agenda-status" x-text="row.status"></span>
                                        </button>
                                    </template>
                                    <button type="button" class="btn-action panel-suggest" x-show="isCurrentUserDM && !picking" @click="startPicking({ mode: 'new' })">Suggest dates</button>
                                </div>
                            </template>
                        </aside>
                    </div>
                </div>
            </template>
        </main>
    </div>

    <!-- Suggest dates dialog: a row per picked day -->
    <div id="pollDialog" class="modal" :class="{ 'modal-open': showPollDialog }" role="dialog" aria-modal="true" aria-labelledby="pollDialogTitle" @click.self="backToCalendar()">
        <div class="modal-content">
            <div class="modal-header">
                <div class="modal-title-block"><p class="modal-eyebrow" x-text="currentCampaignTitle"></p>
                <h2 id="pollDialogTitle" x-text="picking?.mode === 'add' ? 'Add dates' : 'Suggest dates'"></h2></div>
                <button type="button" class="modal-close" aria-label="Close" @click="backToCalendar()">&times;</button>
            </div>
            <form @submit.prevent="submitPoll()" class="modal-form">
                <div class="poll-rows">
                    <div class="poll-rows-head" aria-hidden="true"><span>Date</span><span>Start</span><span>Length</span><span></span></div>
                    <template x-for="(r, i) in pollRows" :key="r.date">
                        <div class="poll-row">
                            <span class="poll-row-date"><span x-text="formatShortDate(r.date)"></span><small x-text="r.date.slice(0, 4)"></small></span>
                            <input type="time" required x-model="r.time" :aria-label="'Start on ' + formatShortDate(r.date)">
                            <select :aria-label="'Length on ' + formatShortDate(r.date)" @change="r.duration = Number($event.target.value)">
                                <template x-for="m in lengthOptions(r)" :key="m">
                                    <option :value="m" :selected="m === r.duration" x-text="lengthLabel(m)"></option>
                                </template>
                            </select>
                            <button type="button" class="poll-row-x" :aria-label="'Remove ' + formatShortDate(r.date)" @click="removePollRow(i)">&times;</button>
                        </div>
                    </template>
                    <div class="poll-rows-under">
                        <button type="button" class="text-link" x-show="pollRows.length > 1" @click="useFirstRowForAll()">Use the first row's time for all</button>
                        <button type="button" class="text-link" @click="backToCalendar()">Back to the calendar</button>
                    </div>
                </div>
                <div class="form-group">
                    <label for="pollTimezone">Timezone</label>
                    <select id="pollTimezone" x-model="pollTimezone" required>
                        <template x-for="tz in timezoneOptions" :key="tz">
                            <option :value="tz" x-text="tz" :selected="tz === pollTimezone"></option>
                        </template>
                    </select>
                </div>
                <p class="poll-error" role="alert" x-show="pollError" x-text="pollError"></p>
                <div class="modal-actions">
                    <button type="submit" class="btn-create" :disabled="pollSubmitting || pollRows.length === 0" x-text="pollSubmitLabel"></button>
                    <button type="button" class="btn-cancel" :disabled="pollSubmitting" @click="closePollDialog()">Cancel</button>
                </div>
            </form>
        </div>
    </div>

    <!-- Repeat dialog -->
    <div id="repeatDialog" class="modal repeat-modal" :class="{ 'modal-open': repeat.open }" role="dialog" aria-modal="true" aria-labelledby="repeatDialogTitle" @click.self="closeRepeat()" @keydown.escape.window="repeat.open && closeRepeat()">
        <div class="modal-content">
            <div class="modal-header">
                <div class="modal-title-block"><p class="modal-eyebrow" x-text="currentCampaignTitle"></p>
                <h2 id="repeatDialogTitle" x-text="repeat.edit ? 'Edit repeating poll' : 'Repeat this poll'"></h2></div>
                <button type="button" class="modal-close" aria-label="Close" @click="closeRepeat()">&times;</button>
            </div>
            <form @submit.prevent="saveRepeat()" class="modal-form">
                <div class="form-group">
                    <label for="repeatEvery">Every</label>
                    <select id="repeatEvery" @change="repeat.every = Number($event.target.value)">
                        <template x-for="n in [1, 2, 3, 4]" :key="n">
                            <option :value="n" :selected="n === repeat.every" x-text="n === 1 ? 'week' : n + ' weeks'"></option>
                        </template>
                    </select>
                </div>
                <div class="form-group">
                    <label for="repeatLead">Post</label>
                    <select id="repeatLead" @change="repeat.lead = Number($event.target.value)">
                        <template x-for="n in repeatLeadOptions()" :key="n">
                            <option :value="n" :selected="n === repeat.lead" x-text="n + ' days ahead'"></option>
                        </template>
                    </select>
                </div>
                <div class="form-group" x-show="!repeat.edit">
                    <span class="repeat-pattern-label">Pattern</span>
                    <p class="repeat-pattern" x-text="repeatPattern()"></p>
                    <span class="form-hint">This is the poll's current dates. Confirming a date removes the others, so set the dates up before you confirm.</span>
                </div>
                <p class="form-hint" x-show="repeat.existing && !repeat.edit" x-text="'This replaces the current schedule: ' + repeatReplaces() + '.'"></p>
                <p class="poll-error" role="alert" x-show="repeat.error" x-text="repeat.error"></p>
                <div class="modal-actions">
                    <button type="submit" class="btn-create" :disabled="repeat.busy" x-text="repeat.edit ? 'Save' : 'Repeat'"></button>
                    <button type="button" class="btn-cancel" :disabled="repeat.busy" @click="closeRepeat()">Cancel</button>
                </div>
            </form>
        </div>
    </div>

    <script src="/static/notifications.js?v=17"></script>
    <script src="/campaigns.js?v=69"></script>
    <script src="/static/calendar.js?v=6"></script>
</body>
</html>
