<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Users - Waystone</title>
    <script src="/static/theme.js?v=4"></script>
    <link rel="stylesheet" href="/static/styles.css?v=41">
    <link rel="stylesheet" href="/static/notifications.css?v=9">
    <script defer src="/static/vendor/alpinejs.min.js"></script>
    <style>
        [x-cloak] { display: none !important; }
        /* Action buttons: secondary by default (label.action-btn is hit by the global label rule) */
        .action-btn {
            display: inline-flex;
            align-items: center;
            margin: 0;
            padding: 0.375rem 0.875rem;
            min-height: 2.5rem;
            background: none;
            color: var(--ink);
            border: 1px solid var(--line);
            cursor: pointer;
            font-family: inherit;
            font-size: 0.75rem;
            text-transform: uppercase;
            letter-spacing: 0.125rem;
            transition: color 0.15s, background-color 0.15s, border-color 0.15s;
            white-space: nowrap;
        }
        .action-btn:hover { background: var(--ink); color: var(--bg); border-color: var(--ink); }
        .action-btn:disabled { opacity: 0.5; cursor: not-allowed; }
        .action-btn.danger { color: var(--rubric); border-color: var(--rubric); }
        .action-btn.danger:hover { background: var(--rubric); color: var(--bg); }
        /* Add buttons sit beside inputs, so they must not stretch */
        .submit-btn { width: auto; padding: 0.625rem 1.25rem; }
        /* Confirm modal overlay: display:flex here so x-show toggling display:none doesn't revert to block */
        .modal-overlay {
            position: fixed;
            inset: 0;
            background: var(--backdrop);
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 100;
        }
        .modal-overlay .card { background: var(--bg); border: 1px solid var(--ink); outline: 1px solid var(--ink); outline-offset: 0.3125rem; }
        /* Table */
        table { width: 100%; border-collapse: collapse; font-size: 0.875rem; }
        th, td { text-align: left; padding: 0.625rem 0.5rem; }
        th { color: var(--muted); border-bottom: 1px solid var(--ink); font-size: 0.75rem; font-weight: 400; text-transform: uppercase; letter-spacing: 0.125rem; }
        tbody tr { border-bottom: 1px solid var(--line); }
        tbody tr:hover { background: var(--folio); }
        .admin-tag { font-size: 0.75rem; text-transform: uppercase; letter-spacing: 0.125rem; }
        .admin-tag--danger { color: var(--rubric); }
        .admin-tag--ok { color: var(--verdigris); }
        .admin-tag--muted { color: var(--muted); }
        .admin-empty { padding: 1.25rem 0.5rem; color: var(--muted); text-align: center; }
    </style>
</head>
<body x-data="adminUsersPage()">
    <div class="header">
        <div class="header-left">
            <a href="/" class="logo">Waystone</a>
        </div>
        <nav class="nav-bar" aria-label="Main">
            <a href="/" class="nav-item" data-page="dashboard">Dashboard</a>
            <a href="/campaigns" class="nav-item" data-page="campaigns">Games</a>
            <a href="/profile" class="nav-item" data-page="profile">Profile</a>
            <a href="/admin/users" class="nav-item active" aria-current="page" data-page="admin-users" x-show="isAdmin">Admin</a>
        </nav>
        <div class="header-right">
            <span class="user-name" x-text="displayName"></span>
            <button @click="logout()" class="logout-btn">Logout</button>
        </div>
    </div>

    <main class="container">
        <h1 class="page-title"><span class="drop-cap">U</span>ser Management</h1>
        <!-- Add user form -->
        <section class="card" style="margin-bottom: 1rem;">
            <h2 class="section-header">Add User</h2>
            <form @submit.prevent="addUser()" style="display: flex; gap: 0.5rem; flex-wrap: wrap;">
                <input type="text" x-model="newUsername" placeholder="username" required pattern="[A-Za-z0-9_\-]{2,32}" autocapitalize="none" style="flex: 1;">
                <input type="text" x-model="newName" placeholder="name (optional)" style="flex: 1;">
                <button type="submit" :disabled="loading" class="submit-btn">Add</button>
            </form>
        </section>

        <!-- Temporary password banner -->
        <div x-cloak x-show="tempPassword" class="card" style="margin-bottom: 1rem; border-color: var(--ink);">
            <p class="form-hint" style="margin-bottom: 0.625rem;">
                Temporary password for <strong x-text="tempPassword && tempPassword.username"></strong>.
                Give this to the user; they must change it at first login. It will not be shown again.
            </p>
            <div style="display: flex; gap: 0.5rem; align-items: center; flex-wrap: wrap;">
                <code x-text="tempPassword && tempPassword.password" style="font-size: 1.125rem; letter-spacing: 0.0625rem; user-select: all;"></code>
                <button @click="copyTempPassword()" class="action-btn">copy</button>
                <button @click="tempPassword = null" class="action-btn">dismiss</button>
            </div>
        </div>

        <!-- Message area -->
        <div x-show="messageVisible" x-text="messageText"
            :class="messageType === 'error' ? 'message error' : 'message success'"
            style="display: none;"></div>

        <!-- Search -->
        <div style="margin-bottom: 1rem;">
            <input type="text" x-model="searchQuery" placeholder="search by username or name...">
        </div>

        <!-- Users table -->
        <div class="card" style="overflow-x: auto;">
            <table>
                <thead>
                    <tr>
                        <th>Username</th>
                        <th>Display Name</th>
                        <th>Status</th>
                        <th>Roles</th>
                        <th>Actions</th>
                    </tr>
                </thead>
                <tbody>
                    <template x-for="user in filteredUsers" :key="user.id">
                        <tr>
                            <td x-text="user.username"></td>
                            <td x-text="user.nickname || user.name || '—'"></td>
                            <td>
                                <span x-show="user.blocked" class="admin-tag admin-tag--danger">✗ blocked</span>
                                <span x-show="!user.blocked && !user.must_change_password" class="admin-tag admin-tag--ok">● active</span>
                                <span x-show="!user.blocked && user.must_change_password" class="admin-tag admin-tag--muted">… pending first login</span>
                            </td>
                            <td>
                                <span x-show="user.roles && user.roles.includes('admin')" class="admin-tag">♛ admin</span>
                                <span x-show="!user.roles || !user.roles.includes('admin')" class="admin-tag admin-tag--muted">—</span>
                            </td>
                            <td>
                                <div style="display: flex; gap: 0.375rem; flex-wrap: wrap;">
                                    <button x-show="!user.is_env_admin" @click="confirmAction('reset password', 'reset password for ' + user.username + '? their current password will stop working.', () => resetPassword(user))" class="action-btn">reset password</button>
                                    <button x-show="!user.blocked && !user.is_env_admin" @click="confirmAction('block user', 'block ' + user.username + '?', () => blockUser(user.id))" class="action-btn danger">block</button>
                                    <button x-show="user.blocked" @click="unblockUser(user.id)" class="action-btn">unblock</button>
                                    <button x-show="!user.roles || !user.roles.includes('admin')" @click="confirmAction('make admin', 'promote ' + user.username + ' to admin?', () => makeAdmin(user.id))" class="action-btn">make admin</button>
                                    <button x-show="user.roles && user.roles.includes('admin') && !user.is_env_admin" @click="confirmAction('remove admin', 'remove admin from ' + user.username + '?', () => removeAdmin(user.id))" class="action-btn danger">remove admin</button>
                                    <button x-show="!user.is_env_admin" @click="confirmAction('remove user', 'permanently remove ' + user.username + '?', () => removeUser(user.id))" class="action-btn danger">remove</button>
                                </div>
                            </td>
                        </tr>
                    </template>
                    <tr x-show="filteredUsers.length === 0">
                        <td colspan="5" class="admin-empty">no users found</td>
                    </tr>
                </tbody>
            </table>
        </div>

        <!-- Systems -->
        <section class="card" style="margin-top: 1rem; overflow-x: auto;">
            <h2 class="section-header">Systems</h2>
            <form @submit.prevent="addSystem()" style="display: flex; gap: 0.5rem; flex-wrap: wrap; align-items: center; margin-bottom: 1rem;">
                <input type="text" x-model="newSystemName" placeholder="system name" required maxlength="64" style="flex: 1;">
                <input type="file" x-ref="newSystemLogo" accept="image/png,image/jpeg,image/webp,image/gif">
                <button type="submit" :disabled="loading" class="submit-btn">Add</button>
            </form>
            <table>
                <thead>
                    <tr>
                        <th>Logo</th>
                        <th>Name</th>
                        <th>Actions</th>
                    </tr>
                </thead>
                <tbody>
                    <template x-for="s in systems" :key="s.id">
                        <tr>
                            <td>
                                <img x-show="s.logo_url" :src="s.logo_url || ''" :alt="s.name" style="height: 2rem; max-width: 6rem; object-fit: contain;">
                                <span x-show="!s.logo_url" class="admin-tag admin-tag--muted">—</span>
                            </td>
                            <td x-text="s.name"></td>
                            <td>
                                <div style="display: flex; gap: 0.375rem; flex-wrap: wrap;">
                                    <button @click="renameSystem(s)" class="action-btn">rename</button>
                                    <label class="action-btn" style="cursor: pointer;">logo<input type="file" hidden accept="image/png,image/jpeg,image/webp,image/gif" @change="uploadLogo(s.id, $event.target.files[0]); $event.target.value = ''"></label>
                                    <button x-show="s.logo_url" @click="removeLogo(s.id)" class="action-btn danger">remove logo</button>
                                    <button @click="confirmAction('delete system', 'delete ' + s.name + '? games using it keep the name as plain text.', () => deleteSystem(s.id))" class="action-btn danger">delete</button>
                                </div>
                            </td>
                        </tr>
                    </template>
                    <tr x-show="systems.length === 0">
                        <td colspan="3" class="admin-empty">no systems yet</td>
                    </tr>
                </tbody>
            </table>
        </section>

        <!-- Confirm modal -->
        <div x-cloak x-show="confirmModal.visible" class="modal-overlay">
            <div class="card" style="max-width: 25rem; width: 90%; text-align: center;">
                <h3 x-text="confirmModal.title" style="margin-bottom: 0.75rem;"></h3>
                <p x-text="confirmModal.message" class="form-hint" style="margin-bottom: 1.5rem;"></p>
                <div style="display: flex; gap: 0.75rem; justify-content: center;">
                    <button @click="confirmModal.onConfirm(); confirmModal.visible = false" class="action-btn danger">Confirm</button>
                    <button @click="confirmModal.visible = false" class="action-btn">Cancel</button>
                </div>
            </div>
        </div>
    </main>

    <script src="/static/notifications.js?v=8"></script>
    <script src="/admin-users.js?v=3"></script>
</body>
</html>
