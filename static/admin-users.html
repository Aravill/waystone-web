<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Users - Waystone</title>
    <link rel="stylesheet" href="/dashboard.css?v=1">
    <script defer src="/static/vendor/alpinejs.min.js"></script>
    <style>
        /* Action buttons — style-guide compliant */
        .action-btn {
            padding: 6px 14px;
            background: #000;
            color: #00d9ff;
            border: 1px solid #00d9ff;
            cursor: pointer;
            font-family: 'Fira Code', monospace;
            font-size: 0.8em;
            text-transform: uppercase;
            letter-spacing: 1px;
            transition: all 0.2s;
            white-space: nowrap;
        }
        .action-btn:hover { background: #00d9ff; color: #000; }
        .action-btn:disabled { opacity: 0.5; cursor: not-allowed; }
        .action-btn.danger { color: #ff006e; border-color: #ff006e; }
        .action-btn.danger:hover { background: #ff006e; color: #000; }
        /* Submit button for add-user form */
        .submit-btn {
            padding: 10px 20px;
            background: #000;
            color: #00d9ff;
            border: 1px solid #00d9ff;
            cursor: pointer;
            font-family: 'Fira Code', monospace;
            font-size: 0.85em;
            text-transform: uppercase;
            letter-spacing: 1px;
            transition: all 0.2s;
        }
        .submit-btn:hover { background: #00d9ff; color: #000; }
        .submit-btn:disabled { opacity: 0.5; cursor: not-allowed; }
        /* Messages */
        .message { padding: 12px 16px; margin-bottom: 16px; font-size: 0.9rem; border: 1px solid; }
        .message.success { background: #0a1a0a; color: #00ff7f; border-color: #00ff7f; }
        .message.error { background: #1a0a0a; color: #ff006e; border-color: #ff006e; }
        /* Confirm modal overlay — display:flex here so x-show toggling display:none doesn't revert to block */
        .modal-overlay {
            position: fixed;
            inset: 0;
            background: rgba(0,0,0,0.8);
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 100;
        }
        /* Table */
        table { width: 100%; border-collapse: collapse; font-size: 0.85rem; }
        th, td { text-align: left; padding: 10px 8px; }
        th { color: #888; border-bottom: 1px solid #333; font-size: 0.8em; text-transform: uppercase; letter-spacing: 0.05em; }
        tbody tr { border-bottom: 1px solid #1a1a1a; }
        tbody tr:hover { background: #0a0a0a; }
    </style>
</head>
<body x-data="adminUsersPage()" x-init="init()">
    <div class="header">
        <div class="header-left">
            <a href="/" class="logo">Waystone</a>
        </div>
        <div class="header-center">
            <h1>Admin - User Management</h1>
        </div>
        <div class="header-right">
            <span class="user-name" x-text="displayName"></span>
            <button @click="logout()" class="logout-btn">Logout</button>
        </div>
    </div>

    <div class="nav-bar">
        <a href="/" class="nav-item" data-page="dashboard">Dashboard</a>
        <a href="/campaigns" class="nav-item" data-page="campaigns">Campaigns</a>
        <a href="/profile" class="nav-item" data-page="profile">Profile</a>
        <a href="/admin/users" class="nav-item active" data-page="admin-users" x-show="isAdmin">Admin</a>
    </div>

    <main class="container" style="max-width: 1100px; margin: 0 auto; padding: 20px; flex-direction: column; align-items: stretch; justify-content: flex-start;">
        <!-- Add user form -->
        <section class="card" style="margin-bottom: 16px;">
            <h2 style="margin-bottom: 16px; font-size: 0.85rem; text-transform: uppercase; letter-spacing: 0.1em; color: #888;">Add User to Whitelist</h2>
            <form @submit.prevent="addUser()" style="display: flex; gap: 8px;">
                <input type="email" x-model="newEmail" placeholder="user@example.com" required
                    style="flex: 1; background: #0a0a0a; border: 1px solid #333; color: #e0e0e0; padding: 10px 14px; font-family: 'Fira Code', monospace; font-size: 0.9rem; transition: border-color 0.2s;"
                    onfocus="this.style.borderColor='#00d9ff'" onblur="this.style.borderColor='#333'">
                <button type="submit" :disabled="loading" class="submit-btn">Add</button>
            </form>
        </section>

        <!-- Message area -->
        <div x-show="messageVisible" x-text="messageText"
            :class="messageType === 'error' ? 'message error' : 'message success'"
            style="display: none;"></div>

        <!-- Search -->
        <div style="margin-bottom: 16px;">
            <input type="text" x-model="searchQuery" placeholder="search by email or name..."
                style="width: 100%; background: #0a0a0a; border: 1px solid #333; color: #e0e0e0; padding: 10px 14px; font-family: 'Fira Code', monospace; font-size: 0.9rem; transition: border-color 0.2s;"
                onfocus="this.style.borderColor='#00d9ff'" onblur="this.style.borderColor='#333'">
        </div>

        <!-- Users table -->
        <div class="card" style="overflow-x: auto;">
            <table>
                <thead>
                    <tr>
                        <th>Email</th>
                        <th>Display Name</th>
                        <th>Status</th>
                        <th>Roles</th>
                        <th>Actions</th>
                    </tr>
                </thead>
                <tbody>
                    <template x-for="user in filteredUsers" :key="user.id">
                        <tr>
                            <td x-text="user.email"></td>
                            <td x-text="user.nickname || user.name || '—'"></td>
                            <td>
                                <span x-show="user.blocked" style="color: #ff006e; font-size: 0.75rem; text-transform: uppercase; letter-spacing: 0.05em;">blocked</span>
                                <span x-show="!user.blocked && user.activated" style="color: #00d9ff; font-size: 0.75rem; text-transform: uppercase; letter-spacing: 0.05em;">active</span>
                                <span x-show="!user.blocked && !user.activated" style="color: #555; font-size: 0.75rem; text-transform: uppercase; letter-spacing: 0.05em;">pending</span>
                            </td>
                            <td>
                                <span x-show="user.roles && user.roles.includes('admin')" style="color: #00d9ff; font-size: 0.75rem; text-transform: uppercase; letter-spacing: 0.05em;">admin</span>
                                <span x-show="!user.roles || !user.roles.includes('admin')" style="color: #555; font-size: 0.75rem;">—</span>
                            </td>
                            <td>
                                <div style="display: flex; gap: 6px; flex-wrap: wrap;">
                                    <button x-show="!user.blocked" @click="confirmAction('block user', 'block ' + user.email + '?', () => blockUser(user.id))" class="action-btn danger">block</button>
                                    <button x-show="user.blocked" @click="unblockUser(user.id)" class="action-btn">unblock</button>
                                    <button x-show="!user.roles || !user.roles.includes('admin')" @click="confirmAction('make admin', 'promote ' + user.email + ' to admin?', () => makeAdmin(user.id))" class="action-btn">make admin</button>
                                    <button x-show="user.roles && user.roles.includes('admin')" @click="confirmAction('remove admin', 'remove admin from ' + user.email + '?', () => removeAdmin(user.id))" class="action-btn danger">remove admin</button>
                                    <button @click="confirmAction('remove user', 'permanently remove ' + user.email + '?', () => removeUser(user.id))" class="action-btn danger">remove</button>
                                </div>
                            </td>
                        </tr>
                    </template>
                    <tr x-show="filteredUsers.length === 0">
                        <td colspan="5" style="padding: 20px 8px; color: #555; text-align: center;">no users found</td>
                    </tr>
                </tbody>
            </table>
        </div>

        <!-- Confirm modal -->
        <div x-cloak x-show="confirmModal.visible" class="modal-overlay">
            <div class="card" style="max-width: 400px; width: 90%; text-align: center;">
                <h3 x-text="confirmModal.title" style="margin-bottom: 12px; font-size: 1rem;"></h3>
                <p x-text="confirmModal.message" style="color: #888; margin-bottom: 24px; font-size: 0.9rem;"></p>
                <div style="display: flex; gap: 12px; justify-content: center;">
                    <button @click="confirmModal.onConfirm(); confirmModal.visible = false" class="action-btn danger">Confirm</button>
                    <button @click="confirmModal.visible = false" class="action-btn">Cancel</button>
                </div>
            </div>
        </div>
    </main>

    <script src="/admin-users.js?v=1"></script>
</body>
</html>
