<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Users - Waystone</title>
    <link rel="stylesheet" href="/dashboard.css?v=1">
    <link rel="stylesheet" href="/static/notifications.css?v=1">
    <script defer src="/static/vendor/alpinejs.min.js"></script>
    <style>
        /* Action buttons — style-guide compliant */
        .action-btn {
            padding: 6px 14px;
            background: #000;
            color: #00d9ff;
            border: 1px solid #00d9ff;
            cursor: pointer;
            font-family: 'Fira Code', monospace;
            font-size: 0.8em;
            text-transform: uppercase;
            letter-spacing: 1px;
            transition: all 0.2s;
            white-space: nowrap;
        }
        .action-btn:hover { background: #00d9ff; color: #000; }
        .action-btn:disabled { opacity: 0.5; cursor: not-allowed; }
        .action-btn.danger { color: #ff006e; border-color: #ff006e; }
        .action-btn.danger:hover { background: #ff006e; color: #000; }
        /* Submit button for add-user form */
        .submit-btn {
            padding: 10px 20px;
            background: #000;
            color: #00d9ff;
            border: 1px solid #00d9ff;
            cursor: pointer;
            font-family: 'Fira Code', monospace;
            font-size: 0.85em;
            text-transform: uppercase;
            letter-spacing: 1px;
            transition: all 0.2s;
        }
        .submit-btn:hover { background: #00d9ff; color: #000; }
        .submit-btn:disabled { opacity: 0.5; cursor: not-allowed; }
        /* Messages */
        .message { padding: 12px 16px; margin-bottom: 16px; font-size: 0.9rem; border: 1px solid; }
        .message.success { background: #0a1a0a; color: #00ff7f; border-color: #00ff7f; }
        .message.error { background: #1a0a0a; color: #ff006e; border-color: #ff006e; }
        /* Confirm modal overlay — display:flex here so x-show toggling display:none doesn't revert to block */
        .modal-overlay {
            position: fixed;
            inset: 0;
            background: rgba(0,0,0,0.8);
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 100;
        }
        /* Table */
        table { width: 100%; border-collapse: collapse; font-size: 0.85rem; }
        th, td { text-align: left; padding: 10px 8px; }
        th { color: #888; border-bottom: 1px solid #333; font-size: 0.8em; text-transform: uppercase; letter-spacing: 0.05em; }
        tbody tr { border-bottom: 1px solid #1a1a1a; }
        tbody tr:hover { background: #0a0a0a; }
    </style>
</head>
<body x-data="adminUsersPage()" x-init="init()">
    <div class="header">
        <div class="header-left">
            <a href="/" class="logo">Waystone</a>
        </div>
        <div class="header-center">
            <h1>Admin - User Management</h1>
        </div>
        <div class="header-right">
            <span class="user-name" x-text="displayName"></span>
            <button @click="logout()" class="logout-btn">Logout</button>
        </div>
    </div>

    <div class="nav-bar">
        <a href="/" class="nav-item" data-page="dashboard">Dashboard</a>
        <a href="/campaigns" class="nav-item" data-page="campaigns">Campaigns</a>
        <a href="/profile" class="nav-item" data-page="profile">Profile</a>
        <a href="/admin/users" class="nav-item active" data-page="admin-users" x-show="isAdmin">Admin</a>
    </div>

    <main class="container" style="max-width: 1100px; margin: 0 auto; padding: 20px; flex-direction: column; align-items: stretch; justify-content: flex-start;">
        <!-- Add user form -->
        <section class="card" style="margin-bottom: 16px;">
            <h2 style="margin-bottom: 16px; font-size: 0.85rem; text-transform: uppercase; letter-spacing: 0.1em; color: #888;">Add User</h2>
            <form @submit.prevent="addUser()" style="display: flex; gap: 8px; flex-wrap: wrap;">
                <input type="text" x-model="newUsername" placeholder="username" required pattern="[A-Za-z0-9_\-]{2,32}" autocapitalize="none"
                    style="flex: 1; background: #0a0a0a; border: 1px solid #333; color: #e0e0e0; padding: 10px 14px; font-family: 'Fira Code', monospace; font-size: 0.9rem; transition: border-color 0.2s;"
                    onfocus="this.style.borderColor='#00d9ff'" onblur="this.style.borderColor='#333'">
                <input type="text" x-model="newName" placeholder="name (optional)"
                    style="flex: 1; background: #0a0a0a; border: 1px solid #333; color: #e0e0e0; padding: 10px 14px; font-family: 'Fira Code', monospace; font-size: 0.9rem; transition: border-color 0.2s;"
                    onfocus="this.style.borderColor='#00d9ff'" onblur="this.style.borderColor='#333'">
                <button type="submit" :disabled="loading" class="submit-btn">Add</button>
            </form>
        </section>

        <!-- Temporary password banner -->
        <div x-cloak x-show="tempPassword" class="card" style="margin-bottom: 16px; border-color: #00d9ff; background: #0a1a1a;">
            <p style="color: #b0b0b0; font-size: 0.85rem; margin-bottom: 10px;">
                Temporary password for <strong x-text="tempPassword && tempPassword.username" style="color: #fff;"></strong>.
                Give this to the user; they must change it at first login. It will not be shown again.
            </p>
            <div style="display: flex; gap: 8px; align-items: center; flex-wrap: wrap;">
                <code x-text="tempPassword && tempPassword.password" style="font-size: 1.1rem; color: #00d9ff; letter-spacing: 1px; user-select: all;"></code>
                <button @click="copyTempPassword()" class="action-btn">copy</button>
                <button @click="tempPassword = null" class="action-btn">dismiss</button>
            </div>
        </div>

        <!-- Message area -->
        <div x-show="messageVisible" x-text="messageText"
            :class="messageType === 'error' ? 'message error' : 'message success'"
            style="display: none;"></div>

        <!-- Search -->
        <div style="margin-bottom: 16px;">
            <input type="text" x-model="searchQuery" placeholder="search by username or name..."
                style="width: 100%; background: #0a0a0a; border: 1px solid #333; color: #e0e0e0; padding: 10px 14px; font-family: 'Fira Code', monospace; font-size: 0.9rem; transition: border-color 0.2s;"
                onfocus="this.style.borderColor='#00d9ff'" onblur="this.style.borderColor='#333'">
        </div>

        <!-- Users table -->
        <div class="card" style="overflow-x: auto;">
            <table>
                <thead>
                    <tr>
                        <th>Username</th>
                        <th>Display Name</th>
                        <th>Status</th>
                        <th>Roles</th>
                        <th>Actions</th>
                    </tr>
                </thead>
                <tbody>
                    <template x-for="user in filteredUsers" :key="user.id">
                        <tr>
                            <td x-text="user.username"></td>
                            <td x-text="user.nickname || user.name || '—'"></td>
                            <td>
                                <span x-show="user.blocked" style="color: #ff006e; font-size: 0.75rem; text-transform: uppercase; letter-spacing: 0.05em;">blocked</span>
                                <span x-show="!user.blocked && !user.must_change_password" style="color: #00d9ff; font-size: 0.75rem; text-transform: uppercase; letter-spacing: 0.05em;">active</span>
                                <span x-show="!user.blocked && user.must_change_password" style="color: #555; font-size: 0.75rem; text-transform: uppercase; letter-spacing: 0.05em;">pending first login</span>
                            </td>
                            <td>
                                <span x-show="user.roles && user.roles.includes('admin')" style="color: #00d9ff; font-size: 0.75rem; text-transform: uppercase; letter-spacing: 0.05em;">admin</span>
                                <span x-show="!user.roles || !user.roles.includes('admin')" style="color: #555; font-size: 0.75rem;">—</span>
                            </td>
                            <td>
                                <div style="display: flex; gap: 6px; flex-wrap: wrap;">
                                    <button x-show="!user.is_env_admin" @click="confirmAction('reset password', 'reset password for ' + user.username + '? their current password will stop working.', () => resetPassword(user))" class="action-btn">reset password</button>
                                    <button x-show="!user.blocked && !user.is_env_admin" @click="confirmAction('block user', 'block ' + user.username + '?', () => blockUser(user.id))" class="action-btn danger">block</button>
                                    <button x-show="user.blocked" @click="unblockUser(user.id)" class="action-btn">unblock</button>
                                    <button x-show="!user.roles || !user.roles.includes('admin')" @click="confirmAction('make admin', 'promote ' + user.username + ' to admin?', () => makeAdmin(user.id))" class="action-btn">make admin</button>
                                    <button x-show="user.roles && user.roles.includes('admin') && !user.is_env_admin" @click="confirmAction('remove admin', 'remove admin from ' + user.username + '?', () => removeAdmin(user.id))" class="action-btn danger">remove admin</button>
                                    <button x-show="!user.is_env_admin" @click="confirmAction('remove user', 'permanently remove ' + user.username + '?', () => removeUser(user.id))" class="action-btn danger">remove</button>
                                </div>
                            </td>
                        </tr>
                    </template>
                    <tr x-show="filteredUsers.length === 0">
                        <td colspan="5" style="padding: 20px 8px; color: #555; text-align: center;">no users found</td>
                    </tr>
                </tbody>
            </table>
        </div>

        <!-- Systems -->
        <section class="card" style="margin-top: 16px; overflow-x: auto;">
            <h2 style="margin-bottom: 16px; font-size: 0.85rem; text-transform: uppercase; letter-spacing: 0.1em; color: #888;">Systems</h2>
            <form @submit.prevent="addSystem()" style="display: flex; gap: 8px; flex-wrap: wrap; align-items: center; margin-bottom: 16px;">
                <input type="text" x-model="newSystemName" placeholder="system name" required maxlength="64"
                    style="flex: 1; background: #0a0a0a; border: 1px solid #333; color: #e0e0e0; padding: 10px 14px; font-family: 'Fira Code', monospace; font-size: 0.9rem; transition: border-color 0.2s;"
                    onfocus="this.style.borderColor='#00d9ff'" onblur="this.style.borderColor='#333'">
                <input type="file" x-ref="newSystemLogo" accept="image/png,image/jpeg,image/webp,image/gif" style="color: #888; font-size: 0.8rem;">
                <button type="submit" :disabled="loading" class="submit-btn">Add</button>
            </form>
            <table>
                <thead>
                    <tr>
                        <th>Logo</th>
                        <th>Name</th>
                        <th>Actions</th>
                    </tr>
                </thead>
                <tbody>
                    <template x-for="s in systems" :key="s.id">
                        <tr>
                            <td>
                                <img x-show="s.logo_url" :src="s.logo_url || ''" :alt="s.name" style="height: 32px; max-width: 96px; object-fit: contain;">
                                <span x-show="!s.logo_url" style="color: #555;">—</span>
                            </td>
                            <td x-text="s.name"></td>
                            <td>
                                <div style="display: flex; gap: 6px; flex-wrap: wrap;">
                                    <button @click="renameSystem(s)" class="action-btn">rename</button>
                                    <label class="action-btn" style="cursor: pointer;">logo<input type="file" hidden accept="image/png,image/jpeg,image/webp,image/gif" @change="uploadLogo(s.id, $event.target.files[0]); $event.target.value = ''"></label>
                                    <button x-show="s.logo_url" @click="removeLogo(s.id)" class="action-btn danger">remove logo</button>
                                    <button @click="confirmAction('delete system', 'delete ' + s.name + '? campaigns using it keep the name as plain text.', () => deleteSystem(s.id))" class="action-btn danger">delete</button>
                                </div>
                            </td>
                        </tr>
                    </template>
                    <tr x-show="systems.length === 0">
                        <td colspan="3" style="padding: 20px 8px; color: #555; text-align: center;">no systems yet</td>
                    </tr>
                </tbody>
            </table>
        </section>

        <!-- Confirm modal -->
        <div x-cloak x-show="confirmModal.visible" class="modal-overlay">
            <div class="card" style="max-width: 400px; width: 90%; text-align: center;">
                <h3 x-text="confirmModal.title" style="margin-bottom: 12px; font-size: 1rem;"></h3>
                <p x-text="confirmModal.message" style="color: #888; margin-bottom: 24px; font-size: 0.9rem;"></p>
                <div style="display: flex; gap: 12px; justify-content: center;">
                    <button @click="confirmModal.onConfirm(); confirmModal.visible = false" class="action-btn danger">Confirm</button>
                    <button @click="confirmModal.visible = false" class="action-btn">Cancel</button>
                </div>
            </div>
        </div>
    </main>

    <script src="/static/notifications.js?v=1"></script>
    <script src="/admin-users.js?v=3"></script>
</body>
</html>
