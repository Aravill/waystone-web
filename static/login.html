<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - Waystone</title>
    <link rel="stylesheet" href="styles.css?v=12">
    <style>
        .login-container {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            gap: 30px;
        }

        .login-box {
            text-align: center;
            border: 1px solid #333333;
            padding: 40px;
            width: 100%;
            max-width: 400px;
        }

        .login-title {
            font-size: 2em;
            margin-bottom: 10px;
            color: #ffffff;
            letter-spacing: 2px;
        }

        .login-subtitle {
            color: #b0b0b0;
            font-size: 0.9em;
            margin-bottom: 30px;
        }

        .login-box form {
            text-align: left;
        }
    </style>
</head>
<body>
    <div class="login-container">
        <div class="login-box">
            <div class="login-title">Waystone</div>
            <div class="login-subtitle">Event Sign-up</div>

            <form id="loginForm">
                <div class="form-group">
                    <label for="username">Username</label>
                    <input id="username" type="text" autocomplete="username" autocapitalize="none" required>
                </div>
                <div class="form-group">
                    <label for="password">Password</label>
                    <input id="password" type="password" autocomplete="current-password" required>
                </div>
                <button type="submit" id="loginBtn" class="submit-btn">Login</button>
                <div id="message" class="message"></div>
            </form>
        </div>
    </div>

    <script>
        const form = document.getElementById('loginForm');
        const messageEl = document.getElementById('message');
        let messageTimer;

        function showMessage(text, type) {
            messageEl.textContent = text;
            messageEl.className = 'message ' + type;
            clearTimeout(messageTimer);
            messageTimer = setTimeout(() => { messageEl.className = 'message'; }, 5000);
        }

        form.addEventListener('submit', async (e) => {
            e.preventDefault();
            const btn = document.getElementById('loginBtn');
            btn.disabled = true;
            try {
                const response = await fetch('/auth/login', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        username: document.getElementById('username').value,
                        password: document.getElementById('password').value,
                    }),
                });
                const data = await response.json();
                if (!response.ok) {
                    showMessage(data.error || 'Login failed', 'error');
                    return;
                }
                window.location.href = data.must_change_password ? '/change-password' : (data.needs_profile_setup ? '/welcome' : '/');
            } catch (error) {
                showMessage('Login failed: ' + error.message, 'error');
            } finally {
                btn.disabled = false;
            }
        });
    </script>
</body>
</html>
