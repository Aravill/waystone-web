<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - Waystone</title>
    <script src="/static/theme.js?v=4"></script>
    <link rel="stylesheet" href="/static/styles.css?v=35">
    <style>
        .login-container {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            padding: 2rem 1.5rem;
        }

        .login-box {
            width: 100%;
            max-width: 26.25rem;
            padding: 2.5rem 2rem;
            border: 1px solid var(--ink);
            outline: 1px solid var(--ink);
            outline-offset: 0.375rem;
            text-align: center;
        }

        .login-mark {
            display: block;
            width: 2.75rem;
            height: 3.5rem;
            margin: 0 auto 0.5rem;
            background: currentColor;
            -webkit-mask: var(--stone-mark) center / contain no-repeat;
            mask: var(--stone-mark) center / contain no-repeat;
        }

        .login-title {
            font-family: var(--font-black);
            font-size: 3.5rem;
            line-height: 1.1;
            color: var(--ink);
        }

        .login-subtitle {
            margin: 0.5rem 0 1rem;
            color: var(--muted);
            font-size: 0.75rem;
            letter-spacing: 0.1875rem;
            text-transform: uppercase;
        }

        .login-box .ornament {
            margin: 0 0 1.5rem;
            color: var(--rubric);
            letter-spacing: normal;
        }

        .login-box form {
            text-align: left;
        }

        .login-footer {
            margin-top: 1.5rem;
            color: var(--muted);
            font-size: 0.8125rem;
            text-align: center;
        }
    </style>
</head>
<body>
    <div class="login-container">
        <div class="login-box">
            <span class="login-mark" aria-hidden="true"></span>
            <div class="login-title">Waystone</div>
            <div class="login-subtitle">Speak, friend, and enter</div>
            <p class="ornament" aria-hidden="true">— ❦ —</p>

            <form id="loginForm">
                <div class="form-group">
                    <label for="username">Username</label>
                    <input id="username" type="text" autocomplete="username" autocapitalize="none" required>
                </div>
                <div class="form-group">
                    <label for="password">Password</label>
                    <input id="password" type="password" autocomplete="current-password" required>
                </div>
                <button type="submit" id="loginBtn" class="submit-btn">Enter</button>
                <div id="message" class="message"></div>
            </form>
            <p class="login-footer">No seal yet? Ask an admin to add you to the roll.</p>
        </div>
    </div>

    <script>
        const form = document.getElementById('loginForm');
        const messageEl = document.getElementById('message');
        let messageTimer;

        function showMessage(text, type) {
            messageEl.textContent = text;
            messageEl.className = 'message ' + type;
            clearTimeout(messageTimer);
            messageTimer = setTimeout(() => { messageEl.className = 'message'; }, 5000);
        }

        form.addEventListener('submit', async (e) => {
            e.preventDefault();
            const btn = document.getElementById('loginBtn');
            btn.disabled = true;
            try {
                const response = await fetch('/auth/login', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        username: document.getElementById('username').value,
                        password: document.getElementById('password').value,
                    }),
                });
                const data = await response.json();
                if (!response.ok) {
                    showMessage(data.error || 'Login failed', 'error');
                    return;
                }
                window.location.href = data.must_change_password ? '/change-password' : (data.needs_profile_setup ? '/profile' : '/');
            } catch (error) {
                showMessage('Login failed: ' + error.message, 'error');
            } finally {
                btn.disabled = false;
            }
        });
    </script>
</body>
</html>
