<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Change Password - Waystone</title>
    <link rel="icon" href="/static/img/favicon.svg" type="image/svg+xml">
    <script src="/static/theme.js?v=7"></script>
    <link rel="stylesheet" href="/static/styles.css?v=65">
    <script defer src="/static/vendor/alpinejs.min.js"></script>
    <style>
        .password-rules { list-style: none; margin: 10px 0 0; padding: 0; font-size: 0.85em; color: var(--muted); }
        .password-rules li { margin-bottom: 4px; }
        .password-rules li.ok { color: var(--verdigris); }
    </style>
</head>
<body x-data="changePasswordPage()">
    <div class="header">
        <div class="header-left">
            <span class="logo">Waystone</span>
        </div>
        <nav class="nav-bar" aria-label="Main" x-show="userLoaded && !mustChange">
            <a href="/" class="nav-item" data-page="dashboard">Home</a>
            <a href="/campaigns" class="nav-item" data-page="campaigns">Games</a>
            <a href="/admin/users" class="nav-item" data-page="admin-users" x-show="isAdmin">Admin</a>
        </nav>
        <div class="header-right">
            <details class="user-menu">
                <summary><span class="user-menu-avatar" aria-hidden="true" x-text="(displayName || '?').charAt(0).toUpperCase()"></span><span class="user-menu-name" x-text="displayName"></span><span class="user-menu-caret" aria-hidden="true">&#9662;</span></summary>
                <div class="user-menu-panel">
                    <a href="/profile" x-show="!mustChange">Profile</a>
                    <button type="button" @click="handleLogout()">Log out</button>
                </div>
            </details>
        </div>
    </div>

    <div class="container container--narrow">
        <nav class="game-crumb" aria-label="Breadcrumb" x-show="userLoaded && !mustChange">
            <a href="/profile">Profile</a><span aria-hidden="true"> › </span><span aria-current="page">Change password</span>
        </nav>
        <h1 class="page-title"><span class="drop-cap">C</span>hange Password</h1>
        <p x-show="mustChange" class="form-hint" style="margin-bottom: 1.5rem;">
            You are using a temporary password. Choose a new one to continue.
        </p>
        <form @submit.prevent="submit()">
            <div class="form-group">
                <label for="currentPassword">Current / temporary password</label>
                <input id="currentPassword" type="password" x-model="currentPassword" autocomplete="current-password" required>
            </div>
            <div class="form-group">
                <label for="newPassword">New password</label>
                <input id="newPassword" type="password" x-model="newPassword" autocomplete="new-password" minlength="10" required aria-describedby="passwordRules">
                <ul id="passwordRules" class="password-rules">
                    <template x-for="rule in rules()" :key="rule.text">
                        <li :class="rule.ok ? 'ok' : ''"><span x-text="rule.ok ? '[x]' : '[ ]'"></span> <span x-text="rule.text"></span></li>
                    </template>
                </ul>
            </div>
            <div class="form-group">
                <label for="confirmPassword">Confirm new password</label>
                <input id="confirmPassword" type="password" x-model="confirmPassword" autocomplete="new-password" minlength="10" required>
            </div>
            <button type="submit" class="submit-btn" :disabled="saving">Change Password</button>
        </form>
        <div class="message" :class="messageType" x-show="messageVisible" role="status" x-text="messageText"></div>
    </div>

    <script src="change-password.js?v=6"></script>
</body>
</html>
