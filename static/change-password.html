<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Change Password - Waystone</title>
    <script src="/static/theme.js?v=4"></script>
    <link rel="stylesheet" href="/static/styles.css?v=35">
    <script defer src="/static/vendor/alpinejs.min.js"></script>
</head>
<body x-data="changePasswordPage()">
    <div class="header">
        <div class="header-left">
            <span class="logo">Waystone</span>
        </div>
        <div class="header-right">
            <button @click="handleLogout()" class="logout-btn">Logout</button>
        </div>
    </div>

    <div class="container container--narrow">
        <h1 class="page-title"><span class="drop-cap">C</span>hange Password</h1>
        <p x-show="mustChange" class="form-hint" style="margin-bottom: 1.5rem;">
            You are using a temporary password. Choose a new one to continue.
        </p>
        <form @submit.prevent="submit()">
            <div class="form-group">
                <label for="currentPassword">Current / temporary password</label>
                <input id="currentPassword" type="password" x-model="currentPassword" autocomplete="current-password" required>
            </div>
            <div class="form-group">
                <label for="newPassword">New password (min 8 characters)</label>
                <input id="newPassword" type="password" x-model="newPassword" autocomplete="new-password" minlength="8" required>
            </div>
            <div class="form-group">
                <label for="confirmPassword">Confirm new password</label>
                <input id="confirmPassword" type="password" x-model="confirmPassword" autocomplete="new-password" minlength="8" required>
            </div>
            <button type="submit" class="submit-btn" :disabled="saving">Change Password</button>
        </form>
        <div class="message" :class="messageType" x-show="messageVisible" x-text="messageText"></div>
    </div>

    <script src="change-password.js?v=2"></script>
</body>
</html>
