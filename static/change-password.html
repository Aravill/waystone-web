<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Change Password - Waystone</title>
    <link rel="stylesheet" href="styles.css?v=13">
    <script defer src="/static/vendor/alpinejs.min.js"></script>
    <style>
        .password-rules { list-style: none; margin: 10px 0 0; padding: 0; font-size: 0.85em; color: #888888; }
        .password-rules li { margin-bottom: 4px; }
        .password-rules li.ok { color: #00ff7f; }
    </style>
</head>
<body x-data="changePasswordPage()">
    <div class="header">
        <div class="header-left">
            <span class="logo" style="color: #ffffff; font-size: 1.3em; letter-spacing: 2px;">Waystone</span>
        </div>
        <div class="header-center">
            <h1>Change Password</h1>
        </div>
        <div class="header-right">
            <button @click="handleLogout()" class="logout-btn">Logout</button>
        </div>
    </div>

    <div class="container">
        <p x-show="mustChange" style="color: #b0b0b0; font-size: 0.9em; margin-bottom: 25px;">
            You are using a temporary password. Choose a new one to continue.
        </p>
        <form @submit.prevent="submit()">
            <div class="form-group">
                <label for="currentPassword">Current / temporary password</label>
                <input id="currentPassword" type="password" x-model="currentPassword" autocomplete="current-password" required>
            </div>
            <div class="form-group">
                <label for="newPassword">New password</label>
                <input id="newPassword" type="password" x-model="newPassword" autocomplete="new-password" minlength="10" required aria-describedby="passwordRules">
                <ul id="passwordRules" class="password-rules">
                    <template x-for="rule in rules()" :key="rule.text">
                        <li :class="rule.ok ? 'ok' : ''"><span x-text="rule.ok ? '[x]' : '[ ]'"></span> <span x-text="rule.text"></span></li>
                    </template>
                </ul>
            </div>
            <div class="form-group">
                <label for="confirmPassword">Confirm new password</label>
                <input id="confirmPassword" type="password" x-model="confirmPassword" autocomplete="new-password" minlength="10" required>
            </div>
            <button type="submit" class="submit-btn" :disabled="saving">Change Password</button>
        </form>
        <div class="message" :class="messageType" x-show="messageVisible" x-text="messageText"></div>
    </div>

    <script src="change-password.js?v=3"></script>
</body>
</html>
