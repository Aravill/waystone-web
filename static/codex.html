                                    </li>
                                </template>
                            </ul>
                        </section>
                        <section class="cx-box cx-box--outline" aria-label="Outline" x-show="toc.length >= 2">
                            <h2>Outline</h2>
                            <ul class="cx-outline">
                                <template x-for="t in toc" :key="t.id">
                                    <li><a :href="'#' + t.id" @click="tocActive = t.id" :class="{ on: tocActive === t.id, sub: t.level === 3 }" :aria-current="tocActive === t.id ? 'location' : null" x-text="t.text"></a></li>
                                </template>
                            </ul>
                        </section>
                        <section class="cx-box cx-box--files" aria-label="Attachments" x-show="pageData.attachments.length || canEdit">
                            <h2>Attachments · <span x-text="pageData.attachments.length"></span></h2>
                            <p class="cx-box-empty" x-show="pageData.attachments.length === 0">No files yet.</p>
                            <ul x-show="pageData.attachments.length">
                                <template x-for="a in pageData.attachments" :key="a.id">
                                    <li>
                                        <a class="cx-file" :href="a.url" :target="a.inline ? '_blank' : null" :rel="a.inline ? 'noopener' : null" :download="a.inline ? null : a.name" x-text="a.name"></a>
                                        <small class="muted"><span x-text="codexFileSize(a.size)"></span> · added by <span x-text="a.uploaded_by_user.display_name"></span> · <span x-text="shortDate(a.created_at)"></span></small>
                                        <span class="cx-file-acts" x-show="canEdit">
                                            <button type="button" class="text-link" :disabled="attach.busy" :aria-label="'Replace ' + a.name" @click="startReplace(a)">Replace</button>
                                            <button type="button" class="text-link" :disabled="attach.busy" :aria-label="'Remove ' + a.name" @click="removeAttachment(a)">Remove</button>
                                        </span>
                                    </li>
                                </template>
                            </ul>
                            <div class="cx-file-busy" x-show="attach.busy">
                                <progress max="100" :value="attach.pct" aria-label="Upload progress"></progress>
                                <p class="hint" role="status" x-text="attach.text"></p>
                            </div>
                            <p class="cx-box-actions" x-show="canEdit"><button type="button" class="text-link" :disabled="attach.busy" @click="$refs.attachInput.click()">Add files</button></p>
                            <input type="file" multiple hidden x-ref="attachInput" @change="onAttachFiles($event)" tabindex="-1" aria-hidden="true">
                            <input type="file" hidden x-ref="attachReplaceInput" @change="onReplaceFile($event)" tabindex="-1" aria-hidden="true">
                        </section>
                        <section class="cx-box cx-box--local" aria-label="Local graph" x-show="localGraph">
                            <h2>Local graph</h2>
                            <a class="local-graph" :href="graphUrl(page.id)" aria-label="Open the graph view">
                                <svg class="gv-svg" id="localSvg" viewBox="0 0 240 160" aria-hidden="true"></svg>
                                <span class="local-open">Open graph view →</span>
                            </a>
                        </section>
                        <section class="cx-box" aria-label="Linked from">
                            <h2>Linked from · <span x-text="linkedFrom.length"></span></h2>
                            <p class="cx-box-empty" x-show="linkedFrom.length === 0">No other page links here yet.</p>
                            <ul x-show="linkedFrom.length">
                                <template x-for="b in linkedFrom" :key="b.id">
                                    <li><a :href="pageUrl(b)" x-text="b.title"></a><small class="muted" x-show="b.aliases.length" x-text="'as ' + b.aliases.map((a) => '“' + a + '”').join(', ')"></small></li>
                                </template>
                            </ul>
                        </section>
                        <section class="cx-box cx-box--mentions" aria-label="Mentioned, not linked" x-show="mentions.loaded">
                            <h2>Mentioned, not linked · <span x-text="mentions.total"></span></h2>
                            <p class="cx-box-empty" x-show="mentions.list.length === 0">No plain mentions of this title.</p>
                            <p class="cx-box-actions" x-show="mentions.can_edit && mentions.list.length > 1"><button type="button" class="text-link" :disabled="mentions.busy" @click="linkAllMentions()" x-text="mentions.progress || ('Link all ' + mentions.list.length)"></button></p>
                            <ul x-show="mentions.list.length">
                                <template x-for="m in mentions.list" :key="m.page.id">
                                    <li>
                                        <a :href="pageUrl(m.page)" x-text="m.page.title"></a>
                                        <template x-for="(s, i) in m.snippets" :key="i">
                                            <small class="cx-snippet"><span x-text="s.before"></span> <mark class="cx-mention" x-text="s.match"></mark> <span x-text="s.after"></span></small>
                                        </template>
                                        <button type="button" class="text-link" x-show="mentions.can_edit" :disabled="mentions.busy" @click="linkMentions(m)" x-text="m.count > 1 ? 'Link ' + m.count : 'Link'" :aria-label="'Link ' + m.count + ' in ' + m.page.title"></button>
                                    </li>
                                </template>
                            </ul>
                            <p class="cx-box-empty" x-show="mentions.total > mentions.list.length" x-text="'and ' + (mentions.total - mentions.list.length) + ' more'"></p>
                        </section>
                        <section class="cx-box" aria-label="On the timeline" x-show="onTimelines.length">
                            <h2>On the timeline</h2>
                            <ul>
                                <template x-for="o in onTimelines" :key="o.key">
                                    <li><a :href="pageUrl(o.timeline)" x-text="o.timeline.title"></a><small><a :href="o.url" x-text="o.date"></a></small></li>
                                </template>
                            </ul>
                        </section>
                    </div>
                </template>
                <template x-if="codex">
                    <section class="cx-box" id="wanted" aria-label="Wanted pages">
                        <h2>Wanted pages</h2>
                        <p class="cx-box-empty" x-show="codex.wanted.length === 0">Every link in this codex leads somewhere.</p>
                        <ul x-show="codex.wanted.length">
                            <template x-for="w in pagedSlice(codex.wanted, 'wanted')" :key="w.text">
                                <li><button type="button" class="wikilink wikilink--missing" :title="codex.can_edit ? 'No page yet. Click to create.' : 'No page yet.'" @click="openCreatePage(w.text)" x-text="w.text"></button><small class="muted" x-text="'wanted ' + w.count + (w.count === 1 ? ' time' : ' times')"></small></li>
                            </template>
                        </ul>
                        <p class="cx-pager" x-show="codex.wanted.length > CODEX_LIST_PAGE">
                            <button type="button" class="text-link" :disabled="pagers.wanted === 0" @click="turnPage(codex.wanted, 'wanted', -1)" aria-label="Previous wanted pages">‹ Previous</button>
                            <span x-text="pageRange(codex.wanted, 'wanted')"></span>
                            <button type="button" class="text-link" :disabled="pagerAtEnd(codex.wanted, 'wanted')" @click="turnPage(codex.wanted, 'wanted', 1)" aria-label="Next wanted pages">Next ›</button>
                        </p>
                    </section>
                </template>
                <template x-if="screen === 'codex' && codex">
                    <section class="cx-box" id="recent" aria-label="Recent changes">
                        <h2>Recent changes</h2>
                        <p class="cx-box-empty" x-show="codex.recent.length === 0">Nothing yet.</p>
                        <ul class="recent" x-show="codex.recent.length">
                            <template x-for="r in pagedSlice(codex.recent, 'recent')" :key="r.page_id + '-' + r.number">
                                <li x-html="recentHtml(r, false)"></li>
                            </template>
                        </ul>
                        <p class="cx-pager" x-show="codex.recent.length > CODEX_LIST_PAGE">
                            <button type="button" class="text-link" :disabled="pagers.recent === 0" @click="turnPage(codex.recent, 'recent', -1)" aria-label="Newer changes">‹ Newer</button>
                            <span x-text="pageRange(codex.recent, 'recent')"></span>
                            <button type="button" class="text-link" :disabled="pagerAtEnd(codex.recent, 'recent')" @click="turnPage(codex.recent, 'recent', 1)" aria-label="Older changes">Older ›</button>
                        </p>
                    </section>
                </template>
            </div>
        </aside>
    </div>

    <!-- Link preview card (mouse only) -->
    <div class="cx-peek" role="tooltip" x-show="peek.open" x-cloak :style="'left:' + peek.x + 'px;top:' + peek.y + 'px'">
        <strong x-text="peek.title"></strong>
        <p class="cx-peek-where" x-show="peek.where" x-text="peek.where"></p>
        <p class="cx-peek-text" x-text="peek.text"></p>
    </div>

    <!-- Form dialogs -->
    <div class="modal" :class="{ 'modal-open': dlg.type }" @click.self="cancelDlg()" @keydown.escape.window="dlg.type && !confirmDialog.open && cancelDlg()" role="dialog" aria-modal="true" aria-labelledby="dlgTitle">
        <div class="modal-content confirm-modal-content" :class="{ 'cx-dlg--wide': dlgWide }">
            <div class="modal-header">
                <div>
                    <span class="modal-eyebrow" x-text="dlgEyebrow"></span>
                    <h2 id="dlgTitle" x-text="dlgTitle"></h2>
                </div>
                <button type="button" class="modal-close" @click="cancelDlg()" aria-label="Close">&times;</button>
            </div>
            <form class="modal-form" @submit.prevent="submitDlg()" novalidate>
                <template x-if="dlg.type === 'createPage'">
                    <div class="cx-np">
                        <div class="cx-np-fields">
                            <div class="form-group">
                                <label for="dTitle">Title</label>
                                <input type="text" id="dTitle" maxlength="120" autocomplete="off" placeholder="Name the page" x-model="dlg.title" x-ref="dlgFocus">
                            </div>
                            <div class="form-group" x-show="dlg.folders && dlg.folders.length">
                                <label for="dFolder">Folder</label>
                                <select id="dFolder" x-model="dlg.folderId" @change="onNpFolder()">
                                    <option value="">Top level</option>
                                    <template x-for="o in folderOptions(dlg.folders)" :key="o.id"><option :value="o.id" x-text="o.label" :selected="o.id === dlg.folderId"></option></template>
                                </select>
                            </div>
                        </div>
                        <div class="cx-np-kind" x-show="!dlg.note">
                            <p class="cx-np-label" id="dKindLabel">Type</p>
                            <div class="cx-types" role="radiogroup" aria-labelledby="dKindLabel" @keydown="onKindKey($event)">
                                <button type="button" class="cx-type" role="radio" :aria-checked="dlg.kind === 'lore' ? 'true' : 'false'" :tabindex="dlg.kind === 'lore' ? 0 : -1" @click="dlg.kind = 'lore'"><strong><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 3h9l3 3v15H6z"/><path d="M9 10h6M9 14h6M9 18h4"/></svg>Article</strong><span>Text with headings, pictures and links</span></button>
                                <button type="button" class="cx-type" role="radio" :aria-checked="dlg.kind === 'timeline' ? 'true' : 'false'" :tabindex="dlg.kind === 'timeline' ? 0 : -1" @click="dlg.kind = 'timeline'"><strong><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M7 3v18"/><rect x="5" y="5" width="4" height="4" fill="currentColor"/><rect x="5" y="15" width="4" height="4"/><path d="M12 7h8M12 17h6"/></svg>Timeline</strong><span>Events by date, newest first, under a short intro</span></button>
                                <button type="button" class="cx-type" role="radio" aria-checked="false" aria-disabled="true" tabindex="-1"><strong><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 6l6-3 6 3 6-3v15l-6 3-6-3-6 3z"/><path d="M9 3v15M15 6v15"/></svg>Map</strong><span>A picture with pins that point at pages. Later</span></button>
                            </div>
                        </div>
                        <p class="cx-tpl-note" x-show="dlg.kind === 'timeline'">A timeline starts empty. Add its events once it is made. The type can't be changed later.</p>
                        <div class="cx-np-cols" x-show="dlg.kind === 'lore'">
                            <div class="cx-np-pick">
                                <p class="cx-np-label" id="dTplLabel">Start from</p>
                                <div class="cx-tpl-pick" role="radiogroup" aria-labelledby="dTplLabel" @keydown="onTplKey($event)">
                                    <template x-for="g in tplGroups(dlg.templates)" :key="g.label">
                                        <div class="cx-tpl-group">
                                            <p class="cx-tpl-grouplabel" x-text="g.label"></p>
                                            <div class="cx-tpl-cards">
                                                <template x-for="t in g.items" :key="t.id">
                                                    <button type="button" class="cx-tpl-card" role="radio" :aria-checked="t.id === tplSelected.id ? 'true' : 'false'" :tabindex="t.id === tplSelected.id ? 0 : -1" @click="pickTpl(t.id)">
                                                        <em class="cx-tpl-def" x-show="t.id === npDefault.id">Folder default</em>
                                                        <strong x-text="t.name"></strong>
                                                        <span x-text="t.description"></span>
                                                    </button>
                                                </template>
                                            </div>
                                        </div>
                                    </template>
                                </div>
                                <p class="hint" x-show="npDefaultHint" x-text="npDefaultHint"></p>
                                <p class="hint"><button type="button" class="text-link" @click="openTemplates()">Manage templates</button></p>
                            </div>
                            <div class="cx-np-side">
                                <p class="cx-np-label">Preview · <span x-text="tplSelected.name"></span></p>
                                <div class="cx-tpl-preview game-text codex-text" role="region" aria-label="Starting text of the page" tabindex="0" x-html="tplPreviewHtml"></div>
                                <p class="cx-np-tags" x-show="tplSelected.tags.length" x-text="'Adds tags: ' + tplSelected.tags.join(', ')"></p>
                                <template x-if="dlg.note">
                                    <div>
                                        <p class="cx-np-label">Then your note</p>
                                        <blockquote class="cx-np-note" x-text="dlg.note.body"></blockquote>
                                    </div>
                                </template>
                            </div>
                        </div>
                    </div>
                </template>
                <template x-if="dlg.type === 'quickNote'">
                    <div class="form-group">
                        <label for="dNote">Note</label>
                        <textarea id="dNote" rows="7" maxlength="5000" placeholder="Anything. A name, a rumour, the loot. Tidy it up later." x-model="dlg.text" x-ref="dlgFocus" @input="saveNoteDraft()" @keydown.ctrl.enter.prevent="submitDlg()" @keydown.meta.enter.prevent="submitDlg()"></textarea>
                        <p class="hint" x-text="dlg.noteId ? 'Ctrl+Enter saves.' : 'Goes to your inbox in ' + dlg.codexName + '. Ctrl+Enter saves.'"></p>
                    </div>
                </template>
                <template x-if="dlg.type === 'addToPage'">
                    <div>
                        <div class="form-group">
                            <span class="tl-label" id="dApLabel">Page</span>
                            <div class="tl-picker" x-show="!dlg.linked">
                                <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
                                <input type="text" id="dApPick" role="combobox" aria-labelledby="dApLabel" aria-controls="dApList" aria-autocomplete="list" autocomplete="off" :aria-expanded="dlg.pickOpen ? 'true' : 'false'" :aria-activedescendant="dlg.pickOpen && tlPickResults[dlg.pickIdx] ? 'dApOpt-' + tlPickResults[dlg.pickIdx].id : null" :placeholder="'Find a page in ' + currentCodexName" x-model="dlg.pickQ" @focus="dlg.pickOpen = true" @input="dlg.pickOpen = true; dlg.pickIdx = 0" @blur="dlg.pickOpen = false" @keydown="onPickKey($event)">
                                <ul class="tl-pick-list" id="dApList" role="listbox" aria-labelledby="dApLabel" x-show="dlg.pickOpen">
                                    <template x-for="(p, i) in tlPickResults" :key="p.id">
                                        <li role="option" :id="'dApOpt-' + p.id" :aria-selected="i === dlg.pickIdx ? 'true' : 'false'" @mousedown.prevent="pickPage(p)"><span x-text="p.title"></span><small x-text="p.folder"></small></li>
                                    </template>
                                    <li class="tl-pick-none" x-show="tlPickResults.length === 0">No page called that.</li>
                                </ul>
                            </div>
                            <div class="tl-linked" x-show="dlg.linked">
                                <span class="tl-mk tl-mk--linked" aria-hidden="true"></span>
                                <span class="tl-linked-title"><span x-text="dlg.linked ? dlg.linked.title : ''"></span><small x-text="dlg.linked ? dlg.linked.folder : ''"></small></span>
                                <button type="button" class="text-link" @click="dlg.linked = null; $nextTick(() => document.getElementById('dApPick')?.focus())">Change</button>
                            </div>
                        </div>
                        <div class="form-group">
                            <p class="cx-np-label">Added to the end of the page</p>
                            <blockquote class="cx-np-note" x-text="addNotePreview"></blockquote>
                            <p class="hint">Saved as a new revision noted "Added a quick note". The editor doesn't open.</p>
                        </div>
                    </div>
                </template>
                <template x-if="dlg.type === 'createMissing'">
                    <div>
                        <p class="hint">Your text links to pages that aren't written yet. Tick the ones to create now; the rest stay as wanted pages.</p>
                        <ul class="cx-cm-list">
                            <template x-for="r in dlg.rows" :key="r.title">
                                <li>
                                    <input type="checkbox" x-model="r.on" :disabled="r.done" :aria-label="'Create ' + r.title">
                                    <span class="cx-cm-title" x-text="r.title"></span>
                                    <select :aria-label="'Folder for ' + r.title" x-model="r.folderId" :disabled="r.done" @change="onCmFolder(r)">
                                        <option value="">Top level</option>
                                        <template x-for="o in folderOptions(dlg.folders)" :key="o.id"><option :value="o.id" x-text="o.label" :selected="o.id === r.folderId"></option></template>
                                    </select>
                                    <select :aria-label="'Template for ' + r.title" x-model="r.tplId" :disabled="r.done" @change="r.tplTouched = true">
                                        <template x-for="t in dlg.templates" :key="t.id"><option :value="t.id" x-text="t.name" :selected="t.id === r.tplId"></option></template>
                                    </select>
                                    <p class="cx-cm-note" x-show="r.done">Created.</p>
                                    <p class="cx-cm-note cx-cm-note--error" role="alert" x-show="r.error" x-text="r.error"></p>
                                </li>
                            </template>
                        </ul>
                    </div>
                </template>
                <template x-if="dlg.type === 'event'">
                    <div>
                        <div class="form-group">
                            <span class="tl-label" id="dEvPageLabel">Page <span class="muted">(optional)</span></span>
                            <div class="tl-picker" x-show="!dlg.linked">
                                <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
                                <input type="text" id="dEvPick" role="combobox" aria-labelledby="dEvPageLabel" aria-controls="dEvList" aria-autocomplete="list" autocomplete="off" :aria-expanded="dlg.pickOpen ? 'true' : 'false'" :aria-activedescendant="dlg.pickOpen && tlPickResults[dlg.pickIdx] ? 'dEvOpt-' + tlPickResults[dlg.pickIdx].id : null" :placeholder="'Find a page in ' + page.codex.name" x-model="dlg.pickQ" @focus="dlg.pickOpen = true" @input="dlg.pickOpen = true; dlg.pickIdx = 0" @blur="dlg.pickOpen = false" @keydown="onPickKey($event)">
                                <ul class="tl-pick-list" id="dEvList" role="listbox" aria-labelledby="dEvPageLabel" x-show="dlg.pickOpen">
                                    <template x-for="(p, i) in tlPickResults" :key="p.id">
                                        <li role="option" :id="'dEvOpt-' + p.id" :aria-selected="i === dlg.pickIdx ? 'true' : 'false'" @mousedown.prevent="pickPage(p)"><span x-text="p.title"></span><small x-text="p.folder"></small></li>
                                    </template>
                                    <li class="tl-pick-none" x-show="tlPickResults.length === 0">No page called that. Leave it unlinked, or tick “Create a page for it”.</li>
                                </ul>
                            </div>
                            <div class="tl-linked" x-show="dlg.linked">
                                <span class="tl-mk tl-mk--linked" aria-hidden="true"></span>
                                <span class="tl-linked-title"><span x-text="dlg.linked ? dlg.linked.title : ''"></span><small x-text="dlg.linked ? [dlg.linked.folder, ...dlg.linked.tags].filter(Boolean).join(' · ') : ''"></small></span>
                                <button type="button" class="text-link" @click="unlinkEvent()">Unlink</button>
                            </div>
                            <p class="hint" x-show="!dlg.linked">Link a page and the event takes its title.</p>
                        </div>
                        <div class="form-group">
                            <label for="dEvTitle">Title</label>
                            <input type="text" id="dEvTitle" maxlength="120" autocomplete="off" x-model="dlg.title" :readonly="!!dlg.linked" @input="!dlg.linked && (dlg.ownTitle = dlg.title)">
                            <p class="hint" x-show="dlg.linked">From the linked page. Rename the page to change it.</p>
                        </div>
                        <div class="form-group">
                            <span class="tl-label" id="dEvDateLabel">Date</span>

                                    <select id="dEvMonth" x-model="dlg.month">

                                <div><label for="dEvDay">Day <span class="muted">(optional)</span></label><input type="number" id="dEvDay" min="1" max="100" inputmode="numeric" :disabled="!dlg.month" x-model="dlg.day"></div>

                        </div>

                </template>
                <template x-if="dlg.type === 'calendar'">
                    <div>
                        <div class="form-group">
                            <label for="dCalMonths">Month names, one per line</label>
                            <textarea id="dCalMonths" rows="8" spellcheck="false" x-model="dlg.months" x-ref="dlgFocus"></textarea>
                            <p class="hint">Leave it empty to use plain month numbers. Up to 100 names.</p>
                        </div>
                        <div class="tl-date-row tl-era-row">
                            <div><label for="dCalEra">Era</label><input type="text" id="dCalEra" maxlength="12" placeholder="AR" x-model="dlg.era"></div>
                            <div><label for="dCalBefore">Before era</label><input type="text" id="dCalBefore" maxlength="12" placeholder="BR" x-model="dlg.beforeEra"></div>
                        </div>
                        <p class="hint">Example: <strong x-text="calExample"></strong>. Enter a year before the era as a negative number, such as -40.</p>
                    </div>
                </template>
                <template x-if="dlg.type === 'templates'">
                    <div>
                        <p class="hint" id="dTplsIntro" tabindex="-1">The built-in templates are the same in every codex: copy one to change it. Changing or deleting a template never changes pages already made from it.</p>
                        <ul class="cx-tpl-list">
                            <template x-for="t in dlg.templates" :key="t.id">
                                <li class="cx-tpl-row">
                                    <div class="cx-tpl-info">
                                        <strong x-text="t.name"></strong>
                                        <span class="cx-tpl-badge" x-text="t.by ? 'by ' + t.by : 'Built-in'"></span>
                                        <small x-text="t.description"></small>
                                        <span class="cx-tpl-tags" x-show="t.tags.length"><template x-for="n in t.tags" :key="n"><span class="cx-chip cx-chip--tag" x-text="n"></span></template></span>
                                    </div>
                                    <div class="cx-tpl-acts">
                                        <button type="button" class="text-link" x-show="dlg.canEdit" @click="openCreatePage('', null, t.id)" :aria-label="'Use the ' + t.name + ' template'">Use</button>
                                        <button type="button" class="text-link" x-show="dlg.canEdit && t.id !== 'builtin:blank'" @click="copyTemplate(t)" :aria-label="'Copy the ' + t.name + ' template'">Copy</button>
                                        <button type="button" class="text-link" x-show="dlg.canEdit && t.by" @click="openTemplateEditor(t)" :aria-label="'Edit the ' + t.name + ' template'">Edit</button>
                                        <button type="button" class="text-link cx-tpl-del" x-show="dlg.canEdit && t.by" @click="deleteTemplate(t)" :aria-label="'Delete the ' + t.name + ' template'">Delete</button>
                                    </div>
                                </li>
                            </template>
                        </ul>
                        <p><button type="button" class="campaign-action-btn" x-show="dlg.canEdit" @click="openTemplateEditor(null)">+ New template</button></p>
                    </div>
                </template>
                <template x-if="dlg.type === 'template'">
                    <div>
                        <div class="form-group">
                            <label for="dTplName">Name</label>
                            <input type="text" id="dTplName" maxlength="80" x-model="dlg.name" x-init="$nextTick(() => requestAnimationFrame(() => $el.focus()))">
                        </div>
                        <div class="form-group">
                            <label for="dTplDesc">Description</label>
                            <input type="text" id="dTplDesc" maxlength="160" placeholder="One line, shown in the New page list" x-model="dlg.description">
                        </div>
                        <div class="form-group">
                            <label for="dTplTags">Adds tags</label>
                            <input type="text" id="dTplTags" placeholder="tavern, settlement" x-model="dlg.tags">
                            <p class="hint">Separate tags with commas. A page made from this template gets them.</p>
                        </div>
                        <div class="form-group">
                            <label for="dTplBody">Text</label>
                            <textarea id="dTplBody" class="cx-tpl-body" rows="12" spellcheck="false" x-model="dlg.body"></textarea>
                            <p class="hint">Write {{title}} where the page's title should go and {{date}} for the day it's made. [[ ]] leaves an empty link to fill in.</p>
                        </div>
                    </div>
                </template>
                <template x-if="dlg.type === 'saveTemplate'">
                    <div>
                        <div class="form-group">
                            <label for="dStName">Name</label>
                            <input type="text" id="dStName" maxlength="80" x-model="dlg.name" x-ref="dlgFocus">
                        </div>
                        <div class="form-group">
                            <label for="dStDesc">Description</label>
                            <input type="text" id="dStDesc" maxlength="160" placeholder="One line, shown in the New page list" x-model="dlg.description">
                        </div>
                        <fieldset class="cx-fieldset">
                            <legend>Keep</legend>
                            <label class="cx-check"><input type="radio" name="dStKeep" value="headings" x-model="dlg.keep"><span>Headings only <small>The ## and ### headings, empty. Best for a structure to fill in.</small></span></label>
                            <label class="cx-check"><input type="radio" name="dStKeep" value="all" x-model="dlg.keep"><span>All the text <small>Pictures are not kept.</small></span></label>
                        </fieldset>
                        <label class="cx-check"><input type="checkbox" x-model="dlg.tags"><span>New pages get this page's tags</span></label>
                        <p class="hint">The template belongs to this codex. Anyone who can edit it can use, change or delete it.</p>
                    </div>
                </template>
                <template x-if="dlg.type === 'copyPage'">
                    <div>
                        <div class="form-group">
                            <label for="dCpTitle">Title</label>
                            <input type="text" id="dCpTitle" maxlength="120" autocomplete="off" x-model="dlg.title" x-ref="dlgFocus">
                        </div>
                        <div class="form-group">
                            <label for="dCpCodex">Codex</label>
                            <select id="dCpCodex" x-model="dlg.codexId" @change="onDlgCodexChange()">
                                <template x-for="w in codexChoices" :key="w.id"><option :value="w.id" x-text="w.name" :selected="w.id === dlg.codexId"></option></template>
                            </select>
                        </div>
                        <div class="form-group" x-show="dlg.folders && dlg.folders.length">
                            <label for="dCpFolder">Folder</label>
                            <select id="dCpFolder" x-model="dlg.folderId">
                                <option value="">Top level</option>
                                <template x-for="o in folderOptions(dlg.folders)" :key="o.id"><option :value="o.id" x-text="o.label" :selected="o.id === dlg.folderId"></option></template>
                            </select>
                        </div>
                        <label class="cx-check" x-show="pageData.tags.length"><input type="checkbox" x-model="dlg.copyTags"><span x-text="'Copy its tags (' + pageData.tags.map((t) => t.name).join(', ') + ')'"></span></label>
                        <label class="cx-check" x-show="pageData.images.length"><input type="checkbox" x-model="dlg.copyImages"><span><span x-text="'Copy its ' + countLabel(pageData.images.length, 'image')"></span> <small>The files are duplicated, so each page keeps its own.</small></span></label>
                        <p class="hint">The copy starts its own history at revision 1. Aliases are not copied, and [[links]] stay as written and point at pages of the codex it goes to.</p>
                    </div>
                </template>
                <template x-if="dlg.type === 'folder'">
                    <div>
                        <div class="form-group">
                            <label for="dFolderName">Folder name</label>
                            <input type="text" id="dFolderName" maxlength="80" x-model="dlg.name" x-ref="dlgFocus">
                            <p class="hint">Folders only sort pages. Links and page titles work the same wherever a page is filed.</p>
                        </div>
                    </div>
                </template>
                <template x-if="dlg.type === 'folderTpl'">
                    <div>
                        <div class="form-group">
                            <label for="dFolderTpl">New pages here start from</label>
                            <select id="dFolderTpl" x-model="dlg.tpl" x-ref="dlgFocus">
                                <option value="">No default (the last template you used)</option>
                                <template x-for="g in tplGroups(dlg.templates)" :key="g.label">
                                    <optgroup :label="g.label">
                                        <template x-for="t in g.items" :key="t.id"><option :value="t.id" x-text="t.name" :selected="t.id === dlg.tpl"></option></template>
                                    </optgroup>
                                </template>
                            </select>
                            <p class="hint">Used by + New page in this folder and by missing links created into it. People can still pick another template. Sub-folders without their own default use this one.</p>
                        </div>
                    </div>
                </template>
                <template x-if="dlg.type === 'folderMove' || dlg.type === 'pageFolder'">
                    <div>
                        <div class="form-group">
                            <label for="dFolderPick" x-text="dlg.type === 'pageFolder' ? 'Folder' : 'Move into'"></label>
                            <select id="dFolderPick" x-model="dlg.folderId" x-ref="dlgFocus">
                                <option value="">Top level</option>
                                <template x-for="o in folderOptions(dlg.folders, dlg.excludeId)" :key="o.id"><option :value="o.id" x-text="o.label" :disabled="o.disabled" :selected="o.id === dlg.folderId"></option></template>
                            </select>
                        </div>
                    </div>
                </template>
                <template x-if="dlg.type === 'codex'">
                    <div>
                        <div class="form-group">
                            <label for="dName">Name</label>
                            <input type="text" id="dName" maxlength="80" x-model="dlg.name" x-ref="dlgFocus">
                        </div>
                        <div class="form-group">
                            <label for="dDesc">Description (optional)</label>
                            <textarea id="dDesc" rows="6" x-model="dlg.description"></textarea>
                            <p class="hint">Formatting works as on pages. Shown at the top of the codex.</p>
                        </div>
                    </div>
                </template>
                <template x-if="dlg.type === 'rename'">
                    <div>
                        <div class="form-group">
                            <label for="dRename">New title</label>
                            <input type="text" id="dRename" maxlength="120" x-model="dlg.title" x-ref="dlgFocus">
                            <p class="hint">Links to the old title in this codex are rewritten to the new one. Links that use an alias are left alone.</p>
                        </div>
                    </div>
                </template>
                <template x-if="dlg.type === 'aliases'">
                    <div>
                        <div class="form-group">
                            <label for="dAliases">Other names, one per line</label>
                            <textarea id="dAliases" rows="5" x-model="dlg.text" x-ref="dlgFocus"></textarea>
                            <p class="hint">A link like [[Hesk]] reaches this page if "Hesk" is one of its names. Each name is unique within the codex.</p>
                        </div>
                    </div>
                </template>
                <template x-if="dlg.type === 'tags'">
                    <div>
                        <div class="form-group">
                            <label for="dTagInput">Add a tag</label>
                            <input type="text" id="dTagInput" maxlength="120" list="dTagList" autocomplete="off" x-model="dlg.input" x-ref="dlgFocus" @keydown.enter.prevent="addTagInput(dlg)" @keydown.comma.prevent="addTagInput(dlg)">
                            <datalist id="dTagList"><template x-for="t in tagSuggestions" :key="t.id"><option :value="t.name"></option></template></datalist>
                            <p class="hint">Press Enter to add it. Pick one this codex already has, or type a new one. Tags are only labels; click one on a page to list the pages that have it.</p>
                        </div>
                        <ul class="cx-tagpick" aria-label="Tags on this page">
                            <template x-for="n in dlg.names" :key="n"><li><span class="cx-chip cx-chip--tag"><span x-text="n"></span><button type="button" class="cx-chip-x" :aria-label="'Remove the tag ' + n" @click="removeTagName(dlg, n)">&times;</button></span></li></template>
                        </ul>
                        <p class="hint" x-show="dlg.names.length === 0">No tags on this page.</p>
                    </div>
                </template>
                <template x-if="dlg.type === 'tag'">
                    <div>
                        <div class="form-group">
                            <label for="dTagName">Tag name</label>
                            <input type="text" id="dTagName" maxlength="40" x-model="dlg.name" x-ref="dlgFocus">
                            <p class="hint" x-text="dlg.tag ? 'Renaming changes it on every page that has it.' : 'Up to 40 characters. Each name is unique within the codex.'"></p>
                        </div>
                    </div>
                </template>
                <template x-if="dlg.type === 'move'">
                    <div>
                        <div class="form-group">
                            <label for="dMove">Move to</label>
                            <select id="dMove" x-model="dlg.codexId" x-ref="dlgFocus">
                                <template x-for="w in codexChoices" :key="w.id"><option :value="w.id" x-text="w.name" :disabled="w.id === page.codex.id" :selected="w.id === dlg.codexId"></option></template>
                            </select>
                        </div>
                        <p class="hint" x-text="moveWarning"></p>
                    </div>
                </template>
                <div class="notice" role="alert" x-show="dlg.error"><p x-text="dlg.error"></p></div>
                <div class="modal-actions">
                    <button type="button" class="text-link" x-show="dlg.type === 'event' && dlg.eventId" :disabled="dlg.busy" @click="deleteEvent()">Delete event</button>
                    <button type="submit" class="submit-btn" x-show="dlg.type !== 'templates'" :disabled="dlg.busy" x-text="dlgSubmit"></button>
                    <button type="button" class="btn-cancel" @click="cancelDlg()" x-text="dlg.type === 'templates' ? 'Close' : dlg.type === 'template' && dlg.back ? 'Back' : dlg.type === 'createMissing' ? 'Just save' : 'Cancel'"></button>
                </div>
            </form>
        </div>
    </div>

    <!-- Picture lightbox: Esc, the close button or a click on the backdrop closes it; focus goes back to what opened it -->
    <dialog class="cx-lightbox" x-ref="lightbox" aria-labelledby="lbCaption" @click="onLightboxClick($event)">
        <figure>
            <img :src="lightbox.url" :alt="lightbox.caption">
            <figcaption><strong id="lbCaption" x-text="lightbox.caption"></strong><span x-text="lightbox.meta"></span></figcaption>
        </figure>
        <button type="button" class="cx-lightbox-close" aria-label="Close" @click="$refs.lightbox.close()">&times;</button>
    </dialog>

    <!-- Confirm Modal -->
    <div id="confirmModal" class="modal confirm-modal" :class="{ 'modal-open': confirmDialog.open }" @click.self="closeConfirm(false)" @keydown.escape.window="confirmDialog.open && closeConfirm(false)" role="dialog" aria-modal="true" aria-labelledby="confirmModalTitle">
        <div class="modal-content confirm-modal-content">
            <div class="modal-header">
                <div>
                    <span class="modal-eyebrow" x-text="confirmDialog.eyebrow"></span>
                    <h2 id="confirmModalTitle" x-text="confirmDialog.title"></h2>
                </div>
                <button type="button" class="modal-close" @click="closeConfirm(false)" aria-label="Close">&times;</button>
            </div>
            <div class="modal-form">
                <p class="confirm-modal-message" x-text="confirmDialog.message"></p>
                <div class="modal-actions">
                    <button type="button" :class="confirmDialog.danger ? 'btn-confirm-danger' : 'submit-btn'" @click="closeConfirm(true)" x-text="confirmDialog.confirmLabel"></button>
                    <button type="button" class="btn-cancel" x-ref="confirmCancelBtn" @click="closeConfirm(false)">Cancel</button>
                </div>
            </div>
        </div>
    </div>

    <script src="/static/notifications.js?v=15"></script>
    <script src="/campaigns.js?v=66"></script>
    <script src="/static/codex-editor.js?v=6"></script>
    <script src="/static/codex-graph.js?v=3"></script>
    <script src="/static/codex-help.js?v=3"></script>
    <script src="/static/codex.js?v=40"></script>
</body>
</html>
