<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Waystone - Codices</title>
    <link rel="icon" href="/static/img/favicon.svg" type="image/svg+xml">
    <script src="/static/theme.js?v=8"></script>
    <link rel="stylesheet" href="/static/styles.css?v=78">
    <link rel="stylesheet" href="/static/notifications.css?v=10">
    <link rel="stylesheet" href="/static/codex.css?v=25">
    <script defer src="/static/vendor/alpinejs.min.js"></script>
</head>
<body class="journal-page codex-page" x-data="codexPage()">
    <div class="header">
        <div class="header-left">
            <a href="/" class="logo">Waystone</a>
        </div>
        <nav class="nav-bar" aria-label="Main">
            <a href="/" class="nav-item" data-page="dashboard">Home</a>
            <a href="/campaigns" class="nav-item" data-page="campaigns">Games</a>
            <a href="/characters" class="nav-item" data-page="characters">Characters</a>
            <a href="/codices" class="nav-item active" aria-current="page" data-page="codex">Codices</a>
            <a href="/admin/users" class="nav-item" data-page="admin-users" x-show="isAdmin">Admin</a>
        </nav>
        <div class="header-right">
            <details class="user-menu">
                <summary><span class="user-menu-avatar" aria-hidden="true" x-text="(displayName || '?').charAt(0).toUpperCase()"></span><span class="user-menu-name" x-text="displayName"></span><span class="user-menu-caret" aria-hidden="true">&#9662;</span></summary>
                <div class="user-menu-panel">
                    <a href="/profile">Profile</a>
                    <button type="button" @click="handleLogout()">Log out</button>
                </div>
            </details>
        </div>
    </div>

    <!-- Codices top bar: codex picker and search (the site header above stays as on every page) -->
    <div class="cx-top" :inert="navOpen ? '' : null">
        <button type="button" class="cx-icon cx-menu-btn" x-ref="menuBtn" x-show="screen !== 'home'" x-cloak aria-label="Open the page list" aria-controls="cxNav" :aria-expanded="navOpen ? 'true' : 'false'" @click="toggleNav()">
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 7h16M4 12h16M4 17h16"/></svg>
        </button>
        <a class="cx-brand" href="/codices">Codices</a>
        <div class="cx-pick" @click.outside="pickOpen = false" @keydown.escape="pickOpen = false">
            <button type="button" class="cx-pick-btn" title="Switch codex" aria-haspopup="true" :aria-expanded="pickOpen ? 'true' : 'false'" @click="togglePick()"><span x-text="pickLabel"></span></button>
            <div class="cx-pick-menu" x-show="pickOpen" x-cloak>
                <a href="/codices" :aria-current="screen === 'home' ? 'page' : null">All codices</a>
                <template x-for="c in (allCodices || [])" :key="c.id">
                    <a :href="'/codices/c/' + encodeURIComponent(c.id)" :aria-current="c.id === currentCodexId ? 'page' : null" x-text="c.name"></a>
                </template>
                <p class="cx-pick-note" x-show="allCodices === null">Loading...</p>
            </div>
        </div>
        <div class="cx-search" role="search" @click.outside="searchOpen = false" @focusout="if (!$event.relatedTarget || !$event.currentTarget.contains($event.relatedTarget)) searchOpen = false">
            <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
            <label class="visually-hidden" for="cxSearch" x-text="screen === 'home' ? 'Search all codices' : 'Search this codex'"></label>
            <input type="search" id="cxSearch" x-ref="search" :placeholder="searchPlaceholder" autocomplete="off" x-model="searchQ" @focus="onSearchFocus()" @input="onSearchInput()" @keydown="onSearchKey($event)">
            <kbd aria-hidden="true">/</kbd>
            <div class="cx-results" x-show="searchOpen && searchQ.trim()" x-cloak>
                <template x-for="(r, i) in searchResults" :key="r.id">
                    <a :href="pageUrl(r)" :class="{ on: i === searchIdx }">
                        <span class="cx-results-title" x-text="r.title"></span>
                        <span class="cx-results-meta" x-show="r.meta" x-text="r.meta"></span>
                    </a>
                </template>
                <p class="cx-pick-note" x-show="searchResults.length === 0" x-text="searchLoading || (screen !== 'home' && !codex) ? 'Searching...' : 'No page matches.'"></p>
            </div>
        </div>
    </div>

    <div class="cx-shell" :class="{ ['cx-shell--' + screen]: true, 'nav-open': navOpen, 'nav-anim': navAnim }" @keydown.escape.window="navOpen && closeNav()">
        <div class="cx-scrim" @click="closeNav()"></div>

        <!-- Left nav: the folder tree. A drawer on phones. -->
        <aside class="cx-nav" id="cxNav" x-show="screen !== 'home'" x-cloak aria-label="Pages in this codex" @click="onNavClick($event)">
            <div class="cx-nav-in">
                <div class="cx-drawer-head">
                    <span class="cx-drawer-name" x-text="codex ? codex.codex.name : ''"></span>
                    <button type="button" class="cx-icon" aria-label="Close the page list" x-ref="navClose" @click="closeNav()">
                        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 6l12 12M18 6 6 18"/></svg>
                    </button>
                </div>
                <template x-if="codex">
                    <div>
                        <button type="button" class="cx-new" x-show="canEdit" @click="closeNav(); openCreatePage()">+ New page</button>
                        <p class="cx-nav-title">Pages</p>
                        <p class="cx-nav-empty" x-show="codex.pages.length === 0 && codex.folders.length === 0">No pages yet.</p>
                        <div class="codex-tree-wrap" @click.window="folderMenu.id && !$event.target.closest('.codex-menu, .codex-menu-btn') && closeFolderMenu()">
                            <div class="codex-tree" x-html="treeHtml" @click="onTreeClick($event)" @toggle.capture="onFolderToggle($event)"></div>
                            <div class="codex-menu" role="menu" x-ref="folderMenu" x-show="folderMenu.id" x-html="folderMenu.html" :style="'top:' + folderMenu.top + 'px;right:' + folderMenu.right + 'px'" @click="onMenuClick($event)" @keydown="onMenuKey($event)"></div>
                        </div>
                        <p class="cx-nav-foot" x-show="canEdit"><button type="button" class="text-link" id="new-folder-btn" @click="closeNav(); openNewFolder('')">+ New folder</button></p>
                        <div class="cx-nav-group">
                            <p class="cx-nav-title">This codex</p>
                            <a :href="'/codices/c/' + encodeURIComponent(codex.codex.id)" :aria-current="screen === 'codex' ? 'page' : null">Codex home</a>
                            <a :href="'/codices/c/' + encodeURIComponent(codex.codex.id) + '#tags'">Tags <span class="cx-count" x-text="codex.tags.length"></span></a>
                            <a :href="'/codices/c/' + encodeURIComponent(codex.codex.id) + '#wanted'">Wanted pages <span class="cx-count" x-text="codex.wanted.length"></span></a>
                            <a :href="'/codices/c/' + encodeURIComponent(codex.codex.id) + '#recent'">Recent changes</a>
                            <a :href="graphUrl()" :aria-current="screen === 'graph' ? 'page' : null">Graph view</a>
                            <a href="#templates" id="cxTemplatesLink" @click.prevent="openTemplates()">Templates</a>
                        </div>
                    </div>
                </template>
            </div>
        </aside>

        <main class="cx-main" :inert="navOpen ? '' : null">
            <!-- Recently opened pages of this codex -->
            <nav class="cx-tabs" x-show="screen !== 'home' && (tabs.length || screen === 'graph')" x-cloak aria-label="Recently opened pages">
                <template x-for="t in tabs" :key="t.id">
                    <span class="cx-tab" :class="{ on: t.id === currentPageId }">
                        <a :href="pageUrl(t)" :aria-current="t.id === currentPageId ? 'page' : null" x-text="t.title"></a>
                        <button type="button" class="cx-tab-x" :aria-label="'Close the tab ' + t.title" @click="closeTab(t)">&times;</button>
                    </span>
                </template>
                <span class="cx-tab on" x-show="screen === 'graph'"><a :href="graphUrl()" aria-current="page">Graph</a></span>
            </nav>

            <div class="cx-inner">
                <nav class="cx-crumb" x-show="screen !== 'home'" x-cloak aria-label="Breadcrumb">
                    <a href="/codices">Codices</a>
                    <template x-for="(c, i) in crumbs" :key="i">
                        <span :class="{ 'crumb-mid': c.mid, 'crumb-ellipsis': c.ellipsis }"><span aria-hidden="true"> › </span><a x-show="c.href" :href="c.href" x-text="c.label"></a><span x-show="!c.href && c.ellipsis" aria-hidden="true" x-text="c.label"></span><span x-show="!c.href && !c.ellipsis" :aria-current="i === crumbs.length - 1 ? 'page' : null" x-text="c.label"></span></span>
                    </template>
                </nav>

                <p x-show="loading">Loading...</p>
                <div class="game-error" role="alert" x-show="loadError">
                    <p x-text="loadError"></p>
                    <button type="button" class="campaign-action-btn" @click="load()">Try again</button>
                </div>
                <template x-if="notFound">
                    <p>That page or codex could not be found. It may have been deleted. <a href="/codices">Back to the codices</a></p>
                </template>

                <div class="message journal-message" :class="messageType" x-show="messageVisible" role="status" x-text="messageText"></div>

                <!-- Graph -->
                <template x-if="screen === 'graph' && codex">
                    <section class="cx-graph" id="gvRoot" aria-labelledby="gvTitle">
                        <header class="cx-head">
                            <div class="cx-head-text">
                                <h1 class="cx-title" id="gvTitle" tabindex="-1">Graph</h1>
                            </div>
                            <div class="cx-actions" x-show="graphFrom">
                                <a class="cx-act" :href="graphFrom ? pageUrl(graphFrom) : '#'" x-text="graphFrom ? '← ' + graphFrom.title : ''"></a>
                            </div>
                        </header>
                        <p class="cx-sub" x-text="graphSummary"></p>
                        <p class="same" x-show="graphLoading">Loading the graph...</p>
                        <p class="same" x-show="graphError" role="alert" x-text="graphError"></p>
                        <div class="gv-legend" id="gvLegend" aria-label="Node colours"></div>
                        <div class="gv-stage" x-show="graphReady">
                            <svg class="gv-svg" id="gvSvg" role="group" aria-label="The pages of this codex and the links between them. Use the filters to jump to one."></svg>
                            <div class="gv-zoom">
                                <button type="button" id="gvIn" aria-label="Zoom in">+</button>
                                <button type="button" id="gvOut" aria-label="Zoom out">&minus;</button>
                                <button type="button" id="gvFit" aria-label="Fit the whole graph">Fit</button>
                            </div>
                            <details class="gv-settings" id="gvSettings" open>
                                <summary>Filters</summary>
                                <label>Find a page<input type="search" id="gvFind" placeholder="Title" autocomplete="off"></label>
                                <label>Highlight a tag<select id="gvTag"><option value="">None</option></select></label>
                                <label class="ck"><input type="checkbox" id="gvMissing" checked> Pages not written yet</label>
                                <label class="ck"><input type="checkbox" id="gvOrphans" checked> Pages with no links</label>
                                <label class="ck"><input type="checkbox" id="gvLabels" checked> Always show titles</label>
                            </details>
                            <div class="gv-card" id="gvCard" role="dialog" aria-labelledby="gvCardTitle" hidden>
                                <button type="button" class="cx-icon gv-card-close" id="gvCardClose" aria-label="Close"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 6l12 12M18 6 6 18"/></svg></button>
                                <strong id="gvCardTitle"></strong>
                                <div class="where" id="gvCardWhere"></div>
                                <div class="gv-card-tags" id="gvCardTags"></div>
                                <p id="gvCardText"></p>
                                <p class="gv-card-count" id="gvCardCount"></p>
                                <a class="cx-act cx-act--primary" id="gvCardOpen" href="#">Open page</a>
                                <button type="button" class="cx-act cx-act--primary" id="gvCardCreate" hidden>Create page</button>
                            </div>
                            <p class="gv-nomatch" id="gvNoMatch" role="status" hidden>No page matches.</p>
                            <p class="gv-hint">Drag to move around · scroll or pinch to zoom · drag a page to move it · click a page for details</p>
                        </div>
                    </section>
                </template>

                <!-- Home -->
                <template x-if="screen === 'home' && home">
                    <div>
                        <header class="cx-head">
                            <div class="cx-head-text">
                                <h1 class="cx-title" tabindex="-1">Codices</h1>
                            </div>
                            <div class="cx-actions">
                                <button type="button" class="cx-act cx-act--primary" x-show="home.can_create" @click="openCreateCodex()">+ New codex</button>
                            </div>
                        </header>
                        <p class="cx-sub">Codices hold pages. A page links to others in its codex with [[double brackets]].</p>
                        <section class="codex-section">
                            <h2 class="section-header">Codices</h2>
                            <p class="same" x-show="home.codices.length === 0" x-text="home.can_create ? 'No codices yet. Make a codex first.' : 'No codices to show yet.'"></p>
                            <div class="codex-cards">
                                <template x-for="w in home.codices" :key="w.id">
                                    <a class="codex-card" :href="'/codices/c/' + encodeURIComponent(w.id)">
                                        <span class="codex-card-name" x-text="w.name"></span>
                                        <span class="codex-card-excerpt" x-text="w.excerpt || 'No description yet.'"></span>
                                        <span class="codex-card-meta" x-text="countLabel(w.page_count, 'page')"></span>
                                    </a>
                                </template>
                            </div>
                        </section>
                        <section class="codex-section">
                            <h2 class="section-header">Recent changes</h2>
                            <p class="same" x-show="home.recent.length === 0">Nothing has been written yet.</p>
                            <ul class="recent">
                                <template x-for="r in home.recent" :key="r.page_id + '-' + r.number">
                                    <li x-html="recentHtml(r, true)"></li>
                                </template>
                            </ul>
                        </section>
                    </div>
                </template>

                <!-- Codex -->
                <template x-if="screen === 'codex' && codex">
                    <div>
                        <header class="cx-head">
                            <div class="cx-head-text">
                                <h1 class="cx-title" tabindex="-1" x-text="codex.codex.name"></h1>
                            </div>
                            <div class="cx-actions">
                                <button type="button" class="cx-act" x-show="codex.can_manage" @click="openEditCodex()">Edit codex</button>
                                <button type="button" class="cx-act cx-act--danger" x-show="codex.can_manage" @click="deleteCodex()">Delete codex</button>
                            </div>
                        </header>
                        <div class="game-text codex-text cx-article cx-article--desc" x-show="codex.codex.description" x-html="renderMarkdown(codex.codex.description)"></div>
                        <section class="codex-section" id="tagged" x-show="tagFilter" aria-label="Pages with a tag">
                            <h2 class="section-header">Tagged <span class="cx-chip" x-text="filterTag ? filterTag.name : tagFilter"></span></h2>
                            <p class="same" x-show="!filterTag">This codex has no tag called “<span x-text="tagFilter"></span>”. <a :href="'/codices/c/' + encodeURIComponent(codex.codex.id) + '#tags'">All tags</a></p>
                            <p class="same" x-show="filterTag && taggedPages.length === 0">No page has this tag.</p>
                            <ul class="page-list" x-show="filterTag && taggedPages.length">
                                <template x-for="p in taggedPages" :key="p.id">
                                    <li><a :href="pageUrl(p)" x-text="p.title"></a><span class="muted" x-show="p.aliases.length" x-text="' · also ' + p.aliases.join(', ')"></span></li>
                                </template>
                            </ul>
                            <p><a :href="'/codices/c/' + encodeURIComponent(codex.codex.id)">Show all pages</a></p>
                        </section>
                        <section class="codex-section" x-show="!tagFilter">
                            <h2 class="section-header">Pages</h2>
                            <div class="field" x-show="codex.pages.length > 8">
                                <label for="pageFilter" class="label">Find a page</label>
                                <input type="search" id="pageFilter" x-model="pageFilter" placeholder="Title or alias">
                            </div>
                            <p class="same" x-show="codex.pages.length === 0" x-text="codex.can_edit ? 'No pages yet. Use + New page in the page list.' : 'No pages yet.'"></p>
                            <div x-show="!pageFilter.trim()">
                                <template x-for="g in pageGroups" :key="g.id">
                                    <section class="cx-group">
                                        <h3 class="cx-group-name" :id="'group-' + g.id" x-text="g.label"></h3>
                                        <ul class="page-list">
                                            <template x-for="p in g.pages" :key="p.id">
                                                <li><a :href="pageUrl(p)" x-text="p.title"></a><span class="muted" x-show="p.aliases.length" x-text="' · also ' + p.aliases.join(', ')"></span></li>
                                            </template>
                                        </ul>
                                    </section>
                                </template>
                            </div>
                            <ul class="page-list" x-show="pageFilter.trim()">
                                <template x-for="p in filteredPages" :key="p.id">
                                    <li><a :href="pageUrl(p)" x-text="p.title"></a><span class="muted" x-show="p.aliases.length" x-text="' · also ' + p.aliases.join(', ')"></span></li>
                                </template>
                            </ul>
                        </section>
                        <section class="codex-section" id="tags" aria-label="Tags">
                            <h2 class="section-header">Tags</h2>
                            <p class="same" x-show="codex.tags.length === 0" x-text="codex.can_edit ? 'No tags yet. Add them to a page with Edit tags, or start one here.' : 'No tags yet.'"></p>
                            <ul class="cx-taglist" x-show="codex.tags.length">
                                <template x-for="t in codex.tags" :key="t.id">
                                    <li>
                                        <a class="cx-chip cx-chip--tag" :href="tagUrl(t.name)" :aria-current="filterTag && filterTag.id === t.id ? 'true' : null" x-text="t.name"></a>
                                        <span class="cx-count" x-text="countLabel(t.page_count, 'page')"></span>
                                        <span class="cx-taglist-acts" x-show="codex.can_edit">
                                            <button type="button" class="text-link" :aria-label="'Rename the tag ' + t.name" @click="openRenameTag(t)">Rename</button>
                                            <button type="button" class="text-link" :aria-label="'Delete the tag ' + t.name" @click="deleteTag(t)">Delete</button>
                                        </span>
                                    </li>
                                </template>
                            </ul>
                            <p x-show="codex.can_edit"><button type="button" class="text-link" @click="openNewTag()">+ New tag</button></p>
                        </section>
                    </div>
                </template>

                <!-- Page, Edit and History share this header -->
                <template x-if="pageData && (screen === 'page' || screen === 'edit' || screen === 'history')">
                    <div>
                        <header class="cx-head">
                            <div class="cx-head-text">
                                <h1 class="cx-title" tabindex="-1" x-text="page.title"></h1>
                            </div>
                            <div class="cx-actions">
                                <a class="cx-act" x-show="screen !== 'page'" :href="pageUrl(page)">Read</a>
                                <a class="cx-act cx-act--primary" x-show="canEdit" :href="pageUrl(page, '/edit')" :aria-current="screen === 'edit' ? 'page' : null">
                                    <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 20h4L19 9l-4-4L4 16z"/></svg>Edit
                                </a>
                                <a class="cx-act" :href="pageUrl(page, '/history')" :aria-current="screen === 'history' ? 'page' : null" :title="countLabel(page.revision_count, 'revision')">
                                    <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 12a9 9 0 1 0 3-6.7L3 8"/><path d="M3 3v5h5M12 7v5l3 2"/></svg>History <span class="cx-count" x-text="page.revision_count"></span>
                                </a>
                                <span class="cx-spacer"></span>
                                <div class="cx-more" x-show="(canEdit || canCopy) && screen !== 'edit'" @click.outside="moreOpen = false" @keydown="onMoreKey($event)">
                                    <button type="button" class="cx-act" id="cxMoreBtn" aria-haspopup="menu" :aria-expanded="moreOpen ? 'true' : 'false'" aria-controls="cxMoreMenu" @click="toggleMore()">
                                        <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="5" cy="12" r="1"/><circle cx="12" cy="12" r="1"/><circle cx="19" cy="12" r="1"/></svg><span class="cx-act-long">More</span><span class="visually-hidden"> page actions</span>
                                    </button>
                                    <div class="cx-more-menu" id="cxMoreMenu" role="menu" x-ref="moreMenu" x-show="moreOpen" x-cloak>
                                        <button type="button" role="menuitem" x-show="canEdit" @click="moreDo('openRename')">Rename</button>
                                        <button type="button" role="menuitem" x-show="canEdit" @click="moreDo('openAliases')">Aliases</button>
                                        <button type="button" role="menuitem" x-show="canEdit" @click="moreDo('openPageFolder')">Change folder</button>
                                        <button type="button" role="menuitem" x-show="canEdit" @click="moreDo('openMove')">Move to another codex…</button>
                                        <button type="button" role="menuitem" x-show="canCopy" @click="moreDo('openCopyPage')">Copy page…</button>
                                        <button type="button" role="menuitem" x-show="canEdit" @click="moreDo('openSaveTemplate')">Save as template…</button>
                                        <hr x-show="canEdit">
                                        <button type="button" role="menuitem" class="cx-danger" x-show="canEdit" @click="moreDo('deletePage')">Delete page</button>
                                    </div>
                                </div>
                            </div>
                        </header>
                        <p class="cx-sub" x-show="screen === 'page'" x-text="'Revision ' + page.current_revision + ' · last edited by ' + page.updated_by_user.display_name + ' ' + formatStamp(page.updated_at)"></p>
                        <p class="cx-sub" x-show="screen === 'edit' && draft" x-text="draft ? 'Saving adds revision ' + (draft.base + 1) + '. To change the title, use Rename.' : ''"></p>
                        <p class="cx-sub" x-show="screen === 'history'" x-text="journalByline(page)"></p>
                        <p class="cx-sub" x-show="screen === 'history' && pruned">Only the latest 200 revisions are kept.</p>
                    </div>
                </template>

                <!-- Page -->
                <template x-if="screen === 'page' && pageData">
                    <div @scroll.window.passive="updateToc()">
                        <section class="cx-props" aria-label="Properties">
                            <h2 class="cx-props-label">Properties</h2>
                            <figure class="cx-cover" x-show="pageData.cover">
                                <button type="button" class="cx-img-btn" @click="openLightbox(coverPic())" :aria-label="pageData.cover ? 'View the cover larger: ' + pageData.cover.name : ''">
                                    <img :src="pageData.cover ? pageData.cover.url : ''" :alt="pageData.cover ? pageData.cover.name : ''">
                                </button>
                            </figure>
                            <dl>
                                <div class="cx-prop"><dt>Codex</dt><dd><a :href="'/codices/c/' + encodeURIComponent(page.codex.id)" x-text="page.codex.name"></a></dd></div>
                                <div class="cx-prop"><dt>Folder</dt><dd><span x-text="page.folder_path.length ? page.folder_path.map((f) => f.name).join(' › ') : 'Top level'"></span> <button type="button" class="text-link" x-show="canEdit" @click="openPageFolder()">Change</button></dd></div>
                                <div class="cx-prop" x-show="pageData.tags.length || canEdit"><dt>Tags</dt><dd><template x-for="t in pageData.tags" :key="t.id"><a class="cx-chip cx-chip--tag" :href="tagUrl(t.name)" x-text="t.name"></a></template><span class="muted" x-show="!pageData.tags.length">None</span> <button type="button" class="text-link" x-show="canEdit" @click="openTags()">Edit tags</button></dd></div>
                                <div class="cx-prop" x-show="page.aliases.length"><dt>Also known as</dt><dd><template x-for="a in page.aliases" :key="a"><span class="cx-chip" x-text="a"></span></template></dd></div>
                                <div class="cx-prop"><dt>Started</dt><dd x-text="page.author_user.display_name + ', ' + shortDate(page.created_at)"></dd></div>
                                <div class="cx-prop"><dt>Scribes</dt><dd x-text="scribes"></dd></div>
                                <div class="cx-prop"><dt>Revisions</dt><dd><a :href="pageUrl(page, '/history')" x-text="page.revision_count"></a></dd></div>
                            </dl>
                        </section>
                        <article class="cx-article">
                            <details class="codex-contents" x-show="toc.length >= 2">
                                <summary>Contents</summary>
                                <ul>
                                    <template x-for="t in toc" :key="t.id">
                                        <li><a :href="'#' + t.id" :class="{ sub: t.level === 3 }" @click="tocActive = t.id" x-text="t.text"></a></li>
                                    </template>
                                </ul>
                            </details>
                            <div class="game-text codex-text" x-ref="body" @click="onBodyClick($event)" @pointerover="onBodyOver($event)" @pointerout="onBodyOut($event)" x-html="bodyHtml" x-effect="bodyHtml; $nextTick(() => buildToc())"></div>
                            <p class="same" x-show="!page.body.trim()">This page is empty.<span x-show="canEdit"> <a :href="pageUrl(page, '/edit')">Write it</a>.</span></p>
                        </article>
                    </div>
                </template>

                <!-- Edit -->
                <template x-if="screen === 'edit' && pageData && draft">
                    <div>
                        <div class="notice conflict" role="alert" x-show="conflict">
                            <h2 class="conflict-title"><span class="conflict-mark">§</span> <span x-text="conflictWho + ' saved revision ' + (conflict ? conflict.latest.number : '') + ' while you were editing'"></span></h2>
                            <p>Nothing is lost: your text is still in the editor below. This is what they changed:</p>
                            <div class="diff" x-show="conflict && conflict.html" x-html="conflict ? conflict.html : ''"></div>
                            <p class="same" x-show="conflict && !conflict.html">Their revision didn't change the text.</p>
                            <div class="form-foot">
                                <button type="button" class="submit-btn" :disabled="busy" @click="saveOnTop()">Save mine on top</button>
                                <button type="button" class="btn-cancel conflict-discard" @click="discardMine()">Discard mine</button>
                                <a class="text-link" target="_blank" rel="noopener" :href="pageUrl(page, '/history') + '?r=' + (conflict ? conflict.latest.number : '')" x-text="'Open revision ' + (conflict ? conflict.latest.number : '') + ' in a new tab'"></a>
                            </div>
                        </div>
                        <form class="edit-form" @submit.prevent="save()" novalidate>
                            <div class="field">
                                <div class="tabs" role="group" aria-label="Editor view">
                                    <button type="button" class="tab" :aria-pressed="draft.tab === 'write'" @click="draft.tab = 'write'">Write</button>
                                    <button type="button" class="tab" :aria-pressed="draft.tab === 'preview'" @click="draft.tab = 'preview'">Preview</button>
                                </div>
                                <div class="editor" :data-tab="draft.tab">
                                    <div class="pane pane--write" :class="{ 'cx-drag': dragOver }" @dragover="onDragOver($event)" @dragleave="dragOver = false" @drop.capture="onDrop($event)" @paste.capture="onPaste($event)">
                                        <div class="cx-pane-head">
                                            <label for="fBody">The page</label>
                                            <span class="cx-edtools-note" role="status" x-text="uploading"></span>
                                            <button type="button" class="cx-act" @click="$refs.imgInput.click()">
                                                <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="4" width="18" height="16"/><circle cx="9" cy="10" r="2"/><path d="M3 18l6-5 4 3 3-2 5 4"/></svg>Add image
                                            </button>
                                        </div>
                                        <div class="cm-host" x-ref="editorHost"></div>
                                        <textarea id="fBody" x-ref="bodyArea" placeholder="Write about it. Link other pages with [[Title]]." x-model="draft.body" x-show="!editorReady"></textarea>
                                    </div>
                                    <div class="pane pane--preview">
                                        <span class="label">Preview</span>
                                        <div class="preview">
                                            <div class="game-text codex-text" @click="onBodyClick($event)" x-html="previewHtml"></div>
                                        </div>
                                    </div>
                                </div>
                                <div class="cx-dropzone" :class="{ 'cx-drag': dragOver }" @dragover="onDragOver($event)" @dragleave="dragOver = false" @drop="onDrop($event)">
                                    <p><strong>Drop images here</strong>, paste them into the text, or <button type="button" class="text-link" @click="$refs.imgInput.click()">choose files</button>.</p>
                                    <p class="hint">PNG, JPEG, WebP or GIF, up to 25 MB each. Each one goes in at the cursor as <code>![[name|caption]]</code>. Images are saved as soon as they are added, the text with Save changes.</p>
                                    <input type="file" hidden x-ref="imgInput" accept="image/png,image/jpeg,image/webp,image/gif" multiple @change="onPickFiles($event)">
                                </div>
                                <div class="cx-thumbs-wrap" x-show="pageData.images.length">
                                    <h3 class="cx-props-label">Images on this page · <span x-text="pageData.images.length"></span></h3>
                                    <ul class="cx-thumbs">
                                        <template x-for="img in pageData.images" :key="img.id">
                                            <li>
                                                <button type="button" class="cx-img-btn" @click="openLightbox(thumbPic(img))" :aria-label="'View ' + img.name + ' larger'"><img :src="img.url" :alt="img.name" loading="lazy"></button>
                                                <span class="cx-thumb-name"><span x-text="img.name"></span> <span class="cx-flag" x-show="pageData.cover && pageData.cover.id === img.id">Cover</span></span>
                                                <span class="cx-thumb-acts">
                                                    <button type="button" class="text-link" :aria-label="'Insert ' + img.name + ' at the cursor'" @click="insertPicture(img)">Insert</button>
                                                    <button type="button" class="text-link" x-show="!(pageData.cover && pageData.cover.id === img.id)" :aria-label="'Set ' + img.name + ' as the cover'" @click="setCover(img)">Set as cover</button>
                                                    <button type="button" class="text-link" x-show="pageData.cover && pageData.cover.id === img.id" @click="setCover(null)">Remove cover</button>
                                                    <button type="button" class="text-link" :aria-label="'Remove ' + img.name" @click="removePicture(img)">Remove</button>
                                                </span>
                                            </li>
                                        </template>
                                    </ul>
                                </div>
                                <p class="hint hint--formatting">Formatting: **bold** · *italic* · # heading · - list · 1. list · &gt; quote · [link](https://…) · [[Page title]] or [[Page title|shown text]] to link a page in this codex · ![[image.png|caption]] to show an image</p>
                            </div>
                            <div class="field field--note">
                                <label for="fNote">What changed (optional)</label>
                                <input type="text" id="fNote" maxlength="120" placeholder="Added the history of the tower" x-model="draft.note">
                            </div>
                            <div class="notice" role="alert" x-show="draft.error"><p x-text="draft.error"></p></div>
                            <div class="form-foot">
                                <button type="submit" class="submit-btn" :disabled="busy || draft.locked || !!uploading">Save changes</button>
                                <a class="campaign-action-btn" :href="pageUrl(page)">Cancel</a>
                            </div>
                        </form>
                    </div>
                </template>

                <!-- History -->
                <template x-if="screen === 'history' && pageData">
                    <div>
                        <p x-show="historyLoading">Loading history...</p>
                        <div class="history" x-show="!historyLoading && revisions.length > 0">
                            <ol class="revs" reversed aria-label="Revisions, newest first">
                                <template x-for="r in revisions" :key="r.number">
                                    <li class="rev-item">
                                        <button type="button" class="rev" :aria-current="r.number === selected" @click="selectRevision(r.number)">
                                            <span x-html="userAvatarHtml(r.author_user, false)"></span>
                                            <span class="rev-head"><span class="rev-no" x-text="'Revision ' + r.number"></span><span class="tag" x-show="r.number === currentRevision">✓ Current</span></span>
                                            <span class="rev-meta" x-text="r.author_user.display_name + (r.author_id === currentUserId ? ' (you)' : '') + ' · ' + formatStamp(r.created_at)"></span>
                                            <span class="rev-note"><span x-text="revNote(r) || 'No note'"></span> <span class="rev-delta" x-html="deltaHtml(r)"></span></span>
                                        </button>
                                    </li>
                                </template>
                            </ol>
                            <section class="detail" aria-live="polite" x-show="selectedRevision">
                                <div class="detail-head">
                                    <div>
                                        <h2 class="detail-title">§ Revision <span class="t-no" x-text="selected"></span></h2>
                                        <p class="detail-sub" x-text="selectedRevision ? selectedRevision.author_user.display_name + ' · ' + formatStamp(selectedRevision.created_at) + (revNote(selectedRevision) ? ' · ' + revNote(selectedRevision) : '') : ''"></p>
                                    </div>
                                    <span class="legend" x-show="selected === currentRevision">This is the current version.</span>
                                    <button type="button" class="submit-btn" x-show="canEdit && selected !== currentRevision" :disabled="busy" @click="restore()">Restore this version</button>
                                </div>
                                <div class="toolbar">
                                    <div role="group" aria-label="Show">
                                        <button type="button" class="tab" :aria-pressed="historyMode === 'changes'" @click="historyMode = 'changes'">Changes</button>
                                        <button type="button" class="tab" :aria-pressed="historyMode === 'full'" @click="historyMode = 'full'">Full text</button>
                                    </div>
                                    <span class="legend" x-show="historyMode === 'changes' && previousRevision">Against revision <span x-text="previousRevision ? previousRevision.number : ''"></span>: <ins>added</ins> · <del>removed</del></span>
                                </div>
                                <p class="same" x-show="bodyLoading">Loading this revision...</p>
                                <div x-show="historyMode === 'full'">
                                    <div class="game-text codex-text" x-html="codexMarkdown(selectedBody, null)"></div>
                                </div>
                                <div x-show="historyMode === 'changes'">
                                    <p class="same" x-show="!previousRevision" x-text="pruned && selected > 1 ? 'This is the oldest revision still kept, so there is nothing to compare it with.' : 'This is the first version of the page, so there is nothing to compare it with.'"></p>
                                    <div class="game-text codex-text" x-show="!previousRevision" x-html="codexMarkdown(selectedBody, null)"></div>
                                    <template x-if="previousRevision && selectedDiff">
                                        <div class="detail-changes">
                                            <div class="diff" x-show="selectedDiff.added || selectedDiff.removed" x-html="selectedDiff.html"></div>
                                            <p class="same" x-show="!selectedDiff.added && !selectedDiff.removed">The text did not change in this revision.</p>
                                        </div>
                                    </template>
                                </div>
                            </section>
                        </div>
                    </div>
                </template>
            </div>
        </main>

        <!-- Right rail: outline, backlinks, wanted pages -->
        <aside class="cx-rail" :inert="navOpen ? '' : null" x-show="(screen === 'page' && pageData) || (screen === 'codex' && codex)" x-cloak aria-label="Side panel">
            <div class="cx-rail-in">
                <template x-if="screen === 'page' && pageData">
                    <div>
                        <section class="cx-box cx-box--outline" aria-label="Outline" x-show="toc.length >= 2">
                            <h2>Outline</h2>
                            <ul class="cx-outline">
                                <template x-for="t in toc" :key="t.id">
                                    <li><a :href="'#' + t.id" @click="tocActive = t.id" :class="{ on: tocActive === t.id, sub: t.level === 3 }" :aria-current="tocActive === t.id ? 'location' : null" x-text="t.text"></a></li>
                                </template>
                            </ul>
                        </section>
                        <section class="cx-box cx-box--local" aria-label="Local graph" x-show="localGraph">
                            <h2>Local graph</h2>
                            <a class="local-graph" :href="graphUrl(page.id)" aria-label="Open the graph view">
                                <svg class="gv-svg" id="localSvg" viewBox="0 0 240 160" aria-hidden="true"></svg>
                                <span class="local-open">Open graph view →</span>
                            </a>
                        </section>
                        <section class="cx-box" aria-label="Linked from">
                            <h2>Linked from · <span x-text="linkedFrom.length"></span></h2>
                            <p class="cx-box-empty" x-show="linkedFrom.length === 0">No other page links here yet.</p>
                            <ul x-show="linkedFrom.length">
                                <template x-for="b in linkedFrom" :key="b.id">
                                    <li><a :href="pageUrl(b)" x-text="b.title"></a><small class="muted" x-show="b.aliases.length" x-text="'as ' + b.aliases.map((a) => '“' + a + '”').join(', ')"></small></li>
                                </template>
                            </ul>
                        </section>
                    </div>
                </template>
                <template x-if="codex">
                    <section class="cx-box" id="wanted" aria-label="Wanted pages">
                        <h2>Wanted pages</h2>
                        <p class="cx-box-empty" x-show="codex.wanted.length === 0">Every link in this codex leads somewhere.</p>
                        <ul x-show="codex.wanted.length">
                            <template x-for="w in codex.wanted.slice(0, screen === 'codex' ? 200 : 10)" :key="w.text">
                                <li><button type="button" class="wikilink wikilink--missing" :title="codex.can_edit ? 'No page yet. Click to create.' : 'No page yet.'" @click="openCreatePage(w.text)" x-text="w.text"></button><small class="muted" x-text="'wanted ' + w.count + (w.count === 1 ? ' time' : ' times')"></small></li>
                            </template>
                        </ul>
                        <p class="cx-box-empty" x-show="screen === 'codex' && codex.wanted.length > 200" x-text="'and ' + (codex.wanted.length - 200) + ' more'"></p>
                        <p class="cx-box-empty" x-show="screen === 'page' && codex.wanted.length > 10"><a :href="'/codices/c/' + encodeURIComponent(codex.codex.id) + '#wanted'" x-text="'All ' + codex.wanted.length + ' on the codex home'"></a></p>
                    </section>
                </template>
                <template x-if="screen === 'codex' && codex">
                    <section class="cx-box" id="recent" aria-label="Recent changes">
                        <h2>Recent changes</h2>
                        <p class="cx-box-empty" x-show="codex.recent.length === 0">Nothing yet.</p>
                        <ul class="recent" x-show="codex.recent.length">
                            <template x-for="r in codex.recent" :key="r.page_id + '-' + r.number">
                                <li x-html="recentHtml(r, false)"></li>
                            </template>
                        </ul>
                    </section>
                </template>
            </div>
        </aside>
    </div>

    <!-- Link preview card (mouse only) -->
    <div class="cx-peek" role="tooltip" x-show="peek.open" x-cloak :style="'left:' + peek.x + 'px;top:' + peek.y + 'px'">
        <strong x-text="peek.title"></strong>
        <p class="cx-peek-where" x-show="peek.where" x-text="peek.where"></p>
        <p class="cx-peek-text" x-text="peek.text"></p>
    </div>

    <!-- Form dialogs -->
    <div class="modal" :class="{ 'modal-open': dlg.type }" @click.self="cancelDlg()" @keydown.escape.window="dlg.type && !confirmDialog.open && cancelDlg()" role="dialog" aria-modal="true" aria-labelledby="dlgTitle">
        <div class="modal-content confirm-modal-content" :class="{ 'cx-dlg--wide': dlgWide }">
            <div class="modal-header">
                <div>
                    <span class="modal-eyebrow" x-text="dlgEyebrow"></span>
                    <h2 id="dlgTitle" x-text="dlgTitle"></h2>
                </div>
                <button type="button" class="modal-close" @click="cancelDlg()" aria-label="Close">&times;</button>
            </div>
            <form class="modal-form" @submit.prevent="submitDlg()" novalidate>
                <template x-if="dlg.type === 'createPage'">
                    <div class="cx-np">
                        <div class="cx-np-fields">
                            <div class="form-group">
                                <label for="dTitle">Title</label>
                                <input type="text" id="dTitle" maxlength="120" autocomplete="off" placeholder="Name the page" x-model="dlg.title" x-ref="dlgFocus">
                            </div>
                            <div class="form-group" x-show="dlg.folders && dlg.folders.length">
                                <label for="dFolder">Folder</label>
                                <select id="dFolder" x-model="dlg.folderId">
                                    <option value="">Top level</option>
                                    <template x-for="o in folderOptions(dlg.folders)" :key="o.id"><option :value="o.id" x-text="o.label" :selected="o.id === dlg.folderId"></option></template>
                                </select>
                            </div>
                        </div>
                        <div class="cx-np-cols">
                            <div class="cx-np-pick">
                                <p class="cx-np-label" id="dTplLabel">Start from</p>
                                <div class="cx-tpl-pick" role="radiogroup" aria-labelledby="dTplLabel" @keydown="onTplKey($event)">
                                    <template x-for="g in tplGroups(dlg.templates)" :key="g.label">
                                        <div class="cx-tpl-group">
                                            <p class="cx-tpl-grouplabel" x-text="g.label"></p>
                                            <div class="cx-tpl-cards">
                                                <template x-for="t in g.items" :key="t.id">
                                                    <button type="button" class="cx-tpl-card" role="radio" :aria-checked="t.id === tplSelected.id ? 'true' : 'false'" :tabindex="t.id === tplSelected.id ? 0 : -1" @click="dlg.tplId = t.id">
                                                        <strong x-text="t.name"></strong>
                                                        <span x-text="t.description"></span>
                                                    </button>
                                                </template>
                                            </div>
                                        </div>
                                    </template>
                                </div>
                                <p class="hint"><button type="button" class="text-link" @click="openTemplates()">Manage templates</button></p>
                            </div>
                            <div class="cx-np-side">
                                <p class="cx-np-label">Preview · <span x-text="tplSelected.name"></span></p>
                                <div class="cx-tpl-preview game-text codex-text" role="region" aria-label="Starting text of the page" tabindex="0" x-html="tplPreviewHtml"></div>
                                <p class="cx-np-tags" x-show="tplSelected.tags.length" x-text="'Adds tags: ' + tplSelected.tags.join(', ')"></p>
                            </div>
                        </div>
                    </div>
                </template>
                <template x-if="dlg.type === 'templates'">
                    <div>
                        <p class="hint" id="dTplsIntro" tabindex="-1">The built-in templates are the same in every codex: copy one to change it. Changing or deleting a template never changes pages already made from it.</p>
                        <ul class="cx-tpl-list">
                            <template x-for="t in dlg.templates" :key="t.id">
                                <li class="cx-tpl-row">
                                    <div class="cx-tpl-info">
                                        <strong x-text="t.name"></strong>
                                        <span class="cx-tpl-badge" x-text="t.by ? 'by ' + t.by : 'Built-in'"></span>
                                        <small x-text="t.description"></small>
                                        <span class="cx-tpl-tags" x-show="t.tags.length"><template x-for="n in t.tags" :key="n"><span class="cx-chip cx-chip--tag" x-text="n"></span></template></span>
                                    </div>
                                    <div class="cx-tpl-acts">
                                        <button type="button" class="text-link" x-show="dlg.canEdit" @click="openCreatePage('', null, t.id)" :aria-label="'Use the ' + t.name + ' template'">Use</button>
                                        <button type="button" class="text-link" x-show="dlg.canEdit && t.id !== 'builtin:blank'" @click="copyTemplate(t)" :aria-label="'Copy the ' + t.name + ' template'">Copy</button>
                                        <button type="button" class="text-link" x-show="dlg.canEdit && t.by" @click="openTemplateEditor(t)" :aria-label="'Edit the ' + t.name + ' template'">Edit</button>
                                        <button type="button" class="text-link cx-tpl-del" x-show="dlg.canEdit && t.by" @click="deleteTemplate(t)" :aria-label="'Delete the ' + t.name + ' template'">Delete</button>
                                    </div>
                                </li>
                            </template>
                        </ul>
                        <p><button type="button" class="campaign-action-btn" x-show="dlg.canEdit" @click="openTemplateEditor(null)">+ New template</button></p>
                    </div>
                </template>
                <template x-if="dlg.type === 'template'">
                    <div>
                        <div class="form-group">
                            <label for="dTplName">Name</label>
                            <input type="text" id="dTplName" maxlength="80" x-model="dlg.name" x-init="$nextTick(() => requestAnimationFrame(() => $el.focus()))">
                        </div>
                        <div class="form-group">
                            <label for="dTplDesc">Description</label>
                            <input type="text" id="dTplDesc" maxlength="160" placeholder="One line, shown in the New page list" x-model="dlg.description">
                        </div>
                        <div class="form-group">
                            <label for="dTplTags">Adds tags</label>
                            <input type="text" id="dTplTags" placeholder="tavern, settlement" x-model="dlg.tags">
                            <p class="hint">Separate tags with commas. A page made from this template gets them.</p>
                        </div>
                        <div class="form-group">
                            <label for="dTplBody">Text</label>
                            <textarea id="dTplBody" class="cx-tpl-body" rows="12" spellcheck="false" x-model="dlg.body"></textarea>
                            <p class="hint">Write {{title}} where the page's title should go and {{date}} for the day it's made. [[ ]] leaves an empty link to fill in.</p>
                        </div>
                    </div>
                </template>
                <template x-if="dlg.type === 'saveTemplate'">
                    <div>
                        <div class="form-group">
                            <label for="dStName">Name</label>
                            <input type="text" id="dStName" maxlength="80" x-model="dlg.name" x-ref="dlgFocus">
                        </div>
                        <div class="form-group">
                            <label for="dStDesc">Description</label>
                            <input type="text" id="dStDesc" maxlength="160" placeholder="One line, shown in the New page list" x-model="dlg.description">
                        </div>
                        <fieldset class="cx-fieldset">
                            <legend>Keep</legend>
                            <label class="cx-check"><input type="radio" name="dStKeep" value="headings" x-model="dlg.keep"><span>Headings only <small>The ## and ### headings, empty. Best for a structure to fill in.</small></span></label>
                            <label class="cx-check"><input type="radio" name="dStKeep" value="all" x-model="dlg.keep"><span>All the text <small>Pictures are not kept.</small></span></label>
                        </fieldset>
                        <label class="cx-check"><input type="checkbox" x-model="dlg.tags"><span>New pages get this page's tags</span></label>
                        <p class="hint">The template belongs to this codex. Anyone who can edit it can use, change or delete it.</p>
                    </div>
                </template>
                <template x-if="dlg.type === 'copyPage'">
                    <div>
                        <div class="form-group">
                            <label for="dCpTitle">Title</label>
                            <input type="text" id="dCpTitle" maxlength="120" autocomplete="off" x-model="dlg.title" x-ref="dlgFocus">
                        </div>
                        <div class="form-group">
                            <label for="dCpCodex">Codex</label>
                            <select id="dCpCodex" x-model="dlg.codexId" @change="onDlgCodexChange()">
                                <template x-for="w in codexChoices" :key="w.id"><option :value="w.id" x-text="w.name" :selected="w.id === dlg.codexId"></option></template>
                            </select>
                        </div>
                        <div class="form-group" x-show="dlg.folders && dlg.folders.length">
                            <label for="dCpFolder">Folder</label>
                            <select id="dCpFolder" x-model="dlg.folderId">
                                <option value="">Top level</option>
                                <template x-for="o in folderOptions(dlg.folders)" :key="o.id"><option :value="o.id" x-text="o.label" :selected="o.id === dlg.folderId"></option></template>
                            </select>
                        </div>
                        <label class="cx-check" x-show="pageData.tags.length"><input type="checkbox" x-model="dlg.copyTags"><span x-text="'Copy its tags (' + pageData.tags.map((t) => t.name).join(', ') + ')'"></span></label>
                        <label class="cx-check" x-show="pageData.images.length"><input type="checkbox" x-model="dlg.copyImages"><span><span x-text="'Copy its ' + countLabel(pageData.images.length, 'image')"></span> <small>The files are duplicated, so each page keeps its own.</small></span></label>
                        <p class="hint">The copy starts its own history at revision 1. Aliases are not copied, and [[links]] stay as written and point at pages of the codex it goes to.</p>
                    </div>
                </template>
                <template x-if="dlg.type === 'folder'">
                    <div>
                        <div class="form-group">
                            <label for="dFolderName">Folder name</label>
                            <input type="text" id="dFolderName" maxlength="80" x-model="dlg.name" x-ref="dlgFocus">
                            <p class="hint">Folders only sort pages. Links and page titles work the same wherever a page is filed.</p>
                        </div>
                    </div>
                </template>
                <template x-if="dlg.type === 'folderMove' || dlg.type === 'pageFolder'">
                    <div>
                        <div class="form-group">
                            <label for="dFolderPick" x-text="dlg.type === 'pageFolder' ? 'Folder' : 'Move into'"></label>
                            <select id="dFolderPick" x-model="dlg.folderId" x-ref="dlgFocus">
                                <option value="">Top level</option>
                                <template x-for="o in folderOptions(dlg.folders, dlg.excludeId)" :key="o.id"><option :value="o.id" x-text="o.label" :disabled="o.disabled" :selected="o.id === dlg.folderId"></option></template>
                            </select>
                        </div>
                    </div>
                </template>
                <template x-if="dlg.type === 'codex'">
                    <div>
                        <div class="form-group">
                            <label for="dName">Name</label>
                            <input type="text" id="dName" maxlength="80" x-model="dlg.name" x-ref="dlgFocus">
                        </div>
                        <div class="form-group">
                            <label for="dDesc">Description (optional)</label>
                            <textarea id="dDesc" rows="6" x-model="dlg.description"></textarea>
                            <p class="hint">Formatting works as on pages. Shown at the top of the codex.</p>
                        </div>
                    </div>
                </template>
                <template x-if="dlg.type === 'rename'">
                    <div>
                        <div class="form-group">
                            <label for="dRename">New title</label>
                            <input type="text" id="dRename" maxlength="120" x-model="dlg.title" x-ref="dlgFocus">
                            <p class="hint">Links to the old title in this codex are rewritten to the new one. Links that use an alias are left alone.</p>
                        </div>
                    </div>
                </template>
                <template x-if="dlg.type === 'aliases'">
                    <div>
                        <div class="form-group">
                            <label for="dAliases">Other names, one per line</label>
                            <textarea id="dAliases" rows="5" x-model="dlg.text" x-ref="dlgFocus"></textarea>
                            <p class="hint">A link like [[Hesk]] reaches this page if "Hesk" is one of its names. Each name is unique within the codex.</p>
                        </div>
                    </div>
                </template>
                <template x-if="dlg.type === 'tags'">
                    <div>
                        <div class="form-group">
                            <label for="dTagInput">Add a tag</label>
                            <input type="text" id="dTagInput" maxlength="120" list="dTagList" autocomplete="off" x-model="dlg.input" x-ref="dlgFocus" @keydown.enter.prevent="addTagInput(dlg)" @keydown.comma.prevent="addTagInput(dlg)">
                            <datalist id="dTagList"><template x-for="t in tagSuggestions" :key="t.id"><option :value="t.name"></option></template></datalist>
                            <p class="hint">Press Enter to add it. Pick one this codex already has, or type a new one. Tags are only labels; click one on a page to list the pages that have it.</p>
                        </div>
                        <ul class="cx-tagpick" aria-label="Tags on this page">
                            <template x-for="n in dlg.names" :key="n"><li><span class="cx-chip cx-chip--tag"><span x-text="n"></span><button type="button" class="cx-chip-x" :aria-label="'Remove the tag ' + n" @click="removeTagName(dlg, n)">&times;</button></span></li></template>
                        </ul>
                        <p class="hint" x-show="dlg.names.length === 0">No tags on this page.</p>
                    </div>
                </template>
                <template x-if="dlg.type === 'tag'">
                    <div>
                        <div class="form-group">
                            <label for="dTagName">Tag name</label>
                            <input type="text" id="dTagName" maxlength="40" x-model="dlg.name" x-ref="dlgFocus">
                            <p class="hint" x-text="dlg.tag ? 'Renaming changes it on every page that has it.' : 'Up to 40 characters. Each name is unique within the codex.'"></p>
                        </div>
                    </div>
                </template>
                <template x-if="dlg.type === 'move'">
                    <div>
                        <div class="form-group">
                            <label for="dMove">Move to</label>
                            <select id="dMove" x-model="dlg.codexId" x-ref="dlgFocus">
                                <template x-for="w in codexChoices" :key="w.id"><option :value="w.id" x-text="w.name" :disabled="w.id === page.codex.id" :selected="w.id === dlg.codexId"></option></template>
                            </select>
                        </div>
                        <p class="hint" x-text="moveWarning"></p>
                    </div>
                </template>
                <div class="notice" role="alert" x-show="dlg.error"><p x-text="dlg.error"></p></div>
                <div class="modal-actions">
                    <button type="submit" class="submit-btn" x-show="dlg.type !== 'templates'" :disabled="dlg.busy" x-text="dlgSubmit"></button>
                    <button type="button" class="btn-cancel" @click="cancelDlg()" x-text="dlg.type === 'templates' ? 'Close' : dlg.type === 'template' && dlg.back ? 'Back' : 'Cancel'"></button>
                </div>
            </form>
        </div>
    </div>

    <!-- Picture lightbox: Esc, the close button or a click on the backdrop closes it; focus goes back to what opened it -->
    <dialog class="cx-lightbox" x-ref="lightbox" aria-labelledby="lbCaption" @click="onLightboxClick($event)">
        <figure>
            <img :src="lightbox.url" :alt="lightbox.caption">
            <figcaption><strong id="lbCaption" x-text="lightbox.caption"></strong><span x-text="lightbox.meta"></span></figcaption>
        </figure>
        <button type="button" class="cx-lightbox-close" aria-label="Close" @click="$refs.lightbox.close()">&times;</button>
    </dialog>

    <!-- Confirm Modal -->
    <div id="confirmModal" class="modal confirm-modal" :class="{ 'modal-open': confirmDialog.open }" @click.self="closeConfirm(false)" @keydown.escape.window="confirmDialog.open && closeConfirm(false)" role="dialog" aria-modal="true" aria-labelledby="confirmModalTitle">
        <div class="modal-content confirm-modal-content">
            <div class="modal-header">
                <div>
                    <span class="modal-eyebrow" x-text="confirmDialog.eyebrow"></span>
                    <h2 id="confirmModalTitle" x-text="confirmDialog.title"></h2>
                </div>
                <button type="button" class="modal-close" @click="closeConfirm(false)" aria-label="Close">&times;</button>
            </div>
            <div class="modal-form">
                <p class="confirm-modal-message" x-text="confirmDialog.message"></p>
                <div class="modal-actions">
                    <button type="button" :class="confirmDialog.danger ? 'btn-confirm-danger' : 'submit-btn'" @click="closeConfirm(true)" x-text="confirmDialog.confirmLabel"></button>
                    <button type="button" class="btn-cancel" x-ref="confirmCancelBtn" @click="closeConfirm(false)">Cancel</button>
                </div>
            </div>
        </div>
    </div>

    <script src="/static/notifications.js?v=11"></script>
    <script src="/campaigns.js?v=63"></script>
    <script src="/static/journal.js?v=1"></script>
    <script src="/static/codex-editor.js?v=3"></script>
    <script src="/static/codex-graph.js?v=3"></script>
    <script src="/static/codex.js?v=22"></script>
</body>
</html>
