<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Waystone - Dashboard</title>
    <script src="/static/theme.js?v=4"></script>
    <link rel="stylesheet" href="/static/styles.css?v=35">
    <link rel="stylesheet" href="dashboard.css?v=5">
    <link rel="stylesheet" href="/static/notifications.css?v=7">
    <script defer src="/static/vendor/alpinejs.min.js"></script>
</head>
<body x-data="dashboardPage()">
    <div class="header">
        <div class="header-left">
            <a href="/" class="logo">Waystone</a>
        </div>
        <nav class="nav-bar" aria-label="Main">
            <a href="/" class="nav-item active" aria-current="page" data-page="dashboard">Dashboard</a>
            <a href="/campaigns" class="nav-item" data-page="campaigns">Games</a>
            <a href="/profile" class="nav-item" data-page="profile">Profile</a>
            <a href="/admin/users" class="nav-item" data-page="admin-users" x-show="isAdmin">Admin</a>
        </nav>
        <div class="header-right">
            <span class="user-name" x-text="displayName"></span>
            <button @click="handleLogout()" class="logout-btn">Logout</button>
        </div>
    </div>

    <div class="container">
        <h1 class="page-title"><span class="drop-cap">D</span>ashboard</h1>
        <div class="dashboard">
            <h2 class="section-header">Select a Module</h2>
            
            <div class="modules-grid">
                <!-- Games (Active) -->
                <a href="/campaigns" class="module-card active">
                    <div class="card-inner">
                        <h3>Games</h3>
                        <p class="description">Session scheduling &amp; sign-ups</p>
                        <span class="status-badge">Active</span>
                    </div>
                </a>

                <!-- Chat Games (Disabled) -->
                <div class="module-card disabled">
                    <div class="card-inner">
                        <h3>Chat Games</h3>
                        <p class="description">Interactive Games</p>
                        <span class="status-badge coming-soon">Coming Soon</span>
                    </div>
                </div>

                <!-- Anevion Wiki (Disabled) -->
                <div class="module-card disabled">
                    <div class="card-inner">
                        <h3>Anevion Wiki</h3>
                        <p class="description">World Database</p>
                        <span class="status-badge coming-soon">Coming Soon</span>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script src="/static/notifications.js?v=8"></script>
    <script src="dashboard.js?v=1"></script>
</body>
</html>
