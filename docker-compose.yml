version: '3.8'

services:
  waystone-web:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "8080:8080"
    environment:
      - PORT=8080
      - ADMIN_USERNAME=${ADMIN_USERNAME:-admin}
      - ADMIN_PASSWORD=${ADMIN_PASSWORD}
      - SESSION_SECRET=${SESSION_SECRET:?SESSION_SECRET must be set (min 32 chars; openssl rand -base64 32)}
    restart: unless-stopped
    volumes:
      - waystone-data:/root/data

volumes:
  waystone-data:

